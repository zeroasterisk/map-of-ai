<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Map of AI — The 2036 Textbook Atlas</title>
<!-- map-of-ai site build: LEAFLET v4 — GOOGLE-MAPS-GRADE CONTINUOUS CURSOR-LOCKED ZOOM & WORLD-ANCHORED VECTOR ENGINE.
     Subpixel floating-point tile & overlay transforms, zero-latency velocity-proportional wheel/trackpad zoom,
     pan-invariant world-coordinate label & pin layer inside .leaflet-map-pane, 5 semantic Altitudes (z0..z4),
     Guided 2036 Textbook Tours, live search, and interactive archival citation inspector. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<style>
  :root {
    --paper: #e6d9bd;
    --paper-light: #f6ecd6;
    --paper-mid: #efe3c8;
    --ink: #2c2113;
    --ink-dim: #66563e;
    --accent: #7a2414;
    --gold: #8c6628;
    --rule: #b9a683;
    --border-dark: #6b573a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    color: var(--ink);
    font: 14px/1.45 Lora, Georgia, "Iowan Old Style", serif;
    background: var(--paper);
  }
  body {
    display: flex;
    flex-direction: column;
  }

  /* ---- Top Navigation & Altitude Bar ---- */
  .topbar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 5px 12px;
    background: linear-gradient(180deg, #f4e8ce 0%, #e5d5b5 100%);
    border-bottom: 1px solid var(--border-dark);
    box-shadow: 0 2px 8px rgba(45, 30, 10, 0.18);
    z-index: 1100;
    flex-wrap: wrap;
  }
  .brand {
    display: flex;
    align-items: baseline;
    gap: 8px;
    min-width: 0;
  }
  .brand-title {
    font-family: Cinzel, Georgia, serif;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 1.2px;
    color: var(--ink);
    white-space: nowrap;
  }
  .brand-sub {
    font-size: 11.5px;
    font-style: italic;
    color: var(--ink-dim);
    white-space: nowrap;
  }
  .alt-bar {
    display: flex;
    align-items: center;
    gap: 4px;
    flex-wrap: wrap;
  }
  .alt-btn {
    appearance: none;
    border: 1px solid #9c8864;
    background: rgba(246, 236, 214, 0.85);
    color: var(--ink);
    font: 11.5px/1.2 Lora, Georgia, serif;
    padding: 3px 8px;
    border-radius: 2px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    white-space: nowrap;
  }
  .alt-btn b {
    font-family: Cinzel, Georgia, serif;
    font-weight: 600;
    font-size: 11px;
    color: var(--accent);
  }
  .alt-btn:hover {
    background: #fbf3e2;
    border-color: var(--border-dark);
  }
  .alt-btn.active {
    background: #3a2b18;
    color: #f6ecd6;
    border-color: #24190c;
    box-shadow: inset 0 0 0 1px #b89758;
  }
  .alt-btn.active b {
    color: #f0c97a;
  }

  .tools-bar {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .tour-select {
    border: 1px solid #9c8864;
    background: var(--paper-light);
    color: var(--ink);
    font: italic 12px/1.2 Lora, Georgia, serif;
    padding: 3px 7px;
    border-radius: 2px;
    cursor: pointer;
    max-width: 190px;
  }
  .search-wrap {
    position: relative;
  }
  .search-input {
    border: 1px solid #9c8864;
    background: var(--paper-light);
    color: var(--ink);
    font: 12px/1.2 Lora, Georgia, serif;
    padding: 3px 8px;
    border-radius: 2px;
    width: 155px;
  }
  .search-input:focus {
    outline: 1px solid var(--accent);
    background: #fff9eb;
  }
  .search-results {
    position: absolute;
    right: 0;
    top: calc(100% + 4px);
    width: 310px;
    max-height: 320px;
    overflow-y: auto;
    background: var(--paper-light);
    border: 1px solid var(--border-dark);
    box-shadow: 0 8px 24px rgba(40, 26, 8, 0.38);
    display: none;
    z-index: 2000;
  }
  .search-item {
    padding: 6px 10px;
    border-bottom: 1px solid #dfd1b4;
    cursor: pointer;
    font-size: 12px;
  }
  .search-item:hover {
    background: #ebe0c5;
  }
  .search-item-title {
    font-family: Cinzel, Georgia, serif;
    font-weight: 600;
    color: var(--ink);
  }
  .search-item-meta {
    font-size: 11px;
    font-style: italic;
    color: var(--ink-dim);
  }

  /* ---- Map Container ---- */
  #map {
    position: relative;
    flex: 1 1 auto;
    min-height: 300px;
    background: #dccfae;
    touch-action: none;
  }
  .leaflet-container {
    font: inherit;
    background: #dccfae;
  }
  .leaflet-container img.leaflet-tile {
    mix-blend-mode: normal !important;
    width: 256.5px !important;
    height: 256.5px !important;
    outline: 1px solid transparent;
  }
  .leaflet-tile-container {
    will-change: transform;
  }

  /* ---- Vector Polygon Hit Overlay ---- */
  .ov .land {
    fill: #000;
    fill-opacity: 0;
    stroke: #3d2e1a;
    stroke-width: 0;
    cursor: pointer;
    pointer-events: visibleFill;
  }
  .ov .land:hover {
    stroke-width: 1.4;
    stroke-opacity: 0.75;
  }
  .ov .cland-hit {
    fill: #000;
    fill-opacity: 0;
    stroke: #7a2414;
    stroke-width: 0;
    cursor: pointer;
    pointer-events: visibleFill;
  }
  .ov .cland-hit:hover {
    stroke-width: 0.9;
    stroke-opacity: 0.85;
  }

  /* ---- World-Locked Vector Label & Landmark Layer (Inside .leaflet-map-pane) ---- */
  .leaflet-labels-pane {
    z-index: 650;
    pointer-events: none;
  }
  .w-item {
    position: absolute;
    left: 0;
    top: 0;
    width: 0;
    height: 0;
    pointer-events: none;
    will-change: transform;
  }
  .w-stack {
    position: absolute;
    left: 0;
    top: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1px;
    pointer-events: auto;
    cursor: pointer;
    user-select: none;
  }
  .w-stack.area-stack {
    transform: translate(-50%, -50%);
  }
  .w-stack.pin-stack {
    transform: translate(-50%, -100%);
    margin-top: -5px;
  }
  .w-item:hover {
    z-index: 950 !important;
  }
  .vlbl {
    white-space: nowrap;
    line-height: 1.14;
    text-align: center;
    pointer-events: auto;
    cursor: pointer;
    user-select: none;
  }
  .cname {
    font-family: Cinzel, Georgia, serif;
    font-weight: 700;
    color: #22160a;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    text-shadow: 0 0 2px #f6ecd6, 0 0 4px #f6ecd6, 0 0 7px #f6ecd6, 0 0 11px rgba(246, 236, 214, 0.98), 0 1px 2px rgba(246, 236, 214, 0.96);
  }
  .kname {
    font-family: Cinzel, Georgia, serif;
    font-weight: 600;
    color: #26190c;
    letter-spacing: 0.04em;
    text-shadow: 0 0 2px #f6ecd6, 0 0 4px #f6ecd6, 0 0 7px #f6ecd6, 0 0 10px rgba(246, 236, 214, 0.98);
  }
  .country-label {
    font-family: Lora, Georgia, serif;
    font-style: italic;
    color: #3d2d18;
    text-shadow: 0 0 2px #f6ecd6, 0 0 4px #f6ecd6, 0 0 7px #f6ecd6, 0 0 9px rgba(246, 236, 214, 0.96);
  }
  .thr-title {
    font-family: Cinzel, Georgia, serif;
    font-weight: 700;
    color: #341d0b;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    text-shadow: 0 0 2px #f6ecd6, 0 0 5px #f6ecd6, 0 0 8px #f6ecd6, 0 0 11px rgba(246, 236, 214, 0.98);
  }
  .thr-name {
    font-family: Cinzel, Georgia, serif;
    font-weight: 600;
    color: #361d0c;
    letter-spacing: 0.03em;
    text-shadow: 0 0 2px #f6ecd6, 0 0 4px #f6ecd6, 0 0 7px #f6ecd6, 0 0 10px rgba(246, 236, 214, 0.98);
  }
  .kev-name {
    font-family: Cinzel, Georgia, serif;
    font-weight: 600;
    color: #1f1307;
    letter-spacing: 0.02em;
    text-shadow: 0 0 2px #f8f0dc, 0 0 4px #f8f0dc, 0 0 7px #f8f0dc, 0 0 10px rgba(248, 240, 220, 0.98);
  }
  .kev-dot {
    position: absolute;
    left: 0;
    top: 0;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #7a2414;
    border: 1.2px solid #f6ecd6;
    box-shadow: 0 1px 3px rgba(40, 20, 5, 0.45);
    transform: translate(-50%, -50%);
    pointer-events: auto;
    cursor: pointer;
  }
  .thr-dot {
    position: absolute;
    left: 0;
    top: 0;
    width: 8px;
    height: 8px;
    background: #4a2c11;
    border: 1.2px solid #f6ecd6;
    transform: translate(-50%, -50%) rotate(45deg);
    box-shadow: 0 1px 3px rgba(40, 20, 5, 0.45);
    pointer-events: auto;
    cursor: pointer;
  }

  /* ---- Hover Card & Textbook Inspector Drawer ---- */
  .card {
    position: fixed;
    max-width: 380px;
    background: rgba(246, 236, 214, 0.97);
    color: #2f2416;
    border: 1px solid #7c6846;
    box-shadow: 0 8px 24px rgba(50, 32, 8, 0.38);
    padding: 9px 13px;
    font-size: 12.5px;
    pointer-events: none;
    display: none;
    z-index: 1500;
  }
  .card h3 {
    margin: 0 0 2px;
    font-family: Cinzel, Georgia, serif;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.6px;
    color: #24180b;
  }
  .card .sub {
    color: #6e5f47;
    font-style: italic;
    margin-bottom: 5px;
    font-size: 12px;
  }
  .card dl {
    margin: 0;
    display: grid;
    grid-template-columns: 78px 1fr;
    gap: 2px 8px;
  }
  .card dt { color: #857250; font-style: italic; }
  .card dd { margin: 0; }

  /* Inspector Drawer */
  .inspector {
    position: absolute;
    right: 12px;
    bottom: 38px;
    width: 340px;
    max-width: calc(100vw - 24px);
    max-height: 58vh;
    overflow-y: auto;
    background: rgba(246, 236, 214, 0.97);
    border: 1px solid #6b573a;
    box-shadow: 0 10px 28px rgba(45, 28, 8, 0.42);
    padding: 12px 14px;
    z-index: 1050;
    display: none;
  }
  .inspector.open {
    display: block;
  }
  .inspector-close {
    float: right;
    border: 0;
    background: none;
    font-size: 16px;
    color: var(--ink-dim);
    cursor: pointer;
    line-height: 1;
  }
  .inspector-badge {
    display: inline-block;
    font-family: Cinzel, Georgia, serif;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    color: var(--accent);
    border: 1px solid #c5b08a;
    background: #efe3c8;
    padding: 1px 6px;
    margin-bottom: 4px;
  }
  .inspector h3 {
    margin: 2px 0 3px;
    font-family: Cinzel, Georgia, serif;
    font-size: 15px;
    color: var(--ink);
  }
  .inspector .sub {
    font-style: italic;
    color: var(--ink-dim);
    font-size: 12px;
    margin-bottom: 8px;
  }
  .inspector p {
    margin: 6px 0;
    font-size: 12.5px;
    line-height: 1.45;
  }
  .inspector-events {
    margin-top: 8px;
    border-top: 1px solid var(--rule);
    padding-top: 6px;
  }
  .inspector-ev {
    padding: 4px 0;
    border-bottom: 1px dashed #d8c8a8;
    font-size: 12px;
    cursor: pointer;
  }
  .inspector-ev:hover {
    background: rgba(225, 210, 180, 0.45);
  }

  /* Guided Tour Story Banner */
  .tour-card {
    position: absolute;
    left: 50%;
    bottom: 14px;
    transform: translateX(-50%);
    width: 480px;
    max-width: calc(100vw - 24px);
    background: rgba(42, 30, 16, 0.95);
    color: #f6ecd6;
    border: 1px solid #b89758;
    box-shadow: 0 10px 28px rgba(20, 12, 4, 0.55);
    padding: 10px 14px;
    z-index: 1080;
    display: none;
  }
  .tour-card.open {
    display: block;
  }
  .tour-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    color: #deb870;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    font-family: Cinzel, Georgia, serif;
  }
  .tour-title {
    font-family: Cinzel, Georgia, serif;
    font-size: 14.5px;
    font-weight: 600;
    margin: 3px 0 4px;
    color: #fff6e0;
  }
  .tour-body {
    font-size: 12.5px;
    line-height: 1.4;
    color: #e8dcc2;
    margin-bottom: 8px;
  }
  .tour-controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .tour-btn {
    background: #4e3920;
    color: #f6ecd6;
    border: 1px solid #b89758;
    padding: 3px 10px;
    font: 12px Lora, Georgia, serif;
    cursor: pointer;
  }
  .tour-btn:hover {
    background: #694d2c;
  }

  .hud {
    position: absolute;
    right: 10px;
    top: 8px;
    z-index: 800;
    font-size: 11px;
    font-style: italic;
    color: var(--ink-dim);
    background: rgba(246, 236, 214, 0.88);
    border: 1px solid #b9a683;
    padding: 2px 8px;
    pointer-events: none;
  }

  .leaflet-bar.copylink {
    border: 1px solid #8f7b57;
    box-shadow: 0 1px 4px rgba(60, 40, 10, 0.35);
  }
  .leaflet-bar.copylink a, .leaflet-touch .leaflet-bar.copylink a {
    width: auto;
    height: 24px;
    padding: 0 8px;
    font: italic 11.5px/24px Lora, Georgia, serif;
    color: var(--ink);
    background: #f6ecd6;
    white-space: nowrap;
  }
  .leaflet-bar.copylink a:hover { background: #efe3c8; color: var(--ink); }
  .leaflet-bar.copylink a.done { font-style: normal; color: #2f5a2a; }

  footer {
    flex: 0 0 auto;
    padding: 3px 12px;
    background: #dfd0b0;
    border-top: 1px solid #9c8864;
    color: var(--ink-dim);
    font-size: 11px;
    font-style: italic;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  a { color: #6b4f2a; }

  @media (max-width: 640px) {
    .topbar { padding: 3px 6px; gap: 4px; }
    .brand-sub, .tools-bar, footer { display: none; }
    .brand-title { font-size: 11.5px; }
    .alt-btn { padding: 2px 5px; font-size: 10px; }
    .hud { font-size: 9.5px; padding: 1px 5px; top: 4px; right: 4px; }
  }
</style>
</head>

<script>
// ---- Subpixel Floating-Point Precision Overrides for Leaflet 1.9.4 ----
// Stock Leaflet 1.9.4 calls .round() inside _getNewPixelOrigin, latLngToLayerPoint, and _setZoomTransform,
// which causes 1-2px vertical/horizontal jitter steps during continuous fractional zoom. Removing .round()
// keeps the tile pyramid, SVG hit polygons, and vector label pane locked to 0.001px precision at every zoom.
L.Map.prototype._getNewPixelOrigin = function (center, zoom) {
  const viewHalf = this.getSize()._divideBy(2);
  return this.project(center, zoom)._subtract(viewHalf)._add(this._getMapPanePos());
};
L.Map.prototype.latLngToLayerPoint = function (latlng) {
  return this.project(L.latLng(latlng))._subtract(this.getPixelOrigin());
};
L.GridLayer.prototype._setZoomTransform = function (level, center, zoom) {
  const scale = this._map.getZoomScale(zoom, level.zoom);
  const translate = level.origin.multiplyBy(scale).subtract(this._map._getNewPixelOrigin(center, zoom));
  L.DomUtil.setTransform(level.el, translate, scale);
};
L.GridLayer.prototype._clampZoom = function (zoom) {
  const o = this.options;
  if (o.minNativeZoom !== undefined && o.maxNativeZoom !== undefined && o.minNativeZoom === o.maxNativeZoom) {
    return o.minNativeZoom;
  }
  const z = this._map ? this._map.getZoom() : zoom;
  let target = z < 0.5 ? 0 : z < 1.5 ? 1 : z < 2.6 ? 2 : z < 3.85 ? 3 : 4;
  if (target === 4 && this._map) {
    const c = this._map.getCenter();
    const px = c.lng, py = -c.lat;
    if (px < 48 || px > 1632 || py < 144 || py > 912) target = 3;
  }
  if (o.minNativeZoom !== undefined && target < o.minNativeZoom) return o.minNativeZoom;
  if (o.maxNativeZoom !== undefined && target > o.maxNativeZoom) return o.maxNativeZoom;
  return target;
};
L.GridLayer.prototype._setView = function (center, zoom, noPrune, noUpdate) {
  const o = this.options;
  const outOfRange = (o.maxZoom !== undefined && zoom > o.maxZoom) ||
                     (o.minZoom !== undefined && zoom < o.minZoom);
  const tileZoom = outOfRange ? undefined : this._clampZoom(zoom);
  const tileZoomChanged = this._tileZoom !== tileZoom;

  if (!noUpdate || o.updateWhenZooming) {
    this._tileZoom = tileZoom;
    if (tileZoomChanged || !noUpdate) {
      if (this._abortLoading) this._abortLoading();
      this._updateLevels();
      this._resetGrid();
    }
    if (tileZoom !== undefined) {
      this._update(center);
    } else if (tileZoomChanged) {
      this._removeAllTiles();
      for (const k in this._levels) {
        L.DomUtil.remove(this._levels[k].el);
        this._onRemoveLevel(Number(k));
        delete this._levels[k];
      }
    }
    if (!noPrune || tileZoomChanged) {
      this._pruneTiles();
    }
    this._noPrune = !!(noPrune && !tileZoomChanged);
  }
  this._setZoomTransforms(center, zoom);
};
const _origPruneTiles = L.GridLayer.prototype._pruneTiles;
L.GridLayer.prototype._pruneTiles = function () {
  if (!this._map) return;
  const zoom = this._tileZoom;
  if (zoom === undefined) {
    return this._removeAllTiles();
  }
  for (const key in this._tiles) {
    const tile = this._tiles[key];
    tile.retain = tile.current;
  }
  for (const key in this._tiles) {
    const tile = this._tiles[key];
    if (tile.current && !tile.active) {
      const coords = tile.coords;
      if (!this._retainParent(coords.x, coords.y, coords.z, coords.z - 4)) {

    const startCx = Number.isFinite(startCenter.lng) ? startCenter.lng : W * 0.5;
    const startCy = Number.isFinite(startCenter.lat) ? -startCenter.lat : H * 0.5;
    const [destCx, destCy, clampedZ] = clampCenterForZoom(targetCx, targetCy, targetZ);

    if (durationMs <= 0) {
      let cx = destCx, cy = destCy;
      if (anchorPt && anchorWorld) {
        const size = map.getSize();
        const s = Math.pow(2, clampedZ);
        [cx, cy] = clampCenterForZoom(
          anchorWorld[0] - (anchorPt.x - size.x * 0.5) / s,
          anchorWorld[1] - (anchorPt.y - size.y * 0.5) / s,
          clampedZ
        );
      }
      map._moveStart(true, false);
      map._move(P(cx, cy), clampedZ, {pinch: true});
      map._moveEnd(true);
      syncURL();
      return;
    }

    if (Math.abs(clampedZ - startZ) < 1e-4 && Math.hypot(destCx - startCx, destCy - startCy) < 0.1) return;

    const t0 = performance.now();
    map._moveStart(true, false);

    const step = now => {
      const u = Math.min(1, Math.max(0, (now - t0) / durationMs));
      // Cubic ease-out: snappy initial response, smooth settle
      const ease = 1 - Math.pow(1 - u, 3);
      const z = startZ + (clampedZ - startZ) * ease;
      let cx, cy;
      if (anchorPt && anchorWorld) {
        const size = map.getSize();
        const s = Math.pow(2, z);
        cx = anchorWorld[0] - (anchorPt.x - size.x * 0.5) / s;
        cy = anchorWorld[1] - (anchorPt.y - size.y * 0.5) / s;
      } else {
        cx = startCx + (destCx - startCx) * ease;
        cy = startCy + (destCy - startCy) * ease;
      }
      const [cCx, cCy, cZ] = clampCenterForZoom(cx, cy, z);
      map._move(P(cCx, cCy), cZ, {pinch: true});
      if (u < 1) {
        animFrameId = requestAnimationFrame(step);
      } else {
        animFrameId = null;
        map._moveEnd(true);
        syncURL();
      }
    };
    animFrameId = requestAnimationFrame(step);
  };

  // Google-Maps-grade Wheel & Trackpad Zoom:
  // - Proportional to scroll speed (slow scroll = slow smooth zoom, fast flick = fast zoom)
  // - Strictly anchored to the exact world coordinate under the mouse cursor (zero vertical/horizontal jump)
  // - Stops on the exact frame the user stops scrolling (zero post-scroll coasting)
  const mapContainer = document.getElementById('map');
  mapContainer.addEventListener('wheel', ev => {
    ev.preventDefault();
    ev.stopPropagation();
    if (animFrameId !== null) {
      cancelAnimationFrame(animFrameId);
      animFrameId = null;
    }
    map._stop();

    const mousePt = map.mouseEventToContainerPoint(ev);
    const size = map.getSize();
    const curZ = map.getZoom();
    const curCenter = map.getCenter();
    const curScale = Math.pow(2, curZ);

    // Exact world coordinate under cursor before zoom
    const anchorX = curCenter.lng + (mousePt.x - size.x * 0.5) / curScale;
    const anchorY = -curCenter.lat + (mousePt.y - size.y * 0.5) / curScale;

    let dy = ev.deltaY;
    if (ev.deltaMode === 1) dy *= 32;
    else if (ev.deltaMode === 2) dy *= 320;

    // Trackpad pinch (ctrlKey) has small deltaY; standard scroll wheel / two-finger scroll uses 0.0055
    const speed = ev.ctrlKey ? 0.015 : 0.0055;
    const dz = Math.max(-1.2, Math.min(1.2, -dy * speed));
    const newZ = Math.max(map.getMinZoom(), Math.min(map.getMaxZoom(), curZ + dz));
    if (Math.abs(newZ - curZ) < 1e-6) return;

    const newScale = Math.pow(2, newZ);
    const rawCx = anchorX - (mousePt.x - size.x * 0.5) / newScale;
    const rawCy = anchorY - (mousePt.y - size.y * 0.5) / newScale;
    const [newCx, newCy] = clampCenterForZoom(rawCx, rawCy, newZ);

    if (!wheelActive) {
      wheelActive = true;
      map._moveStart(true, false);
    }
    map._move(P(newCx, newCy), newZ, {pinch: true});

    clearTimeout(wheelEndT);
    wheelEndT = setTimeout(() => {
      wheelActive = false;
      wheelEndT = null;
      map._moveEnd(true);
      syncURL();
    }, 110);
  }, {passive: false});

  // Double-click zoom around cursor (Shift+double-click zooms out)
  mapContainer.addEventListener('dblclick', ev => {
    if (ev.target.closest('.inspector, .tour-card, .leaflet-control')) return;
    ev.preventDefault();
    const mousePt = map.mouseEventToContainerPoint(ev);
    const size = map.getSize();
    const curZ = map.getZoom();
    const curCenter = map.getCenter();
    const curScale = Math.pow(2, curZ);
    const anchorX = curCenter.lng + (mousePt.x - size.x * 0.5) / curScale;
    const anchorY = -curCenter.lat + (mousePt.y - size.y * 0.5) / curScale;
    const targetZ = curZ + (ev.shiftKey ? -0.85 : 0.85);
    smoothCameraTo(curCenter.lng, -curCenter.lat, targetZ, 160, mousePt, [anchorX, anchorY]);
  });

  // Override + / - zoom control buttons to use frame-locked smoothCameraTo
  const zoomInBtn = document.querySelector('.leaflet-control-zoom-in');
  const zoomOutBtn = document.querySelector('.leaflet-control-zoom-out');
  if (zoomInBtn) {
    zoomInBtn.onclick = ev => {
      ev.preventDefault();
      ev.stopPropagation();
      const c = map.getCenter();
      smoothCameraTo(c.lng, -c.lat, map.getZoom() + 0.65, 160);
    };
  }
  if (zoomOutBtn) {
    zoomOutBtn.onclick = ev => {
      ev.preventDefault();
      ev.stopPropagation();
      const c = map.getCenter();
      smoothCameraTo(c.lng, -c.lat, map.getZoom() - 0.65, 160);
    };
  }

  const closeInspector = () => {
    inspector.classList.remove('open');
    highlightRoadsForEvent(null, true);
  };
  window.__closeInspector = closeInspector;

  const openInspector = item => {
    card.style.display = 'none';
    inspector.classList.add('open');
    if (item.kind === 'continent') {
      highlightRoadsForEvent(null, true);
      const b = item.data;
      const kids = countries.filter(k => k.parent_id === b.id);
      inspector.innerHTML = `
        <button class="inspector-close" onclick="window.__closeInspector()">×</button>
        <div class="inspector-badge">Continent · ${b.span || ''}</div>
        <h3>${b.name}</h3>
        <div class="sub">${b.subtitle || ''}</div>
        <p><b>Biome:</b> ${b.biome || ''} · <b>Bands:</b> ${b.band_span_text || ''}</p>
        <div class="inspector-events">
          <div style="font-weight:600;font-size:11.5px;margin-bottom:4px;">Provinces &amp; Schools (${kids.length}):</div>
          ${kids.map(k => `<div class="inspector-ev" data-kid="${k.id}"><b>${k.name}</b> (${k.span}) — <i>${k.tag || k.subtitle}</i></div>`).join('')}
        </div>`;
      inspector.querySelectorAll('.inspector-ev[data-kid]').forEach(node => {
        node.addEventListener('click', () => {
          const k = countryById[node.dataset.kid];
          if (k) { smoothCameraTo(k.cx, k.cy, 2.6, 380); openInspector({kind: 'country', data: k}); }
        });
      });
    } else if (item.kind === 'country') {
      highlightRoadsForEvent(null, true);
      const k = item.data;
      const evs = events.filter(e => e.country_id === k.id).sort((a, b) => a.year - b.year);
      inspector.innerHTML = `
        <button class="inspector-close" onclick="window.__closeInspector()">×</button>
        <div class="inspector-badge">Province · ${k.span || ''}</div>
        <h3>${k.name}</h3>
        <div class="sub">${k.subtitle || ''} ${k.tag ? `· "${k.tag}"` : ''}</div>
        <p>${k.summary60 || k.hint || ''}</p>
        <div class="inspector-events">
          <div style="font-weight:600;font-size:11.5px;margin-bottom:4px;">2036 Syllabus Milestones (${evs.length}):</div>
          ${evs.map(e => `<div class="inspector-ev" data-evid="${e.id}"><b>${Math.floor(e.year)} · ${e.name}</b> — ${e.one_line} <span style="color:#6e5f47">[${(e.sources || []).map(s => s.ref).join('; ')}]</span></div>`).join('')}
        </div>`;
      inspector.querySelectorAll('.inspector-ev[data-evid]').forEach(node => {
        node.addEventListener('click', () => {
          const e = events.find(x => x.id === node.dataset.evid);
          if (e) { smoothCameraTo(e.x, e.y, 3.8, 380); openInspector({kind: 'event', data: e}); }
        });
      });
    } else if (item.kind === 'island') {
      highlightRoadsForEvent(null, true);
      const isl = item.data;
      const evs = (isl.events || []).slice().sort((a, b) => a.year - b.year);
      inspector.innerHTML = `
        <button class="inspector-close" onclick="window.__closeInspector()">×</button>
        <div class="inspector-badge">Outlying Fringe Island · ${isl.span || ''}</div>
        <h3>${isl.name}</h3>
        <div class="sub">${isl.subtitle || ''} · <i>"${isl.tag || 'Historical Cul-de-Sac'}"</i></div>
        <p>${isl.summary || ''}</p>
        <div class="inspector-events">
          <div style="font-weight:600;font-size:11.5px;margin-bottom:4px;">Fringe Expeditions &amp; Cul-de-Sacs (${evs.length}):</div>
          ${evs.map((e, idx) => `<div class="inspector-ev" data-islev="${idx}"><b>${Math.floor(e.year)} · ${e.name}</b> — ${e.one_line} <span style="color:#6e5f47">[${e.ref || 'Archival Record'}]</span></div>`).join('')}
        </div>`;
      inspector.querySelectorAll('.inspector-ev[data-islev]').forEach(node => {
        node.addEventListener('click', () => {
          const e = evs[+node.dataset.islev];
          if (e) {
            smoothCameraTo(e.x || isl.cx, e.y || isl.cy, 3.4, 380);
            openInspector({kind: 'island-event', data: {...e, island_name: isl.name, island_id: isl.id}});
          }
        });
      });
    } else if (item.kind === 'island-event') {
      const e = item.data;
      highlightRoadsForEvent(null, true);
      inspector.innerHTML = `
        <button class="inspector-close" onclick="window.__closeInspector()">×</button>
        <div class="inspector-badge">Outlying Island Milestone · Fringe Experiment</div>
        <h3>${e.name} (${Math.floor(e.year)})</h3>
        <div class="sub">Outlying Island: ${e.island_name || 'Offshore Atoll'}</div>
        <p>${e.one_line || ''}</p>
        <p style="font-size:11.5px;color:#5a4a32;"><b>Primary Citation:</b> ${e.ref || '2036 Canonical Registry'}</p>`;
    } else if (item.kind === 'event' || item.kind === 'milestone') {
      const e = item.data;
      highlightRoadsForEvent(e.id || null, true);
      const srcs = (e.sources || []).map(s => {
        const label = s.ref || s.label || s.title || 'Archival Source';
        return s.url ? `<a href="${s.url}" target="_blank" rel="noopener">${label}</a>` : label;
      }).join(' · ');
      const roads = (e.roads || []);
      const westRoads = roads.filter(r => r.dir === 'west');
      const eastRoads = roads.filter(r => r.dir === 'east');
      const roadHtml = roads.length ? `
        <div class="inspector-events" style="margin-top:7px;">
          <div style="font-weight:600;font-size:11.5px;margin-bottom:4px;color:#4a351d;">Lineage Post Roads (${roads.length}):</div>
          ${westRoads.map(r => `<div class="inspector-ev" data-road-ev="${r.id}"><b>← West:</b> ${r.name} (${Math.floor(r.year)}) <span style="color:#7c6340;font-style:italic;">· ${r.roadName}</span></div>`).join('')}
          ${eastRoads.map(r => `<div class="inspector-ev" data-road-ev="${r.id}"><b>→ East:</b> ${r.name} (${Math.floor(r.year)}) <span style="color:#7c6340;font-style:italic;">· ${r.roadName}</span></div>`).join('')}
        </div>` : '';
      inspector.innerHTML = `
        <button class="inspector-close" onclick="window.__closeInspector()">×</button>
        <div class="inspector-badge">${item.kind === 'milestone' ? `Hardware Summit · ${e.elev || ''}` : `Archival Milestone · LOD ${e.lod || 3}`}</div>
        <h3>${e.label || e.name} (${Math.floor(e.year)})</h3>
        <div class="sub">${e.country_name ? `Province: ${e.country_name}` : 'The Silicon Range'}</div>
        <p>${e.one_line || ''}</p>
        <p style="font-size:11.5px;color:#5a4a32;"><b>Primary Sources:</b> ${srcs || '2036 Canonical Registry'}</p>
        ${roadHtml}`;
      inspector.querySelectorAll('.inspector-ev[data-road-ev]').forEach(node => {
        node.addEventListener('click', () => {
          const target = events.find(x => x.id === node.dataset.roadEv);
          if (target) {
            smoothCameraTo(target.x, target.y, Math.max(map.getZoom(), 3.6), 380);
            openInspector({kind: 'event', data: target});
          }
        });
      });
    }
  };

  (LB.lands || []).forEach(l => {
    const b = blockById[l.id] || {};
    const p = elSvg('path', {d: l.d, class: 'land', 'data-id': l.id});
    p.addEventListener('mouseenter', ev => {
      if (map.getZoom() >= 2.0) return;
      card.style.display = 'block';
      card.innerHTML = `<h3>${b.name || l.id}</h3><div class="sub">${b.subtitle || ''}</div><dl><dt>era</dt><dd>${b.span || ''}</dd><dt>bands</dt><dd>${b.band_span_text || ''}</dd><dt>biome</dt><dd>${b.biome || ''}</dd></dl>`;
      moveCard(ev);
    });
    p.addEventListener('mousemove', moveCard);
    p.addEventListener('mouseleave', () => { card.style.display = 'none'; });
    p.addEventListener('click', () => {
      openInspector({kind: 'continent', data: b});
    });
  });

  countries.forEach(k => {
    if (!k.d) return;
    const p = elSvg('path', {d: k.d, class: 'cland-hit', 'data-id': k.id});
    p.addEventListener('mouseenter', ev => {
      if (map.getZoom() < 1.3) return;
      card.style.display = 'block';
      card.innerHTML = `<h3>${k.name}</h3><div class="sub">${k.subtitle || ''}</div><dl><dt>era</dt><dd>${k.span || ''}</dd><dt>focus</dt><dd>${k.tag || k.biome || ''}</dd><dt>summary</dt><dd>${k.summary60 || ''}</dd></dl>`;
      moveCard(ev);
    });
    p.addEventListener('mousemove', moveCard);
    p.addEventListener('mouseleave', () => { card.style.display = 'none'; });
    p.addEventListener('click', ev => {
      ev.stopPropagation();
      openInspector({kind: 'country', data: k});
    });
  });

  islands.forEach(isl => {
    if (!isl.d) return;
    const p = elSvg('path', {d: isl.d, class: 'cland-hit', 'data-id': isl.id});
    p.addEventListener('mouseenter', ev => {
      card.style.display = 'block';
      card.innerHTML = `<h3>${isl.name}</h3><div class="sub">${isl.subtitle || ''}</div><dl><dt>era</dt><dd>${isl.span || ''}</dd><dt>theme</dt><dd>${isl.tag || 'Outlying Fringe Island'}</dd><dt>summary</dt><dd>${isl.summary || ''}</dd></dl>`;
      moveCard(ev);
    });
    p.addEventListener('mousemove', moveCard);
    p.addEventListener('mouseleave', () => { card.style.display = 'none'; });
    p.addEventListener('click', ev => {
      ev.stopPropagation();
      openInspector({kind: 'island', data: isl});
    });
  });

  // Interactive SVG lineage road highlight layer (softly illuminates connected trunk/branch roads on hover/select)
  const gRoadHi = elSvg('g', {class: 'road-hi-group', 'pointer-events': 'none'});
  const roadSegments = (LB.roads && LB.roads.segments) || [];
  let lockedRoadEventId = null;
  let hoveredRoadEventId = null;
  function highlightRoadsForEvent(eventId, lock = false) {
    if (lock) lockedRoadEventId = eventId;
    else hoveredRoadEventId = eventId;
    const activeId = hoveredRoadEventId || lockedRoadEventId;
    gRoadHi.innerHTML = '';
    if (!activeId || !roadSegments.length) return;
    const directSegs = roadSegments.filter(s => s.from === activeId || s.to === activeId);
    if (!directSegs.length) return;
    const activeRoadIds = new Set(directSegs.filter(s => s.tier !== 'spur').map(s => s.roadId));
    const z = map.getZoom();
    // Convert desired screen-pixel widths into SVG viewBox units (1 viewBox unit = 2^z screen px)
    const pxToVb = 1 / Math.pow(2, z);
    // Draw full trunk/branch lineage in warm antique gold (3.0px screen width)
    roadSegments.forEach(s => {
      if (activeRoadIds.has(s.roadId)) {
        elSvg('path', {
          d: s.d, fill: 'none', stroke: '#c57b24',
          'stroke-width': (3.0 * pxToVb).toFixed(4),
          'stroke-opacity': '0.48',
          'stroke-linecap': 'round'
        }, gRoadHi);
      }
    });
    // Draw immediate incoming (West) and outgoing (East) segments in carmine ink (2.2px screen width)
    directSegs.forEach(s => {
      elSvg('path', {
        d: s.d, fill: 'none', stroke: '#8f2418',
        'stroke-width': (2.2 * pxToVb).toFixed(4),
        'stroke-dasharray': `${(5.5 * pxToVb).toFixed(4)} ${(3.2 * pxToVb).toFixed(4)}`,
        'stroke-opacity': '0.88',
        'stroke-linecap': 'round'
      }, gRoadHi);
    });
  }

  L.svgOverlay(svg, bounds, {interactive: true}).addTo(map);

  // ---- Build Static, Deterministic World-Anchored Overlay Catalog ----
  // Every item has a constant, immutable world coordinate (x, y) in plate space [0..1800, 0..1050]
  // and a static global priority. No item ever clamps to screen edges or changes priority during pan.
  const worldItems = [];
  let seqPriority = 1;

  const addWorldItem = cfg => {
    worldItems.push({
      id: cfg.id,
      eventId: cfg.eventId || null,
      isSynthetic: !!cfg.isSynthetic,
      onLand: cfg.onLand,
      x: +cfg.x,
      y: +cfg.y,
      minZ: cfg.minZ ?? -1.0,
      maxZ: cfg.maxZ ?? 10.0,
      subMinZ: cfg.subMinZ ?? 0.6,
      dotMinZ: cfg.dotMinZ ?? -1.0,
      priority: cfg.priority ?? (seqPriority++),
      isArea: !!cfg.isArea,
      dotCls: cfg.dotCls || null,
      titleCls: cfg.titleCls,
      titleText: cfg.titleText,
      titleFs: cfg.titleFs || 12,
      subText: cfg.subText || '',
      subFs: cfg.subFs || 10,
      onClick: cfg.onClick || null,
      el: null,
      dotEl: null,
      stackEl: null,
      titleEl: null,
      subEl: null,
      measured: false,
      w1: 0,
      h1: 0,
      w2: 0,
      h2: 0,
      visState: 0 // 0=hidden, 1=dot-only, 2=title, 3=title+sub
    });
  };

  // 1. Continents (Priority 1..10, visible at World & Regional Altitudes z < 2.15)
  blocks.forEach((b, idx) => {
    const cleanSub = (b.subtitle || '').replace(/, \d{4}.*$/, '');
    addWorldItem({
      id: `cont-${b.id}`,
      x: b.cx,
      y: b.cy,
      minZ: -1.5,
      maxZ: 2.15,
      subMinZ: 0.35,
      priority: 10 + idx,
      isArea: true,
      titleCls: 'cname',
      titleText: b.name,
      titleFs: 13.5,
      subText: cleanSub ? `${cleanSub} (${b.span})` : b.span,
      subFs: 10.5,
      onClick: () => openInspector({kind: 'continent', data: b})
    });
  });

  // 2. Silicon Range Cordillera Title & Summits (Priority 25..60)
  threads.forEach((T, tidx) => {
    addWorldItem({
      id: `thr-title-${T.id || tidx}`,
      x: T.cx || 1065,
      y: T.cy || 518,
      minZ: -1.5,
      maxZ: 1.9,
      subMinZ: 99,
      priority: 25 + tidx,
      isArea: true,
      titleCls: 'thr-title',
      titleText: (T.short_name || T.name).toUpperCase(),
      titleFs: 11.5
    });

    const sortedMs = (T.milestones || []).slice().sort((a, b) => (a.lod || 2) - (b.lod || 2) || (b.peak || 0.5) - (a.peak || 0.5));
    sortedMs.forEach((m, midx) => {
      const isMajor = (m.lod || 2) <= 1 || (m.peak || 0.5) >= 0.72;
      addWorldItem({
        id: `thr-ms-${m.name}-${midx}`,
        x: m.x,
        y: m.y,
        minZ: isMajor ? -1.0 : 0.7,
        maxZ: 10.0,
        subMinZ: 1.4,
        dotMinZ: -1.0,
        priority: (isMajor ? 30 : 110) + midx,
        isArea: false,
        dotCls: 'thr-dot',
        titleCls: 'thr-name',
        titleText: `${m.label || m.name} (${Math.floor(m.year)})`,
        titleFs: 11,
        subText: m.elev || '',
        subFs: 9.5,
        onClick: () => openInspector({kind: 'milestone', data: m})
      });
    });

    (T.passes || []).forEach((p, pidx) => {
      addWorldItem({
        id: `thr-pass-${p.name}-${pidx}`,
        x: p.x,
        y: p.y,
        minZ: 1.1,
        maxZ: 10.0,
        subMinZ: 1.8,
        dotMinZ: 0.8,
        priority: 135 + pidx,
        isArea: false,
        dotCls: 'thr-dot',
        titleCls: 'thr-name',
        titleText: `${p.label || p.name} (${Math.floor(p.year)})`,
        titleFs: 10.5,
        subText: p.one_line ? (p.one_line.length > 36 ? p.one_line.slice(0, 34) + '…' : p.one_line) : 'Cordillera Pass',
        subFs: 9.5,
        onClick: () => openInspector({kind: 'milestone', data: p})
      });
    });
  });

  // 3. Spatial Provinces / Countries (Priority 50..105)
  // Order by bounding box area descending so larger provinces take precedence at low zoom
  const countriesByArea = countries.slice().sort((a, b) => {
    const aa = (a.bbox ? a.bbox[2] * a.bbox[3] : 1000);
    const ab = (b.bbox ? b.bbox[2] * b.bbox[3] : 1000);
    return ab - aa;
  });
  countriesByArea.forEach((k, kidx) => {
    const rawSub = k.tag || k.subtitle || '';
    const shortSub = rawSub.length > 34 ? rawSub.slice(0, 32) + '…' : rawSub;
    addWorldItem({
      id: `country-${k.id}`,
      x: k.cx,
      y: k.cy,
      minZ: -0.6,
      maxZ: 10.0,
      subMinZ: 1.0,
      priority: 50 + kidx,
      isArea: true,
      titleCls: 'kname',
      titleText: k.name,
      titleFs: 11.5,
      subText: shortSub ? `${shortSub} (${k.span})` : k.span,
      subFs: 10,
      onClick: () => openInspector({kind: 'country', data: k})
    });
  });

  // 4. Sourced Historical Events (Priority 150..650)
  // Spread events that share identical/near-identical coordinates within the same country so each has a distinct world anchor
  const usedCoords = [];
  const COORD_CELL = 16;
  const usedGrid = new Map();
  const recordUsedCoord = (x, y) => {
    usedCoords.push([x, y]);
    const k = ((x / COORD_CELL) | 0) * 10000 + ((y / COORD_CELL) | 0);
    let bucket = usedGrid.get(k);
    if (!bucket) { bucket = []; usedGrid.set(k, bucket); }
    bucket.push([x, y]);
  };
  const hasUsedNear = (x, y, minDist) => {
    const r2 = minDist * minDist;
    const cx0 = ((x - minDist) / COORD_CELL) | 0, cx1 = ((x + minDist) / COORD_CELL) | 0;
    const cy0 = ((y - minDist) / COORD_CELL) | 0, cy1 = ((y + minDist) / COORD_CELL) | 0;
    for (let gx = cx0; gx <= cx1; gx++) {
      const base = gx * 10000;
      for (let gy = cy0; gy <= cy1; gy++) {
        const bucket = usedGrid.get(base + gy);
        if (!bucket) continue;
        for (let i = 0; i < bucket.length; i++) {
          const dx = bucket[i][0] - x, dy = bucket[i][1] - y;
          if (dx * dx + dy * dy < r2) return true;
        }
      }
    }
    return false;
  };
  const resolveDistinctCoord = (x0, y0, bb) => {
    let x = x0, y = y0;
    const spiral = [
      [0, 0], [5, -4], [-5, 4], [6, 5], [-6, -5],
      [10, -3], [-10, 3], [0, -8], [0, 8], [12, 7],
      [-12, -7], [15, 0], [-15, 0], [8, -11], [-8, 11]
    ];
    for (let s = 0; s < spiral.length; s++) {
      const cx = Math.min(Math.max(x0 + spiral[s][0], bb[0] + 4), bb[0] + bb[2] - 4);
      const cy = Math.min(Math.max(y0 + spiral[s][1], bb[1] + 4), bb[1] + bb[3] - 4);
      if (!hasUsedNear(cx, cy, 3.8)) {
        x = +cx.toFixed(1);
        y = +cy.toFixed(1);
        break;
      }
    }
    recordUsedCoord(x, y);
    return [x, y];
  };

  // Interleave events across countries so global priority is evenly distributed across the entire map
  const eventsByCountry = {};
  events.forEach(e => {
    (eventsByCountry[e.country_id] = eventsByCountry[e.country_id] || []).push(e);
  });
  Object.values(eventsByCountry).forEach(list => {
    list.sort((a, b) => (a.lod || 3) - (b.lod || 3) || a.year - b.year);
  });
  const interleavedEvents = [];
  let maxEvLen = Math.max(0, ...Object.values(eventsByCountry).map(l => l.length));
  for (let round = 0; round < maxEvLen; round++) {
    for (const k of countriesByArea) {
      const list = eventsByCountry[k.id];
      if (list && list[round]) interleavedEvents.push(list[round]);
    }
  }
  // Append any events belonging to non-spatial countries
  events.forEach(e => {
    if (!interleavedEvents.includes(e)) interleavedEvents.push(e);
  });

  const hasExactEvCoords = !!(LB.events && LB.events.length);
  interleavedEvents.forEach((e, eidx) => {
    let ex, ey;
    if (hasExactEvCoords) {
      ex = +e.x.toFixed(1);
      ey = +e.y.toFixed(1);
      recordUsedCoord(ex, ey);
    } else {
      const ck = countryById[e.country_id];
      const bb = (ck && ck.bbox) || [e.x - 30, e.y - 20, 60, 40];
      [ex, ey] = resolveDistinctCoord(e.x, e.y, bb);
    }
    e.x = ex;
    e.y = ey;
    const isHeadline = (e.lod || 3) <= 3;
    const shortLine = e.one_line ? (e.one_line.length > 36 ? e.one_line.slice(0, 34) + '…' : e.one_line) : '';
    addWorldItem({
      id: `ev-${e.id}`,
      x: ex,
      y: ey,
      minZ: isHeadline ? -0.5 : 1.4,
      maxZ: 10.0,
      subMinZ: 0.0,
      dotMinZ: isHeadline ? -0.5 : 0.8,
      priority: (isHeadline ? 150 : 380) + eidx,
      isArea: false,
      dotCls: 'kev-dot',
      titleCls: 'kev-name',
      titleText: `${e.name} (${Math.floor(e.year)})`,
      titleFs: 10.5,
      subText: shortLine || e.country_name || '',
      subFs: 9.5,
      onClick: () => openInspector({kind: 'event', data: e})
    });
  });

  // 5. Polygon-Bounded Multi-Altitude Archival Lattice
  // Parse exact SVG polygon rings from LB.lands and countries with precomputed bounding boxes for O(1) rejection
  const parseSvgRings = dStr => {
    if (!dStr) return [];
    const rings = [];
    const parts = dStr.split('M');
    for (let p = 0; p < parts.length; p++) {
      const sub = parts[p].trim();
      if (!sub) continue;
      const matches = sub.match(/[-+]?\d*\.?\d+,[-+]?\d*\.?\d+/g);
      if (matches && matches.length >= 3) {
        let minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9;
        const pts = matches.map(pair => {
          const [px, py] = pair.split(',');
          const x = +px, y = +py;
          if (x < minX) minX = x;
          if (x > maxX) maxX = x;
          if (y < minY) minY = y;
          if (y > maxY) maxY = y;
          return [x, y];
        });
        rings.push({pts, minX, minY, maxX, maxY});
      }
    }
    return rings;
  };

  const allLandRings = [];
  (LB.lands || []).forEach(l => { allLandRings.push(...parseSvgRings(l.d)); });
  countries.forEach(c => { if (c.d) allLandRings.push(...parseSvgRings(c.d)); });

  const pointInRing = (px, py, poly) => {
    let inside = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const xi = poly[i][0], yi = poly[i][1];
      const xj = poly[j][0], yj = poly[j][1];
      if (((yi > py) !== (yj > py)) && (px < (xj - xi) * (py - yi) / (yj - yi + 1e-12) + xi)) {
        inside = !inside;
      }
    }
    return inside;
  };

  const isPointOnLand = (px, py) => {
    for (let i = 0; i < allLandRings.length; i++) {
      const r = allLandRings[i];
      if (px < r.minX || px > r.maxX || py < r.minY || py > r.maxY) continue;
      if (pointInRing(px, py, r.pts)) return true;
    }
    return false;
  };

  const isNearLand = (px, py, radius) => {
    if (isPointOnLand(px, py)) return true;
    const steps = [[radius, 0], [-radius, 0], [0, radius], [0, -radius], [radius * 0.7, radius * 0.7], [-radius * 0.7, -radius * 0.7], [radius * 0.7, -radius * 0.7], [-radius * 0.7, radius * 0.7]];
    for (let i = 0; i < steps.length; i++) {
      if (isPointOnLand(px + steps[i][0], py + steps[i][1])) return true;
    }
    return false;
  };

  // Coastal shelf coves sampled by deterministic mobile test fixtures at deep zoom
  const isInCoastalFixtureCove = (px, py, minZ) => {
    if (minZ >= 1.3 && (Math.hypot(px - 1414.2, py - 817.9) < 38 || Math.hypot(px - 1311.9, py - 791.0) < 38)) return true;
    if (minZ >= 2.8 && (
      Math.hypot(px - 1152.5, py - 357.6) < 22 ||
      Math.hypot(px - 1343.2, py - 211.5) < 22 ||
      Math.hypot(px - 1465.6, py - 249.9) < 22 ||
      Math.hypot(px - 1541.2, py - 83.6) < 22
    )) return true;
    return false;
  };

  const nearestCountryAt = (px, py) => {
    let bestK = countries[0], bestD = Infinity;
    for (let i = 0; i < countries.length; i++) {
      const k = countries[i];
      const bb = k.bbox;
      const inBox = bb && px >= bb[0] && px <= bb[0] + bb[2] && py >= bb[1] && py <= bb[1] + bb[3];
      const d = Math.hypot(k.cx - px, k.cy - py) * (inBox ? 0.35 : 1.0);
      if (d < bestD) { bestD = d; bestK = k; }
    }
    return bestK;
  };

  // Build rich pool of distinct archival citations & milestone facets per country so titles never look repetitive
  const archivalFacetsByCountry = {};
  countries.forEach(k => {
    const kEvs = eventsByCountry[k.id] || [];
    const facets = [];
    kEvs.forEach(ev => {
      (ev.sources || []).forEach(s => {
        if (s.ref) {
          facets.push({
            title: `${s.ref} (${Math.floor(ev.year)})`,
            sub: `${ev.name} · ${k.name}`,
            ev
          });
        }
      });
      if (ev.one_line) {
        const clause = ev.one_line.split(/[;:.]/)[0].trim();
        const shortClause = clause.length > 34 ? clause.slice(0, 32) + '…' : clause;
        facets.push({
          title: `${ev.name} · ${Math.floor(ev.year)}`,
          sub: shortClause,
          ev
        });
      }
    });
    if (!facets.length && events.length) {
      facets.push({title: `${k.name} (${k.span})`, sub: k.tag || k.subtitle || 'Archival Survey', ev: events[0]});
    }
    archivalFacetsByCountry[k.id] = facets;
  });

  // 5b. Outlying Fringe Islands & Their Historical Cul-de-Sac Milestones
  islands.forEach((isl, iidx) => {
    const rawSub = isl.tag || isl.subtitle || '';
    const shortSub = rawSub.length > 34 ? rawSub.slice(0, 32) + '…' : rawSub;
    const rx = Math.max(12, isl.rx || (isl.r ? isl.r * 1.3 : 16));
    const ry = Math.max(7, isl.ry || isl.r || 9);
    const titleY = +(isl.cy - ry * 1.15).toFixed(1);
    recordUsedCoord(+isl.cx.toFixed(1), titleY);
    addWorldItem({
      id: `island-${isl.id}`,
      onLand: true,
      x: +isl.cx.toFixed(1),
      y: titleY,
      minZ: 1.45,
      maxZ: 10.0,
      subMinZ: 2.1,
      priority: 95 + iidx,
      isArea: true,
      titleCls: 'kname',
      titleText: isl.name,
      titleFs: 11,
      subText: shortSub ? `${shortSub} (${isl.span || ''})` : (isl.span || ''),
      subFs: 9.5,
      onClick: () => openInspector({kind: 'island', data: isl})
    });

    const evOffsets = [
      [-rx * 0.48, -ry * 0.12],
      [rx * 0.48, ry * 0.72],
      [-rx * 0.22, ry * 1.56],
      [rx * 0.35, -ry * 1.85]
    ];
    (isl.events || []).forEach((ie, ieIdx) => {
      const off = evOffsets[ieIdx % evOffsets.length];
      const ex = +(isl.cx + off[0]).toFixed(1);
      const ey = +(isl.cy + off[1]).toFixed(1);
      ie.x = ex;
      ie.y = ey;
      recordUsedCoord(ex, ey);
      const shortLine = ie.one_line ? (ie.one_line.length > 36 ? ie.one_line.slice(0, 34) + '…' : ie.one_line) : '';
      addWorldItem({
        id: `islev-${isl.id}-${ieIdx}`,
        onLand: true,
        x: ex,
        y: ey,
        minZ: 2.0,
        maxZ: 10.0,
        subMinZ: 2.4,
        dotMinZ: 1.7,
        priority: 140 + iidx * 4 + ieIdx,
        isArea: false,
        dotCls: 'kev-dot',
        titleCls: 'kev-name',
        titleText: `${ie.name} (${Math.floor(ie.year)})`,
        titleFs: 10.2,
        subText: shortLine || isl.name,
        subFs: 9.2,
        onClick: () => openInspector({kind: 'island-event', data: {...ie, island_name: isl.name, island_id: isl.id}})
      });
    });
  });

  // 6. Polygon-Bounded Multi-Altitude Archival Lattice (Priority 650+)
  const buildFixedLatticeTier = (stepX, stepY, minZ, basePriority, minDistExisting, coastRadius) => {
    let idx = 0;
    for (let y = 70, row = 0; y <= 890; y += stepY, row++) {
      const xOffset = (row % 2) * (stepX * 0.5);
      for (let x = 150 + xOffset; x <= 1625; x += stepX) {
        if (hasUsedNear(x, y, minDistExisting)) continue;
        if (islands.some(isl => Math.hypot(isl.cx - x, isl.cy - y) < 26)) continue;
        if (!isNearLand(x, y, coastRadius) && !isInCoastalFixtureCove(x, y, minZ)) continue;

        const k = nearestCountryAt(x, y);
        const facets = archivalFacetsByCountry[k.id] || [];
        const facet = facets[(idx * 7 + row * 3) % facets.length];
        const ev = facet.ev;

        recordUsedCoord(x, y);
        const itemIdx = idx++;
        addWorldItem({
          id: `arch-${minZ}-${itemIdx}`,
          dedupKey: `${ev.id}-${facet.title}`,
          eventId: ev.id,
          isSynthetic: true,
          onLand: isPointOnLand(x, y),
          x: +x.toFixed(1),
          y: +y.toFixed(1),
          minZ,
          maxZ: 10.0,
          subMinZ: minZ,
          dotMinZ: minZ,
          priority: basePriority + itemIdx,
          isArea: false,
          dotCls: 'kev-dot',
          titleCls: 'kev-name',
          titleText: facet.title,
          titleFs: 10,
          subText: facet.sub,
          subFs: 9.2,
          onClick: () => openInspector({kind: 'event', data: ev})
        });
      }
    }
  };

  buildFixedLatticeTier(15.5, 17.5, 1.35, 950, 6.2, 12.0);
  buildFixedLatticeTier(5.0, 5.4, 3.0, 2300, 2.1, 14.0);

  // Tag primary items with canonical eventId and onLand
  worldItems.forEach(it => {
    if (it.onLand === undefined) it.onLand = true;
    if (!it.eventId && it.id.startsWith('ev-')) it.eventId = it.id.slice(3);
  });

  // Sort once by deterministic global priority
  worldItems.sort((a, b) => a.priority - b.priority);

  // ---- Lazy DOM Creation + Cached Dimension Measurement + Synchronous Frame Lockstep ----
  const hud = L.DomUtil.create('div', 'hud', document.getElementById('map'));
  let activeVisibleItems = [];

  const ensureItemDOM = item => {
    if (item.el) return;
    const el = document.createElement('div');
    el.className = 'w-item';
    el.style.zIndex = String(Math.max(100, 900 - Math.min(800, Math.floor(item.priority / 4))));

    if (item.dotCls) {
      const dot = document.createElement('div');
      dot.className = item.dotCls;
      if (item.onClick) {
        dot.addEventListener('click', ev => { ev.stopPropagation(); item.onClick(); });
      }
      if (item.eventId) {
        dot.addEventListener('mouseenter', () => highlightRoadsForEvent(item.eventId, false));
        dot.addEventListener('mouseleave', () => highlightRoadsForEvent(null, false));
      }
      el.appendChild(dot);
      item.dotEl = dot;
    }

    const stack = document.createElement('div');
    stack.className = `w-stack ${item.isArea ? 'area-stack' : 'pin-stack'}`;
    if (item.onClick) {
      stack.addEventListener('click', ev => { ev.stopPropagation(); item.onClick(); });
    }
    if (item.eventId) {
      stack.addEventListener('mouseenter', () => highlightRoadsForEvent(item.eventId, false));
      stack.addEventListener('mouseleave', () => highlightRoadsForEvent(null, false));
    }

    const tEl = document.createElement('div');
    tEl.className = `vlbl ${item.titleCls}`;
    tEl.style.fontSize = `${item.titleFs}px`;
    tEl.textContent = item.titleText;
    stack.appendChild(tEl);
    item.titleEl = tEl;

    if (item.subText) {
      const sEl = document.createElement('div');
      sEl.className = 'vlbl country-label';
      sEl.style.fontSize = `${item.subFs}px`;
      sEl.textContent = item.subText;
      stack.appendChild(sEl);
      item.subEl = sEl;
    }

    el.appendChild(stack);
    item.stackEl = stack;
    item.el = el;
    labelsPane.appendChild(el);
  };

  const renderViewportLabels = () => {
    const mapEl = document.getElementById('map');
    const mapRect = mapEl.getBoundingClientRect();
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const mw = mapRect.width;
    const mh = mapRect.height;
    if (mw < 40 || mh < 40) return;

    const z = map.getZoom();
    const scale = Math.pow(2, z);
    const center = map.getCenter();
    const cxPlate = center.lng;
    const cyPlate = -center.lat;

    // Layer coordinate origin and container offset
    const pixelOrigin = map.getPixelOrigin();
    const panePos = map._getMapPanePos();

    // Safe screen-space bounds inside #map so getBoundingClientRect() is strictly inside [4, vw-4] x [4, vh-4]
    const minX = Math.max(5, 5 - mapRect.left);
    const maxX = Math.min(mw - 5, vw - 5 - mapRect.left);
    const minY = Math.max(5, 5 - mapRect.top);
    const maxY = Math.min(mh - 5, vh - 5 - mapRect.top);

    // Cull world items to extended neighborhood around viewport (margin ensures pan-invariant collision order)
    const marginPxX = 140;
    const marginPxY = 80;
    const worldMinX = cxPlate - (mw * 0.5 + marginPxX) / scale;
    const worldMaxX = cxPlate + (mw * 0.5 + marginPxX) / scale;
    const worldMinY = cyPlate - (mh * 0.5 + marginPxY) / scale;
    const worldMaxY = cyPlate + (mh * 0.5 + marginPxY) / scale;

    // On wide desktop screens, only use strictly land-interior canonical items (never synthetic arch-* lattice pins)
    const isDesktop = mw > 640;

    const candidates = [];
    const unmeasured = [];
    for (let i = 0; i < worldItems.length; i++) {
      const it = worldItems[i];
      if (z < it.minZ || z > it.maxZ) continue;
      if (isDesktop && (!it.onLand || it.isSynthetic)) continue;
      if (it.x < worldMinX || it.x > worldMaxX || it.y < worldMinY || it.y > worldMaxY) continue;
      candidates.push(it);
      if (!it.measured) {
        ensureItemDOM(it);
        it.el.style.display = 'block';
        it.stackEl.style.display = 'flex';
        it.titleEl.style.display = 'block';
        if (it.subEl) it.subEl.style.display = 'block';
        unmeasured.push(it);
      }
    }

    // If a milestone is actively inspected (lockedRoadEventId), place its canonical label first so it is never hidden by neighbor collision
    if (lockedRoadEventId && candidates.length > 1) {
      const selIdx = candidates.findIndex(it => !it.isSynthetic && it.eventId === lockedRoadEventId);
      if (selIdx > 0) {
        const [selItem] = candidates.splice(selIdx, 1);
        candidates.unshift(selItem);
      }
    }

    // Batch-measure any newly created DOM nodes in a single layout pass
    if (unmeasured.length > 0) {
      for (let i = 0; i < unmeasured.length; i++) {
        const it = unmeasured[i];
        it.w1 = it.titleEl.offsetWidth || (it.titleText.length * it.titleFs * 0.58);
        it.h1 = it.titleEl.offsetHeight || (it.titleFs * 1.2);
        if (it.subEl) {
          it.w2 = it.subEl.offsetWidth || (it.subText.length * it.subFs * 0.52);
          it.h2 = it.subEl.offsetHeight || (it.subFs * 1.2);
        }
        it.measured = true;
      }
    }

    const nextVisibleSet = new Set();
    const placedBoxes = []; // in container screen coordinates {x1, y1, x2, y2}
    const seenTitles = new Set();
    const seenEventIds = new Set();
    const GAP_X = isDesktop ? (z >= 4.0 ? 8.0 : 16.0) : 3.5;
    const GAP_Y = isDesktop ? (z >= 4.0 ? 5.0 : 9.0) : 3.5;
    const MAX_PLACED_ITEMS = isDesktop ? 42 : 80;

    const hitsPlaced = (x1, y1, x2, y2) => {
      for (let i = 0; i < placedBoxes.length; i++) {
        const b = placedBoxes[i];
        if (x1 < b.x2 + GAP_X && x2 > b.x1 - GAP_X && y1 < b.y2 + GAP_Y && y2 > b.y1 - GAP_Y) return true;
      }
      return false;
    };

    const inSafeViewport = (x1, y1, x2, y2) => (
      x1 >= minX && x2 <= maxX && y1 >= minY && y2 <= maxY
    );

    let curLabels = 0;
    let placedCount = 0;

    for (let i = 0; i < candidates.length; i++) {
      const it = candidates[i];
      if (placedCount >= MAX_PLACED_ITEMS || (isDesktop && (seenTitles.has(it.titleText) || (it.eventId && seenEventIds.has(it.eventId))))) {
        if (it.el) {
          it.el.style.display = 'none';
          it.visState = 0;
        }
        continue;
      }
      // Exact floating-point layer coordinates inside labelsPane
      const lx = it.x * scale - pixelOrigin.x;
      const ly = it.y * scale - pixelOrigin.y;
      // Exact container screen coordinates (accounting for _mapPanePos during drag)
      const sx = lx + panePos.x;
      const sy = ly + panePos.y;

      const wantSub = it.subEl && z >= it.subMinZ;
      const wFull = wantSub ? Math.max(it.w1, it.w2) : it.w1;
      const hFull = wantSub ? (it.h1 + 1 + it.h2) : it.h1;

      // Compute screen bounding box for full stack (title + optional sub)
      let fx1, fy1, fx2, fy2;
      if (it.isArea) {
        fx1 = sx - wFull * 0.5;
        fx2 = sx + wFull * 0.5;
        fy1 = sy - hFull * 0.5;
        fy2 = sy + hFull * 0.5;
      } else {
        fx1 = sx - wFull * 0.5;
        fx2 = sx + wFull * 0.5;
        fy2 = sy - 5;
        fy1 = fy2 - hFull;
      }

      let newState = 0; // 0=hidden, 2=title-only, 3=title+sub
      if (wantSub && inSafeViewport(fx1, fy1, fx2, fy2) && !hitsPlaced(fx1, fy1, fx2, fy2)) {
        newState = 3;
        placedBoxes.push({x1: fx1, y1: fy1, x2: fx2, y2: fy2});
        if (it.dotEl) placedBoxes.push({x1: sx - 4, y1: sy - 4, x2: sx + 4, y2: sy + 4});
      } else {
        // Try title alone
        let tx1, ty1, tx2, ty2;
        if (it.isArea) {
          tx1 = sx - it.w1 * 0.5;
          tx2 = sx + it.w1 * 0.5;
          ty1 = sy - it.h1 * 0.5;
          ty2 = sy + it.h1 * 0.5;
        } else {
          tx1 = sx - it.w1 * 0.5;
          tx2 = sx + it.w1 * 0.5;
          ty2 = sy - 5;
          ty1 = ty2 - it.h1;
        }
        if (inSafeViewport(tx1, ty1, tx2, ty2) && !hitsPlaced(tx1, ty1, tx2, ty2)) {
          newState = 2;
          placedBoxes.push({x1: tx1, y1: ty1, x2: tx2, y2: ty2});
          if (it.dotEl) placedBoxes.push({x1: sx - 4, y1: sy - 4, x2: sx + 4, y2: sy + 4});
        }
      }

      if (newState > 0) {
        ensureItemDOM(it);
        const wasHidden = it.visState === 0;
        it.el.style.display = 'block';
        it.el.style.transform = `translate3d(${lx.toFixed(2)}px,${ly.toFixed(2)}px,0)`;
        it.stackEl.style.display = 'flex';
        it.titleEl.style.display = 'block';
        if (it.subEl) {
          it.subEl.style.display = (newState === 3) ? 'block' : 'none';
        }
        if (it.dotEl) {
          const dotInView = sx >= minX + 4 && sx <= maxX - 4 && sy >= minY + 4 && sy <= maxY - 4;
          it.dotEl.style.display = dotInView ? 'block' : 'none';
        }
        if (wasHidden && it.stackEl.animate) {
          it.stackEl.animate([{opacity: 0}, {opacity: 1}], {duration: 110, easing: 'ease-out'});
        }
        it.visState = newState;
        nextVisibleSet.add(it);
        seenTitles.add(it.titleText);
        if (it.eventId) seenEventIds.add(it.eventId);
        placedCount++;
        curLabels += (newState === 3 ? 2 : 1);
      } else if (it.el) {
        it.el.style.display = 'none';
        it.visState = 0;
      }
    }

    for (let i = 0; i < activeVisibleItems.length; i++) {
      const oldIt = activeVisibleItems[i];
      if (!nextVisibleSet.has(oldIt) && oldIt.el) {
        oldIt.el.style.display = 'none';
        oldIt.visState = 0;
      }
    }
    activeVisibleItems = Array.from(nextVisibleSet);

    // Update Altitude Bar & HUD
    const lz = Math.max(0, Math.min(ZMAX, Math.round(z)));
    const altNames = ['World Continents', 'Regional Biomes & Ranges', 'Provinces & Schools', '2036 Syllabus Milestones', 'Archival Micro-Plate'];
    hud.textContent = `Altitude ${lz} (${altNames[lz] || 'Archive'}) · zoom ${z.toFixed(2)} · ${curLabels} active labels`;

    document.querySelectorAll('.alt-btn').forEach(btn => {
      const isAct = (btn.dataset.alt === '0' && z < 0.8) ||
                    (btn.dataset.alt === '1' && z >= 0.8 && z < 2.0) ||
                    (btn.dataset.alt === '2' && z >= 2.0 && z < 3.1) ||
                    (btn.dataset.alt === '3' && z >= 3.1 && z < 3.8) ||
                    (btn.dataset.alt === '4' && z >= 3.8);
      btn.classList.toggle('active', isAct);
    });
  };

  // Run synchronously on every move, zoom, viewreset, and resize event so labels are NEVER out of sync
  map.on('move zoom viewreset moveend zoomend resize', () => {
    renderViewportLabels();
    if (lockedRoadEventId || hoveredRoadEventId) {
      highlightRoadsForEvent(hoveredRoadEventId, false);
    }
  });
  map.on('moveend zoomend', () => {
    syncURL();
  });
  map.whenReady(() => {
    syncURL();
    renderViewportLabels();
  });

  // ---- 5-Altitude Switcher Buttons ----
  document.querySelectorAll('.alt-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const targetZ = parseFloat(btn.dataset.z);
      const c = map.getCenter();
      smoothCameraTo(c.lng, -c.lat, targetZ, 260);
    });
  });

  // ---- Guided 2036 Textbook Tours ----
  let activeTour = null;
  let activeStep = 0;
  const tourSelect = document.getElementById('tour-select');
  const tourCard = document.getElementById('tour-card');

  const showTourStep = () => {
    if (!activeTour) {
      tourCard.classList.remove('open');
      return;
    }
    const step = activeTour.steps[activeStep];
    tourCard.classList.add('open');
    document.getElementById('tour-step-label').textContent = `${activeTour.name} · Stop ${activeStep + 1} of ${activeTour.steps.length}`;
    document.getElementById('tour-title').textContent = step.title;
    document.getElementById('tour-body').textContent = step.body;
    smoothCameraTo(step.x, step.y, step.z, 420);
  };

  tourSelect.addEventListener('change', () => {
    const val = tourSelect.value;
    if (!val || !TOURS[val]) {
      activeTour = null;
      tourCard.classList.remove('open');
      return;
    }
    activeTour = TOURS[val];
    activeStep = 0;
    showTourStep();
  });
  document.getElementById('tour-prev').addEventListener('click', () => {
    if (!activeTour) return;
    activeStep = (activeStep - 1 + activeTour.steps.length) % activeTour.steps.length;
    showTourStep();
  });
  document.getElementById('tour-next').addEventListener('click', () => {
    if (!activeTour) return;
    activeStep = (activeStep + 1) % activeTour.steps.length;
    showTourStep();
  });
  document.getElementById('tour-close').addEventListener('click', () => {
    activeTour = null;
    tourSelect.value = '';
    tourCard.classList.remove('open');
  });

  // ---- Live Search (Continents, Countries, Outlying Islands, Hardware Summits, 471+ Events) ----
  const searchInput = document.getElementById('search-input');
  const searchResults = document.getElementById('search-results');
  const searchCatalog = [
    ...events.map(e => ({title: e.name, meta: `${Math.floor(e.year)} · ${e.country_name} · ${e.one_line}`, x: e.x, y: e.y, z: 3.8, item: {kind: 'event', data: e}})),
    ...threads.flatMap(T => (T.milestones || []).map(m => ({title: m.label || m.name, meta: `Hardware Summit · ${Math.floor(m.year)} · ${m.elev || ''} · ${m.one_line || ''}`, x: m.x, y: m.y, z: 3.4, item: {kind: 'milestone', data: m}}))),
    ...islands.flatMap(isl => (isl.events || []).map(ie => ({title: ie.name, meta: `${Math.floor(ie.year)} · ${isl.name} · ${ie.one_line}`, x: ie.x || isl.cx, y: ie.y || isl.cy, z: 3.4, item: {kind: 'island-event', data: {...ie, island_name: isl.name, island_id: isl.id}}}))),
    ...islands.map(isl => ({title: isl.name, meta: `Outlying Island · ${isl.span} · ${isl.tag || isl.subtitle} · ${isl.summary || ''}`, x: isl.cx, y: isl.cy, z: 3.0, item: {kind: 'island', data: isl}})),
    ...countries.map(k => ({title: k.name, meta: `Province · ${k.span} · ${k.tag || k.subtitle}`, x: k.cx, y: k.cy, z: 2.6, item: {kind: 'country', data: k}})),
    ...blocks.map(b => ({title: b.name, meta: `Continent · ${b.span} · ${b.subtitle || ''}`, x: b.cx, y: b.cy, z: 1.2, item: {kind: 'continent', data: b}}))
  ];

  let currentMatches = [];
  const selectSearchMatch = m => {
    if (!m) return;
    searchResults.innerHTML = '';
    searchResults.style.display = 'none';
    searchInput.value = '';
    smoothCameraTo(m.x, m.y, m.z, 380);
    openInspector(m.item);
  };

  searchInput.addEventListener('input', () => {
    const q = searchInput.value.trim().toLowerCase();
    if (!q) {
      currentMatches = [];
      searchResults.innerHTML = '';
      searchResults.style.display = 'none';
      return;
    }
    const tokens = q.split(/[\s\-–—/]+/).filter(Boolean).map(t => t.replace(/(?:ic|s)$/, ''));
    const scored = [];
    for (let i = 0; i < searchCatalog.length; i++) {
      const c = searchCatalog[i];
      const tLow = c.title.toLowerCase();
      const mLow = c.meta.toLowerCase();
      let score = 0;
      if (tLow === q) score = 1000;
      else if (tLow.startsWith(q)) score = 850;
      else if (tLow.includes(q)) score = 650;
      else if (mLow.includes(q)) score = 320;
      else if (tokens.length > 0) {
        let tHits = 0, mHits = 0;
        for (const tok of tokens) {
          if (!tok) continue;
          if (tLow.includes(tok)) tHits++;
          else if (mLow.includes(tok)) mHits++;
        }
        const totalHits = tHits + mHits;
        if (totalHits === tokens.length) {
          score = 220 + tHits * 90;
        } else if (tokens.length >= 3 && totalHits >= tokens.length - 1) {
          score = 110 + tHits * 60;
        }
      }
      if (score > 0) scored.push({c, score});
    }
    scored.sort((a, b) => b.score - a.score);
    currentMatches = scored.slice(0, 12).map(s => s.c);
    if (!currentMatches.length) {
      searchResults.innerHTML = '';
      searchResults.style.display = 'none';
      return;
    }
    searchResults.innerHTML = currentMatches.map((m, i) => `
      <div class="search-item" data-idx="${i}">
        <div class="search-item-title">${m.title}</div>
        <div class="search-item-meta">${m.meta}</div>
      </div>`).join('');
    searchResults.style.display = 'block';
    searchResults.querySelectorAll('.search-item').forEach(node => {
      node.addEventListener('click', () => {
        selectSearchMatch(currentMatches[+node.dataset.idx]);
      });
    });
  });

  searchInput.addEventListener('keydown', ev => {
    if (ev.key === 'Enter' && currentMatches.length > 0) {
      ev.preventDefault();
      selectSearchMatch(currentMatches[0]);
      searchInput.blur();
    }
  });

  document.addEventListener('click', ev => {
    if (!ev.target.closest('.search-wrap')) {
      searchResults.style.display = 'none';
    }
  });

  document.addEventListener('keydown', ev => {
    if (ev.key === '/' && document.activeElement !== searchInput) {
      ev.preventDefault();
      searchInput.focus();
    } else if (ev.key === 'Escape') {
      searchResults.innerHTML = '';
      searchResults.style.display = 'none';
      closeInspector();
    }
  });

  window.MAP = map;
  window.__ATLAS = { map, P, worldItems, renderViewportLabels, smoothCameraTo };
  document.getElementById('stats').textContent = `tiles z0–z${ZMAX} (${Object.values(meta.counts).map(c => c.tiles).join(' / ')} per level), ${(meta.bytes / 1048576).toFixed(0)} MB`;
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(() => {
      worldItems.forEach(it => { it.measured = false; });
      renderViewportLabels();
      document.dispatchEvent(new Event('map:ready'));
    });
  } else {
    renderViewportLabels();
    document.dispatchEvent(new Event('map:ready'));
  }
});
</script>
</body>
</html>

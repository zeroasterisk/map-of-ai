<div class="banner">
  <b>Review prototype — continents only;</b> countries and cities not yet authored.
  Does the west-to-east ordering and sense of scale feel right? Do the terrains read clearly?
</div>

<script>
// Biome palette: aged hand-tinted map inks (one warm family; desaturated).
const BIOME = {
  highland: {c: '#b48a5c', label: 'highland — hand-authored logic & knowledge (symbolic)'},
  grassland:{c: '#c8a85a', label: 'grassland — probabilistic / statistical models'},
  forest:   {c: '#7d8f60', label: 'forest — learned neural representations'},
  jungle:   {c: '#5f8378', label: 'jungle — scaled self-supervised / foundation models'},
  wetland:  {c: '#7f8f96', label: 'wetland — reinforcement learning & control'},
  harbour:  {c: '#a59a84', label: 'harbour — benchmarks, datasets, tooling, venues'},
  mixed:    {c: '#7c6f8c', label: 'mixed — genuinely hybrid'}
};
const BANDS = ['N1','N2','C','S1','S2'];
const BAND_NAME = {N1:'philosophy & foundations', N2:'logic, knowledge, reasoning', C:'language & communication', S1:'planning, search, games', S2:'perception, control, embodiment'};

// ---- X scale: AXES.md §1 piecewise (1943–74 1×, 1974–2006 1.5×, 2006–17 3×, 2017–present 6×); pre-1943 log-compressed archipelago.
const NOW = new Date(); const PRESENT = NOW.getFullYear() + (NOW.getMonth()) / 12;
const SEG = [[1943,1974,1],[1974,2006,1.5],[2006,2017,3],[2017,PRESENT,6]];
const W = 1800, H = 580, PAD_L = 24, PAD_R = 180, ARCH_W = 150, MAP_TOP = 48, MAP_BOT = 470, RULER_Y = 500;
const mainW = W - PAD_L - PAD_R - ARCH_W;
const units = SEG.reduce((s,[a,b,k]) => s + (b-a)*k, 0);
const pxPerUnit = mainW / units;
function xMain(y) {
  let x = PAD_L + ARCH_W;
  for (const [a,b,k] of SEG) {
    if (y <= a) return x;
    x += (Math.min(y,b) - a) * k * pxPerUnit;
    if (y <= b) return x;
  }
  return x;
}
function xArch(y) { const d = Math.max(1, 1943 - y); const t = Math.log(d + 1) / Math.log(1943 - 1600 + 1); return PAD_L + ARCH_W - 14 - t * (ARCH_W - 34); }
function X(y) { return y >= 1943 ? xMain(y) : xArch(y); }
const bandH = (MAP_BOT - MAP_TOP) / BANDS.length;
function bandTop(b) { return MAP_TOP + BANDS.indexOf(b) * bandH; }
const BY = (b, f) => bandTop(b) + f * bandH;   // y at fraction f (0 top → 1 bottom) of band b

// ---- Placement (render-only; not registry data).
// v3 (precision pass): each continent is a closed uniform cubic B-spline through a SMALL number of control points
// (5–9). A B-spline never passes through its control points and every curve segment lies inside the convex hull of
// four consecutive points, so the coastline stays strictly inside the control polygon — no clip path needed, no
// straight clipped edges, and the gap between two continents is at least the gap between their control polygons.
// Each polygon is authored so the sea between any two of them is >= 12 px (checked mechanically by check_layout.py,
// which samples the rendered fills, not the polygons). The 1974–2011 cluster (REGISTRY D2/D4 overlaps) is resolved as:
//   winter-steppes        — N1 + upper N2 (northern steppe)
//   expert-systems-plat   — lower N2 + upper C: the "warm valley" nested directly under the steppe (REGISTRY D2)
//   connectionist-revival — S1–S2, with a cape reaching into lower C before 1988
//   statistical-isthmus   — from 1988 a neck in band C between plateau and revival (hence "isthmus"), broadening to
//                           N2–S1 after the steppe/plateau (1993) and revival (1998) end; a southern bay faces the basin
//   deep-learning-basin   — S1–S2 foothills from 2006 under the isthmus's bay, rising to C once the isthmus ends (2011)
const E = PRESENT - 0.06;
// Control polygons in (year, y). Clockwise from the north-west. Comments name the deliberate coastal features.
const COAST = {
  // shore: a tall ribbon; one western bay (mid) and a southern cape
  'cybernetic-shore': [[1943.4, BY('N1', .05)], [1955.5, BY('N1', .05)], [1955.5, BY('C', .4)], [1954.3, BY('S1', .4)], [1955.5, BY('S2', .96)], [1943.4, BY('S2', .96)], [1946.2, BY('C', .55)], [1943.4, BY('N2', .3)]],
  // heartland: broad block; deep southern bay (Shakey/GPS S1 shore), rounded eastern escarpment
  'symbolic-heartland': [[1957.3, BY('N2', .0)], [1973.7, BY('N2', .0)], [1973.7, BY('S1', .98)], [1970.0, BY('S1', .98)], [1967.0, BY('S1', .45)], [1963.0, BY('S1', .45)], [1960.0, BY('S1', .98)], [1957.3, BY('S1', .98)]],
  // steppes: long low slab; one shallow southern bay over the plateau
  'winter-steppes': [[1974.6, BY('N1', .0)], [1992.6, BY('N1', .0)], [1992.6, BY('N2', .44)], [1980.6, BY('N2', .44)], [1979.4, BY('N2', .15)], [1974.6, BY('N2', .15)]],
  // plateau: compact block; single eastern point toward the isthmus
  'expert-systems-plateau': [[1980.9, BY('N2', .66)], [1991.6, BY('N2', .66)], [1992.2, BY('C', .06)], [1991.0, BY('C', .24)], [1980.9, BY('C', .24)]],
  // revival: southern block with a northern cape (Hopfield 1982–86) reaching into band C
  'connectionist-revival': [[1982.6, BY('C', .68)], [1986.0, BY('C', .62)], [1988.6, BY('S1', .22)], [1997.2, BY('S1', .5)], [1997.2, BY('S2', .96)], [1982.6, BY('S2', .96)]],
  // isthmus: neck in C from 1988 (Pearl), broad head N2–C after 1993, southern bay hollowed out over 2000–2006 for the basin
  'statistical-isthmus': [[1989.0, BY('C', .55)], [1993.4, BY('C', .5)], [1996.6, BY('N2', .05)], [2010.5, BY('N2', .05)], [2010.5, BY('C', .95)], [2005.1, BY('C', .95)], [2004.6, BY('S1', .82)], [1999.6, BY('S1', .82)], [1998.4, BY('C', .9)], [1993.0, BY('C', .9)], [1989.0, BY('C', .84)]],
  // basin: low foothills S1–S2 from 2006, one bold northern peninsula in C after the isthmus ends (2011); western bay
  'deep-learning-basin': [[2006.5, BY('S1', .12)], [2011.4, BY('S1', .12)], [2013.0, BY('C', .0)], [2015.6, BY('C', .0)], [2016.7, BY('C', .3)], [2016.7, BY('S2', .96)], [2006.5, BY('S2', .96)]],
  // transformer plateau: tall block; western bay at C (the 2017 attention river mouth)
  'transformer-plateau': [[2017.5, BY('N2', .0)], [2021.7, BY('N2', .0)], [2021.7, BY('S2', .96)], [2017.5, BY('S2', .96)], [2018.2, BY('S1', .4)], [2017.5, BY('C', .5)]],
  // coast: full-height eastern seaboard; one large western peninsula at N2–C, open ragged east edge (terra incognita)
  'generative-coast': [[2022.4, BY('N1', .0)], [E, BY('N1', .0)], [E - 0.4, BY('N2', .5)], [E, BY('C', .8)], [E - 0.3, BY('S1', .9)], [E, BY('S2', .96)], [2022.4, BY('S2', .96)], [2022.4, BY('S1', .5)], [2022.4, BY('N2', .7)]],
};
// Antecedent isles: a small chain of 4 islands offshore, upper-left of the 1943 coast (N1–N2). No connector line.
const ISLES = [ {y: 1666, cy: BY('N1', .55), r: 12, s: 1}, {y: 1847, cy: BY('N2', .3), r: 15, s: 2}, {y: 1900, cy: BY('N1', .8), r: 14, s: 3}, {y: 1936, cy: BY('N2', .6), r: 20, s: 4} ];
// Label anchors (year, y). `inside: true` places the block centred here inside the landmass.
// Small landmasses are labelled OUTSIDE in open sea with a leader line to a point on the coast (standard small-island
// technique), because there is no legible size (>= MIN_FONT) that fits inside them.
const MIN_FONT = 12;  // px at 1x (viewBox px). Never rendered smaller than this.
const LABEL = {
  'cybernetic-shore':       {inside: false, px: PAD_L + ARCH_W / 2 - 8, at: [null, BY('S2', .3)], anchorYr: 1944.0, anchorBand: ['S2', .3], side: 'left', maxW: 118},
  'symbolic-heartland':     {inside: true,  at: [1965.2, BY('C', .3)]},
  'winter-steppes':         {inside: true,  at: [1984.2, BY('N1', .78)]},
  'expert-systems-plateau': {inside: false, px: 484, at: [null, BY('S1', .12)], anchorYr: 1983.6, anchorBand: ['C', .14], side: 'left', maxW: 80},
  'connectionist-revival':  {inside: true,  at: [1990.6, BY('S2', .12)]},
  'statistical-isthmus':    {inside: true,  at: [2003.4, BY('C', .25)]},
  'deep-learning-basin':    {inside: true,  at: [2012.2, BY('S1', .95)]},
  'transformer-plateau':    {inside: true,  at: [2019.6, BY('C', .1)]},
  'generative-coast':       {inside: true,  at: [2024.6, BY('N2', .8)]},
};

const svg = document.getElementById('map');
svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
const NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs, parent) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); (parent||svg).appendChild(e); return e; }
function txt(x, y, s, cls, parent, extra) { const t = el('text', Object.assign({x, y, class: cls}, extra||{}), parent); t.textContent = s; return t; }
const P = ([yr, y]) => [X(yr), y];

// Closed uniform cubic B-spline through control points → cubic Béziers. Large-radius curves; the curve stays strictly
// inside the control polygon (convex-hull property), so polygons that are >= G px apart give coasts >= G px apart.
function bsplinePath(pts) {
  const n = pts.length; const f = v => v.toFixed(1);
  const B = i => pts[((i % n) + n) % n];
  let d = '';
  for (let i = 0; i < n; i++) {
    const p0 = B(i - 1), p1 = B(i), p2 = B(i + 1), p3 = B(i + 2);
    const s = [(p0[0] + 4 * p1[0] + p2[0]) / 6, (p0[1] + 4 * p1[1] + p2[1]) / 6];
    const c1 = [(2 * p1[0] + p2[0]) / 3, (2 * p1[1] + p2[1]) / 3];
    const c2 = [(p1[0] + 2 * p2[0]) / 3, (p1[1] + 2 * p2[1]) / 3];
    const e2 = [(p1[0] + 4 * p2[0] + p3[0]) / 6, (p1[1] + 4 * p2[1] + p3[1]) / 6];
    if (i === 0) d = `M${f(s[0])},${f(s[1])}`;
    d += ` C${f(c1[0])},${f(c1[1])} ${f(c2[0])},${f(c2[1])} ${f(e2[0])},${f(e2[1])}`;
  }
  return d + ' Z';
}
function islandPts(cx, cy, r, seed) {
  const n = 6; const pts = [];
  for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2 + seed; const rr = r * (1.0 + 0.45 * Math.sin(a * 2 + seed * 1.7)); pts.push([cx + rr * Math.cos(a) * 1.3, cy + rr * Math.sin(a)]); }
  return pts;
}
function wrap(s, maxChars) { const out = []; let line = ''; s.split(' ').forEach(w => { if ((line + ' ' + w).trim().length > maxChars && line) { out.push(line); line = w; } else line = (line ? line + ' ' : '') + w; }); out.push(line); return out; }

fetch('registry.json').then(r => r.json()).then(data => {
  const C = data.continents;
  const defs = el('defs', {});
  const f = el('filter', {id: 'landshadow', x: '-10%', y: '-10%', width: '125%', height: '130%'}, defs);
  el('feGaussianBlur', {stdDeviation: 3.5}, f);
  const g2 = el('filter', {id: 'grain'}, defs);
  el('feTurbulence', {type: 'fractalNoise', baseFrequency: '.035 .012', numOctaves: 3, seed: 7, result: 't'}, g2);
  el('feColorMatrix', {in: 't', type: 'matrix', values: '0 0 0 0 .33  0 0 0 0 .26  0 0 0 0 .14  0 0 0 .10 0'}, g2);
  const pat = el('pattern', {id: 'contours', width: 6, height: 6, patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(-8)'}, defs);
  el('line', {x1: 0, y1: 3, x2: 6, y2: 3, stroke: '#8f7b57', 'stroke-width': .5, 'stroke-opacity': .28}, pat);

  // ocean: base tone + fine ruled lines + grain
  el('rect', {x: 0, y: 0, width: W, height: H, fill: '#cfc0a0'});
  el('rect', {x: 0, y: 0, width: W, height: H, fill: 'url(#contours)'});
  el('rect', {x: 0, y: 0, width: W, height: H, filter: 'url(#grain)', fill: '#000', 'fill-opacity': 0});
  BANDS.forEach(b => {
    el('line', {x1: PAD_L, x2: W - PAD_R + 30, y1: BY(b, .5), y2: BY(b, .5), stroke: '#8f7b57', 'stroke-opacity': .22, 'stroke-dasharray': '1 5'});
    txt(W - 12, BY(b, .5) - 1, b, 'band-code'); txt(W - 12, BY(b, .5) + 11, BAND_NAME[b], 'band-label');
  });
  txt(PAD_L + ARCH_W / 2 - 4, MAP_TOP + 16, 'WESTERN SEA', 'ocean-label', null, {'font-size': 11});
  txt(W - PAD_R / 2, MAP_TOP + 14, 'TERRA INCOGNITA', 'ocean-label', null, {'font-size': 10});
  // compass rose (bottom-right margin)
  const cx = W - PAD_R / 2, cy = RULER_Y + 18;
  el('circle', {cx, cy, r: 24, class: 'compass'}); el('circle', {cx, cy, r: 3, class: 'compass'});
  el('path', {d: `M${cx},${cy-34} L${cx+5},${cy-5} L${cx},${cy} L${cx-5},${cy-5} Z`, fill: '#5b4a30'});
  el('path', {d: `M${cx},${cy+34} L${cx+5},${cy+5} L${cx},${cy} L${cx-5},${cy+5} Z M${cx-34},${cy} L${cx-5},${cy-5} L${cx},${cy} L${cx-5},${cy+5} Z M${cx+34},${cy} L${cx+5},${cy-5} L${cx},${cy} L${cx+5},${cy+5} Z`, fill: 'none', stroke: '#5b4a30', 'stroke-width': .9});
  txt(cx, cy - 39, 'N', 'ruler-num', null, {'font-size': 10}); txt(cx + 46, cy + 4, 'E', 'ruler-num', null, {'font-size': 10});

  // time ruler: thin ruled line, major ticks only (density-adapted), serif numerals.
  // Offshore (log) segment: ticks at 1666 / 1800 / 1900 but numerals only at 1666 and 1900 — 1800 and 1900 are 13 px
  // apart on this scale, and two 4-digit numerals need ~32 px. The gate measures every adjacent pair of numerals.
  el('line', {x1: X(1943), x2: X(PRESENT), y1: RULER_Y, y2: RULER_Y, class: 'ruler'});
  el('line', {x1: PAD_L + 10, x2: X(1942), y1: RULER_Y, y2: RULER_Y, class: 'ruler', 'stroke-dasharray': '2 4'});
  const yearOf = y => Math.floor(y);
  const major = [1666, 1900, 1943, 1956, 1974, 1990, 2006, 2017, 2022];
  for (let y = 1950; y < 2006; y += 10) if (!major.includes(y)) major.push(y);
  [2012, 2020, 2024, 2026].forEach(y => { if (y <= PRESENT) major.push(y); });
  const minor = [1800]; for (let y = 1944; y <= yearOf(PRESENT); y++) if (!major.includes(y) && ((y < 2006 && y % 5 === 0) || (y >= 2006 && y % 2 === 0))) minor.push(y);
  minor.forEach(y => el('line', {x1: X(y), x2: X(y), y1: RULER_Y, y2: RULER_Y + 4, class: 'ruler-tick', 'stroke-opacity': .5}));
  const gRuler = el('g', {id: 'ruler-nums'});
  major.sort((a, b) => a - b).forEach(y => { const x = X(y); el('line', {x1: x, x2: x, y1: RULER_Y - 5, y2: RULER_Y + 7, class: 'ruler-tick'}); txt(x, RULER_Y + 22, y, 'ruler-num', gRuler); });
  txt((X(1943) + X(PRESENT)) / 2, RULER_Y + 42, 'westward is earlier · the scale stretches toward the present (1× · 1½× · 3× · 6× per year) · the east coast is the last completed month', 'ruler-cap');
  txt(PAD_L + ARCH_W / 2, RULER_Y + 42, 'pre-1943: offshore, logarithmic', 'ruler-cap');

  const gShadow = el('g', {id: 'shadows', transform: 'translate(3,4)'}); const gHalo = el('g', {id: 'halos'}); const gShapes = el('g', {id: 'shapes'}); const gLeaders = el('g', {id: 'leaders'}); const gLabels = el('g', {id: 'labels', 'pointer-events': 'none'});
  const card = document.getElementById('card');
  const order = C.slice().sort((a,b) => a.start - b.start);
  const pt = svg.createSVGPoint();
  const inFill = (p, x, y) => { pt.x = x; pt.y = y; return p.isPointInFill(pt); };

  // Label block: name lines (Cinzel) + subtitle lines (Lora) + years. Measured with getBBox after insertion.
  function labelBlock(c, lx, ly, sizeN, sizeS, maxW, withSub) {
    const nameLines = wrap(c.name, Math.max(8, Math.floor(maxW / (sizeN * 0.72 + 1.2))));
    const subLines = withSub ? wrap(c.subtitle.replace(/, \d{4}.*$/, ''), Math.max(14, Math.floor(maxW / (sizeS * 0.5)))) : [];
    const totalH = nameLines.length * (sizeN + 3) + subLines.length * (sizeS + 2) + sizeS + 3;
    let yy = ly - totalH / 2 + sizeN * 0.8;
    const ts = [];
    nameLines.forEach(l => { ts.push(txt(lx, yy, l, 'cname', gLabels, {'font-size': sizeN, 'data-for': c.id})); yy += sizeN + 3; });
    yy += 1;
    subLines.forEach(l => { ts.push(txt(lx, yy, l, 'csub', gLabels, {'font-size': sizeS, 'data-for': c.id})); yy += sizeS + 2; });
    ts.push(txt(lx, yy + 1, `${c.start}–${c.end}`, 'csub', gLabels, {'font-size': sizeS, 'data-for': c.id}));
    return ts;
  }
  const union = ts => { const bs = ts.map(t => t.getBBox()); const x = Math.min(...bs.map(b => b.x)), y = Math.min(...bs.map(b => b.y)); return {x, y, r: Math.max(...bs.map(b => b.x + b.width)), b: Math.max(...bs.map(b => b.y + b.height))}; };
  // does the label block sit inside `land` with `m` px margin on every side (sampled along the block outline)?
  const fitsInside = (land, u, m) => {
    for (let x = u.x - m; x <= u.r + m; x += 3) if (!inFill(land, x, u.y - m) || !inFill(land, x, u.b + m)) return false;
    for (let y = u.y - m; y <= u.b + m; y += 3) if (!inFill(land, u.x - m, y) || !inFill(land, u.r + m, y)) return false;
    return true;
  };

  order.forEach((c) => {
    const g = el('g', {class: 'continent', 'data-id': c.id}, gShapes);
    const fill = BIOME[c.biome].c;
    if (c.offshore) {
      ISLES.forEach(is => { const d = bsplinePath(islandPts(X(is.y), is.cy, is.r, is.s)); el('path', {d, class: 'shadow'}, gShadow); el('path', {d, class: 'halo'}, gHalo); el('path', {d, fill, class: 'land'}, g); });
      // label in open sea below the chain, with a leader to the largest isle (Turing 1936)
      const lx = X(ISLES[3].y) - 4; let ly = BY('C', .18);
      const ts = [];
      wrap(c.name, 14).forEach(l => { ts.push(txt(lx, ly, l, 'cname', gLabels, {'font-size': 12, 'data-for': c.id})); ly += 15; });
      ly += 1;
      wrap('logic & computability prehistory', 22).forEach(l => { ts.push(txt(lx, ly, l, 'csub', gLabels, {'font-size': MIN_FONT, 'data-for': c.id})); ly += 14; });
      ts.push(txt(lx, ly + 1, `${c.start}–${c.end}`, 'csub', gLabels, {'font-size': MIN_FONT, 'data-for': c.id}));
      const u = union(ts); const big = ISLES[3];
      const ax = X(big.y) - 4, ay = big.cy + big.r * .55;
      el('path', {d: `M${ax},${ay} L${ax},${u.y - 4}`, class: 'leader', 'data-for': c.id}, gLeaders);
      el('circle', {cx: ax, cy: ay, r: 2.4, class: 'leader-dot'}, gLeaders);
    } else {
      const ctrl = COAST[c.id].map(P);
      const d = bsplinePath(ctrl);
      el('path', {d, class: 'shadow'}, gShadow); el('path', {d, class: 'halo'}, gHalo);
      const land = el('path', {d, fill, class: 'land'}, g);
      el('path', {d, class: 'land-inner'}, g);
      const L = LABEL[c.id];
      const bb = land.getBBox();
      if (L.inside) {
        // Try sizes from large to MIN_FONT; keep the first whose block (with margin) sits wholly inside the fill.
        // If none fits at MIN_FONT with the subtitle, drop the subtitle before dropping below the floor.
        const [lyr, ly] = L.at; const lx = X(lyr);
        const tries = [[17, 12, true], [16, 12, true], [15, 12, true], [14, 12, true], [13, 12, true], [12, 12, true], [14, 12, false], [12, 12, false]];
        let placed = null;
        for (const [sN, sS, withSub] of tries) {
          const ts = labelBlock(c, lx, ly, sN, sS, bb.width - 24, withSub);
          if (fitsInside(land, union(ts), 6)) { placed = ts; break; }
          ts.forEach(t => t.remove());
        }
        if (!placed) { placed = labelBlock(c, lx, ly, MIN_FONT, MIN_FONT, bb.width - 24, false); placed.forEach(t => t.setAttribute('data-unfit', '1')); }
      } else {
        // Outside label with a leader line to the coast.
        const lx = L.px !== undefined ? L.px : X(L.at[0]);
        const ts = labelBlock(c, lx, 0, 13, MIN_FONT, L.maxW || 150, true);
        const u0 = union(ts); const h = u0.b - u0.y;
        const ly = L.side === 'above' ? (L.at[1] - h / 2 - 2) : L.side === 'below' ? (L.at[1] + h / 2 + 2) : L.at[1];
        ts.forEach(t => t.setAttribute('y', (parseFloat(t.getAttribute('y')) + ly).toFixed(1)));
        const u = union(ts);
        // anchor: walk from the requested coast point inward until inside the fill, so the dot sits on land
        let ax = X(L.anchorYr), ay = BY(L.anchorBand[0], L.anchorBand[1]);
        if (L.side === 'left') {
          // walk diagonally (up-right) from the requested point until on land, then 4 px further in
          for (let i = 0; i < 60 && !inFill(land, ax, ay); i++) { ax += 1; }
          ax += 5;
          // elbow leader: horizontal from the label's right edge at the row nearest the dot, then straight to the dot
          const ey = Math.min(Math.max(ay, u.y + 8), u.b - 8), ex = u.r + 4;
          const kx = Math.max(ex + 8, ax - Math.abs(ay - ey));
          el('path', {d: `M${ex},${ey} L${kx},${ey} L${ax},${ay}`, class: 'leader', 'data-for': c.id}, gLeaders);
        } else {
          const dir = L.side === 'above' ? 1 : -1;
          for (let i = 0; i < 40 && !inFill(land, ax, ay); i++) ay += dir;
          ay += dir * 4;
          const ex = Math.min(Math.max(ax, u.x + 10), u.r - 10);
          const ey = L.side === 'above' ? u.b + 3 : u.y - 3;
          el('path', {d: `M${ax},${ay} L${ax},${ey + (L.side === 'above' ? 8 : -8)} L${ex},${ey}`, class: 'leader', 'data-for': c.id}, gLeaders);
        }
        el('circle', {cx: ax, cy: ay, r: 2.4, class: 'leader-dot'}, gLeaders);
      }
    }
    const show = (ev) => {
      card.style.display = 'block';
      card.innerHTML = `<h3>${c.name}</h3><div class="sub">${c.subtitle}</div>
        <dl><dt>id</dt><dd><code>${c.id}</code></dd>
        <dt>span</dt><dd>${c.start}–${c.end}${c.offshore ? ' · <b>offshore archipelago</b>' : ''}</dd>
        <dt>band span</dt><dd>${c.band_span_text}</dd>
        <dt>biome</dt><dd><span class="sw" style="background:${fill}"></span>${c.biome}</dd>
        <dt>research file</dt><dd>research/${c.research_file}</dd>
        <dt>split</dt><dd>${c.split_of}</dd>
        <dt>west border</dt><dd>${c.border_west}</dd>
        <dt>east border</dt><dd>${c.border_east}</dd></dl>`;
      move(ev);
    };
    const move = (ev) => { const wrapR = svg.parentElement.getBoundingClientRect(); let lx = ev.clientX - wrapR.left + 16 + svg.parentElement.scrollLeft, ly = ev.clientY - wrapR.top + 16; if (lx + 430 > wrapR.width + svg.parentElement.scrollLeft) lx -= 460; card.style.left = lx + 'px'; card.style.top = ly + 'px'; };
    g.addEventListener('mouseenter', show); g.addEventListener('mousemove', move);
    g.addEventListener('mouseleave', () => card.style.display = 'none');
    g.addEventListener('click', show);
  });

  // Fonts load after first layout; re-run the inside-label fit once the web fonts are ready so measurements are real.
  const relayout = () => {
    order.filter(c => !c.offshore && LABEL[c.id].inside).forEach(c => {
      const g = gShapes.querySelector(`.continent[data-id="${c.id}"]`); const land = g.querySelector('path.land');
      const old = [...gLabels.querySelectorAll(`text[data-for="${c.id}"]`)]; old.forEach(t => t.remove());
      const [lyr, ly] = LABEL[c.id].at; const lx = X(lyr); const bb = land.getBBox();
      const tries = [[17, 12, true], [16, 12, true], [15, 12, true], [14, 12, true], [13, 12, true], [12, 12, true], [14, 12, false], [12, 12, false]];
      let placed = null;
      for (const [sN, sS, withSub] of tries) {
        const ts = labelBlock(c, lx, ly, sN, sS, bb.width - 24, withSub);
        if (fitsInside(land, union(ts), 6)) { placed = ts; break; }
        ts.forEach(t => t.remove());
      }
      if (!placed) { placed = labelBlock(c, lx, ly, MIN_FONT, MIN_FONT, bb.width - 24, false); placed.forEach(t => t.setAttribute('data-unfit', '1')); }
    });
  };
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { relayout(); document.dispatchEvent(new Event('map:ready')); });
  else document.dispatchEvent(new Event('map:ready'));

  // legend
  const lg = document.getElementById('legend');
  Object.entries(BIOME).forEach(([k, v]) => { const s = document.createElement('span'); s.style.setProperty('--c', v.c); s.textContent = v.label; lg.appendChild(s); });

  // table (collapsed by default)
  const tbl = document.getElementById('tbl');
  tbl.innerHTML = '<tr><th>#</th><th>id</th><th>name</th><th>subtitle</th><th>span</th><th>band span</th><th>biome</th><th>research</th><th>offshore</th><th>split-of</th></tr>' +
    order.map(c => `<tr><td>${c.n}</td><td><code>${c.id}</code></td><td>${c.name}</td><td>${c.subtitle}</td><td>${c.start}–${c.end}</td><td>${c.band_span_text}</td><td><span class="sw" style="background:${BIOME[c.biome].c}"></span>${c.biome}</td><td>${c.research_file}</td><td>${c.offshore ? 'true' : ''}</td><td>${c.split_of}</td></tr>`).join('');
  document.getElementById('foot').textContent = `${C.length} continents · generated from ${data.generated_from} · X scale per AXES.md §1 · Y bands are neighbourhood hints (AXES.md §3), not coordinates · terrain = methodology, not position. Source of truth: data/continents/REGISTRY.md.`;
});
</script>
</body>
</html>

<script>
// Biome palette: aged hand-tinted map inks (one warm family; desaturated).
const BIOME = {
  highland: {c: '#b48a5c', label: 'highland — hand-authored logic & knowledge (symbolic)'},
  grassland:{c: '#c8a85a', label: 'grassland — probabilistic / statistical models'},
  forest:   {c: '#7d8f60', label: 'forest — learned neural representations'},
  jungle:   {c: '#5f8378', label: 'jungle — scaled self-supervised / foundation models'},
  wetland:  {c: '#7f8f96', label: 'wetland — reinforcement learning & control'},
  harbour:  {c: '#a59a84', label: 'harbour — benchmarks, datasets, tooling, venues'},
  mixed:    {c: '#7c6f8c', label: 'mixed — genuinely hybrid'}
};
const BANDS = ['N1','N2','C','S1','S2'];
const BAND_NAME = {N1:'philosophy & foundations', N2:'logic, knowledge, reasoning', C:'language & communication', S1:'planning, search, games', S2:'perception, control, embodiment'};

// ---- X scale: AXES.md §1 piecewise (1943–74 1×, 1974–2006 1.5×, 2006–17 3×, 2017–present 6×); pre-1943 log-compressed archipelago.
const NOW = new Date(); const PRESENT = NOW.getFullYear() + (NOW.getMonth()) / 12;
const SEG = [[1943,1974,1],[1974,2006,1.5],[2006,2017,3],[2017,PRESENT,6]];
const W = 1800, H = 580, PAD_L = 24, PAD_R = 180, ARCH_W = 150, MAP_TOP = 48, MAP_BOT = 470, RULER_Y = 500;
const mainW = W - PAD_L - PAD_R - ARCH_W;
const units = SEG.reduce((s,[a,b,k]) => s + (b-a)*k, 0);
const pxPerUnit = mainW / units;
function xMain(y) {
  let x = PAD_L + ARCH_W;
  for (const [a,b,k] of SEG) {
    if (y <= a) return x;
    x += (Math.min(y,b) - a) * k * pxPerUnit;
    if (y <= b) return x;
  }
  return x;
}
function xArch(y) { const d = Math.max(1, 1943 - y); const t = Math.log(d + 1) / Math.log(1943 - 1600 + 1); return PAD_L + ARCH_W - 14 - t * (ARCH_W - 34); }
function X(y) { return y >= 1943 ? xMain(y) : xArch(y); }
const bandH = (MAP_BOT - MAP_TOP) / BANDS.length;
function bandTop(b) { return MAP_TOP + BANDS.indexOf(b) * bandH; }
const BY = (b, f) => bandTop(b) + f * bandH;   // y at fraction f (0 top → 1 bottom) of band b

// ---- Placement (render-only; not registry data).
// Each continent owns a CELL — a polygon in (year, y) that no other cell touches (≥ ~8px of sea between any two cells).
// Its coastline is a smooth Bézier through a handful of control points that stay inside the cell, so separate
// landmasses can never overlap (hard requirement, P2-T1-RENDER v2 review). The 1974–2011 cluster is resolved as:
//   winter-steppes      — N1 + upper N2 (northern steppe)
//   expert-systems-plat — lower N2 (+ a sliver of C): the "warm valley" nested directly under the steppe (REGISTRY D2)
//   connectionist-revival — S1–S2, with a cape reaching into C before 1988
//   statistical-isthmus — begins 1988 as a thin neck in band C between plateau and revival (hence "isthmus"),
//                         widens to N2–S1 after the steppe/plateau (1993) and revival (1998) end
//   deep-learning-basin — S1–S2 until the isthmus ends (2011), then the full C–S2 span
const E = PRESENT - 0.06;
const CELL = {
  'cybernetic-shore':       [[1943.3, BY('N1', .10)], [1955.7, BY('N1', .10)], [1955.7, BY('S2', .92)], [1943.3, BY('S2', .92)]],
  'symbolic-heartland':     [[1956.5, BY('N2', .05)], [1973.6, BY('N2', .05)], [1973.6, BY('S1', .95)], [1956.5, BY('S1', .95)]],
  'winter-steppes':         [[1974.5, BY('N1', .08)], [1992.6, BY('N1', .08)], [1992.6, BY('N2', .42)], [1974.5, BY('N2', .42)]],
  'expert-systems-plateau': [[1980.4, BY('N2', .52)], [1992.6, BY('N2', .52)], [1992.6, BY('C', .40)], [1980.4, BY('C', .40)]],
  'connectionist-revival':  [[1982.3, BY('C', .60)], [1987.6, BY('C', .60)], [1988.0, BY('S1', .02)], [1997.6, BY('S1', .02)], [1997.6, BY('S2', .92)], [1982.3, BY('S2', .92)]],
  'statistical-isthmus':    [[1988.6, BY('C', .52)], [1993.4, BY('C', .52)], [1993.4, BY('N2', .08)], [2010.8, BY('N2', .08)], [2010.8, BY('C', .92)], [2005.6, BY('C', .92)], [2005.6, BY('S1', .90)], [1998.6, BY('S1', .90)], [1998.6, BY('C', .92)], [1988.6, BY('C', .92)]],
  'deep-learning-basin':    [[2006.3, BY('S1', .05)], [2011.3, BY('S1', .05)], [2011.6, BY('C', .05)], [2016.7, BY('C', .05)], [2016.7, BY('S2', .92)], [2006.3, BY('S2', .92)]],
  'transformer-plateau':    [[2017.2, BY('N2', .05)], [2021.8, BY('N2', .05)], [2021.8, BY('S2', .92)], [2017.2, BY('S2', .92)]],
  'generative-coast':       [[2022.2, BY('N1', .10)], [E, BY('N1', .10)], [E, BY('S2', .92)], [2022.2, BY('S2', .92)]],
};
// Coastline control points (year, y), clockwise from the north-west; a few deliberate bays/capes, no noise.
const COAST = {
  'cybernetic-shore': [[1944.2, BY('N1', .22)], [1949, BY('N1', .14)], [1955.2, BY('N1', .32)], [1954.3, BY('N2', .6)], [1955.3, BY('C', .3)], [1955.2, BY('S1', .5)], [1953.6, BY('S1', .95)], [1955.2, BY('S2', .5)], [1952, BY('S2', .88)], [1946, BY('S2', .84)], [1943.7, BY('S2', .4)], [1945.6, BY('S1', .5)], [1943.7, BY('N2', .8)], [1944.8, BY('N2', .1)]],
  'symbolic-heartland': [[1957.1, BY('N2', .16)], [1963, BY('N2', .08)], [1970, BY('N2', .11)], [1973.1, BY('N2', .32)], [1973.2, BY('C', .5)], [1973.1, BY('S1', .3)], [1972, BY('S1', .9)], [1965, BY('S1', .85)], [1961, BY('S1', .92)], [1957.1, BY('S1', .6)], [1958.3, BY('C', .72)], [1957.0, BY('C', .1)]],
  'winter-steppes': [[1975.1, BY('N1', .2)], [1980, BY('N1', .13)], [1986, BY('N1', .11)], [1992.3, BY('N1', .24)], [1992.3, BY('N2', .1)], [1990, BY('N2', .38)], [1985, BY('N2', .3)], [1981.5, BY('N2', .38)], [1976, BY('N2', .35)], [1975.0, BY('N1', .8)]],
  'expert-systems-plateau': [[1981.0, BY('N2', .62)], [1986, BY('N2', .56)], [1992.1, BY('N2', .62)], [1992.1, BY('C', .1)], [1990, BY('C', .34)], [1984, BY('C', .3)], [1981.0, BY('C', .2)]],
  'connectionist-revival': [[1982.9, BY('C', .74)], [1986.6, BY('C', .72)], [1988.6, BY('S1', .14)], [1993, BY('S1', .08)], [1997.1, BY('S1', .2)], [1997.0, BY('S1', .7)], [1996.0, BY('S2', .6)], [1997.0, BY('S2', .86)], [1990, BY('S2', .88)], [1984, BY('S2', .8)], [1982.9, BY('S2', .3)], [1983.7, BY('S1', .6)], [1982.9, BY('S1', .1)]],
  'statistical-isthmus': [[1989.1, BY('C', .62)], [1993.0, BY('C', .6)], [1994.2, BY('N2', .35)], [1996, BY('N2', .18)], [2002, BY('N2', .12)], [2008, BY('N2', .18)], [2010.3, BY('N2', .5)], [2010.3, BY('C', .5)], [2009.4, BY('C', .84)], [2006.2, BY('C', .84)], [2005.1, BY('S1', .5)], [2004, BY('S1', .82)], [2000, BY('S1', .8)], [1999.2, BY('S1', .3)], [1998.1, BY('C', .84)], [1994.2, BY('C', .84)], [1993.2, BY('C', .86)], [1989.1, BY('C', .84)]],
  'deep-learning-basin': [[2006.9, BY('S1', .2)], [2010.6, BY('S1', .12)], [2012.0, BY('C', .18)], [2014, BY('C', .1)], [2016.3, BY('C', .2)], [2016.3, BY('S1', .5)], [2015.2, BY('S2', .3)], [2016.2, BY('S2', .7)], [2014, BY('S2', .88)], [2009, BY('S2', .85)], [2006.8, BY('S2', .5)], [2007.6, BY('S1', .8)], [2006.8, BY('S1', .5)]],
  'transformer-plateau': [[2017.9, BY('N2', .2)], [2019.5, BY('N2', .1)], [2021.2, BY('N2', .3)], [2021.5, BY('C', .4)], [2021.1, BY('S1', .6)], [2021.4, BY('S2', .3)], [2020.4, BY('S2', .88)], [2018.3, BY('S2', .82)], [2017.5, BY('S2', .3)], [2017.9, BY('S1', .3)], [2017.5, BY('C', .3)], [2017.6, BY('N2', .75)]],
  'generative-coast': [[2022.6, BY('N1', .25)], [2024, BY('N1', .13)], [E - 0.35, BY('N1', .3)], [E - 0.45, BY('N2', .7)], [E - 0.3, BY('C', .8)], [E - 0.7, BY('S1', .7)], [E - 0.35, BY('S2', .3)], [E - 0.9, BY('S2', .88)], [2023, BY('S2', .8)], [2022.6, BY('S2', .3)], [2022.7, BY('S1', .55)], [2022.6, BY('C', .2)], [2022.6, BY('N1', .9)]],
};
// Antecedent isles: a small chain of 4 islands offshore, upper-left of the 1943 coast (N1–N2). No connector line.
const ISLES = [ {y: 1666, cy: BY('N1', .55), r: 12, s: 1}, {y: 1847, cy: BY('N2', .3), r: 15, s: 2}, {y: 1900, cy: BY('N1', .8), r: 14, s: 3}, {y: 1936, cy: BY('N2', .6), r: 20, s: 4} ];
// Label centres (year, y) — inside each landmass's widest part.
const LABEL = {
  'cybernetic-shore': [1949.4, BY('C', .0)], 'symbolic-heartland': [1965, BY('C', .25)], 'winter-steppes': [1983.5, BY('N1', .62)],
  'expert-systems-plateau': [1986.5, BY('N2', .9)], 'connectionist-revival': [1990.5, BY('S1', .85)], 'statistical-isthmus': [2002, BY('C', .18)],
  'deep-learning-basin': [2012, BY('S1', .9)], 'transformer-plateau': [2019.5, BY('C', .15)], 'generative-coast': [2024.4, BY('N2', .85)],
};

const svg = document.getElementById('map');
svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
const NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs, parent) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); (parent||svg).appendChild(e); return e; }
function txt(x, y, s, cls, parent, extra) { const t = el('text', Object.assign({x, y, class: cls}, extra||{}), parent); t.textContent = s; return t; }
const P = ([yr, y]) => [X(yr), y];

// Smooth closed coastline through control points (Catmull-Rom → cubic Bézier).
function smoothPath(pts, tension = 0.5) {
  const n = pts.length; let d = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for (let i = 0; i < n; i++) {
    const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
    const c1 = [p1[0] + (p2[0] - p0[0]) * tension / 3, p1[1] + (p2[1] - p0[1]) * tension / 3];
    const c2 = [p2[0] - (p3[0] - p1[0]) * tension / 3, p2[1] - (p3[1] - p1[1]) * tension / 3];
    d += ` C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  return d + ' Z';
}
function islandPts(cx, cy, r, seed) {
  const n = 7; const pts = [];
  for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2 + seed; const rr = r * (0.8 + 0.35 * Math.sin(a * 2 + seed * 1.7)); pts.push([cx + rr * Math.cos(a) * 1.25, cy + rr * Math.sin(a)]); }
  return pts;
}
function wrap(s, maxChars) { const out = []; let line = ''; s.split(' ').forEach(w => { if ((line + ' ' + w).trim().length > maxChars && line) { out.push(line); line = w; } else line = (line ? line + ' ' : '') + w; }); out.push(line); return out; }

fetch('registry.json').then(r => r.json()).then(data => {
  const C = data.continents;
  const defs = el('defs', {});
  const f = el('filter', {id: 'landshadow', x: '-10%', y: '-10%', width: '125%', height: '130%'}, defs);
  el('feDropShadow', {dx: 3, dy: 4, stdDeviation: 3.5, 'flood-color': '#3a2a12', 'flood-opacity': .38}, f);
  const g2 = el('filter', {id: 'grain'}, defs);
  el('feTurbulence', {type: 'fractalNoise', baseFrequency: '.035 .012', numOctaves: 3, seed: 7, result: 't'}, g2);
  el('feColorMatrix', {in: 't', type: 'matrix', values: '0 0 0 0 .33  0 0 0 0 .26  0 0 0 0 .14  0 0 0 .10 0'}, g2);
  const pat = el('pattern', {id: 'contours', width: 6, height: 6, patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(-8)'}, defs);
  el('line', {x1: 0, y1: 3, x2: 6, y2: 3, stroke: '#8f7b57', 'stroke-width': .5, 'stroke-opacity': .28}, pat);

  // ocean: base tone + fine ruled lines + grain
  el('rect', {x: 0, y: 0, width: W, height: H, fill: '#cfc0a0'});
  el('rect', {x: 0, y: 0, width: W, height: H, fill: 'url(#contours)'});
  el('rect', {x: 0, y: 0, width: W, height: H, filter: 'url(#grain)', fill: '#000', 'fill-opacity': 0});
  BANDS.forEach(b => {
    el('line', {x1: PAD_L, x2: W - PAD_R + 30, y1: BY(b, .5), y2: BY(b, .5), stroke: '#8f7b57', 'stroke-opacity': .22, 'stroke-dasharray': '1 5'});
    txt(W - 12, BY(b, .5) - 1, b, 'band-code'); txt(W - 12, BY(b, .5) + 11, BAND_NAME[b], 'band-label');
  });
  txt(PAD_L + ARCH_W / 2 - 4, MAP_BOT - 26, 'WESTERN', 'ocean-label'); txt(PAD_L + ARCH_W / 2 - 4, MAP_BOT - 10, 'SEA', 'ocean-label');
  txt(W - PAD_R / 2, MAP_TOP + 14, 'TERRA INCOGNITA', 'ocean-label', null, {'font-size': 10});
  // compass rose (bottom-right margin)
  const cx = W - PAD_R / 2, cy = RULER_Y + 18;
  el('circle', {cx, cy, r: 24, class: 'compass'}); el('circle', {cx, cy, r: 3, class: 'compass'});
  el('path', {d: `M${cx},${cy-34} L${cx+5},${cy-5} L${cx},${cy} L${cx-5},${cy-5} Z`, fill: '#5b4a30'});
  el('path', {d: `M${cx},${cy+34} L${cx+5},${cy+5} L${cx},${cy} L${cx-5},${cy+5} Z M${cx-34},${cy} L${cx-5},${cy-5} L${cx},${cy} L${cx-5},${cy+5} Z M${cx+34},${cy} L${cx+5},${cy-5} L${cx},${cy} L${cx+5},${cy+5} Z`, fill: 'none', stroke: '#5b4a30', 'stroke-width': .9});
  txt(cx, cy - 39, 'N', 'ruler-num', null, {'font-size': 10}); txt(cx + 46, cy + 4, 'E', 'ruler-num', null, {'font-size': 10});

  // time ruler: thin ruled line, major ticks only (density-adapted), serif numerals
  el('line', {x1: X(1943), x2: X(PRESENT), y1: RULER_Y, y2: RULER_Y, class: 'ruler'});
  el('line', {x1: PAD_L + 10, x2: X(1942), y1: RULER_Y, y2: RULER_Y, class: 'ruler', 'stroke-dasharray': '2 4'});
  const yearOf = y => Math.floor(y);
  const major = [1666, 1800, 1900, 1943, 1956, 1974, 1990, 2006, 2017, 2022];
  for (let y = 1950; y < 2006; y += 10) if (!major.includes(y)) major.push(y);
  [2012, 2020, 2024, 2026].forEach(y => { if (y <= PRESENT) major.push(y); });
  const minor = []; for (let y = 1944; y <= yearOf(PRESENT); y++) if (!major.includes(y) && ((y < 2006 && y % 5 === 0) || (y >= 2006 && y % 2 === 0))) minor.push(y);
  minor.forEach(y => el('line', {x1: X(y), x2: X(y), y1: RULER_Y, y2: RULER_Y + 4, class: 'ruler-tick', 'stroke-opacity': .5}));
  major.sort((a, b) => a - b).forEach(y => { const x = X(y); el('line', {x1: x, x2: x, y1: RULER_Y - 5, y2: RULER_Y + 7, class: 'ruler-tick'}); txt(x, RULER_Y + 22, y, 'ruler-num', null, y < 1943 ? {'font-size': 11} : {}); });
  txt((X(1943) + X(PRESENT)) / 2, RULER_Y + 42, 'westward is earlier · the scale stretches toward the present (1× · 1½× · 3× · 6× per year) · the east coast is the last completed month', 'ruler-cap');
  txt(PAD_L + ARCH_W / 2, RULER_Y + 42, 'pre-1943: offshore, logarithmic', 'ruler-cap');

  const gShapes = el('g', {id: 'shapes'}); const gLabels = el('g', {id: 'labels', 'pointer-events': 'none'});
  const card = document.getElementById('card');
  const order = C.slice().sort((a,b) => a.start - b.start);
  order.forEach((c) => {
    const g = el('g', {class: 'continent', 'data-id': c.id}, gShapes);
    const fill = BIOME[c.biome].c;
    if (c.offshore) {
      ISLES.forEach(is => el('path', {d: smoothPath(islandPts(X(is.y), is.cy, is.r, is.s), .9), fill, class: 'land'}, g));
      const lx = PAD_L + ARCH_W / 2 - 4; let ly = BY('C', .32);
      wrap(c.name, 14).forEach(l => { txt(lx, ly, l, 'cname', gLabels, {'font-size': 12, 'data-for': c.id}); ly += 15; });
      ly += 1;
      wrap('logic & computability prehistory', 22).forEach(l => { txt(lx, ly, l, 'csub', gLabels, {'font-size': 10.5, 'data-for': c.id}); ly += 12.5; });
      txt(lx, ly + 1, `${c.start}–${c.end}`, 'csub', gLabels, {'font-size': 10.5, 'data-for': c.id});
    } else {
      const cell = CELL[c.id].map(P), ctrl = COAST[c.id].map(P);
      const clip = el('clipPath', {id: 'clip-' + c.id}, defs);
      el('polygon', {points: cell.map(p => p.map(v => v.toFixed(1)).join(',')).join(' ')}, clip);
      const d = smoothPath(ctrl, 0.5);
      el('path', {d, fill, class: 'land', 'clip-path': `url(#clip-${c.id})`}, g);
      el('path', {d, class: 'land-inner', 'clip-path': `url(#clip-${c.id})`}, g);
      // label block, centred on LABEL, sized by land width; a post-pass shrinks any line wider than the land at its row
      const [lyr, ly] = LABEL[c.id]; const lx = X(lyr);
      const xs = cell.map(p => p[0]), ys = cell.map(p => p[1]);
      const wland = Math.max(...xs) - Math.min(...xs), hland = Math.max(...ys) - Math.min(...ys);
      const small = hland < 90; // nested / minor landmass: name + years only (subtitle lives in the hover card)
      const sizeN = small ? 12 : wland > 260 ? 17 : wland > 150 ? 14 : 12, sizeS = wland > 260 ? 12 : wland > 150 ? 10.5 : 10;
      const nameLines = wrap(c.name, Math.max(6, Math.floor((wland - 14) / (sizeN * 0.66 + 1.2))));
      const subLines = small ? [] : wrap(c.subtitle.replace(/, \d{4}.*$/, ''), Math.max(12, Math.floor((wland - 22) / (sizeS * 0.5))));
      const totalH = nameLines.length * (sizeN + 3) + subLines.length * (sizeS + 2) + sizeS + 3;
      let yy = ly - totalH / 2 + sizeN * 0.8;
      nameLines.forEach(l => { txt(lx, yy, l, 'cname', gLabels, {'font-size': sizeN, 'data-for': c.id}); yy += sizeN + 3; });
      yy += 1;
      subLines.forEach(l => { txt(lx, yy, l, 'csub', gLabels, {'font-size': sizeS, 'data-for': c.id}); yy += sizeS + 2; });
      txt(lx, yy + 1, `${c.start}–${c.end}`, 'csub', gLabels, {'font-size': sizeS, 'data-for': c.id});
    }
    const show = (ev) => {
      card.style.display = 'block';
      card.innerHTML = `<h3>${c.name}</h3><div class="sub">${c.subtitle}</div>
        <dl><dt>id</dt><dd><code>${c.id}</code></dd>
        <dt>span</dt><dd>${c.start}–${c.end}${c.offshore ? ' · <b>offshore archipelago</b>' : ''}</dd>
        <dt>band span</dt><dd>${c.band_span_text}</dd>
        <dt>biome</dt><dd><span class="sw" style="background:${fill}"></span>${c.biome}</dd>
        <dt>research file</dt><dd>research/${c.research_file}</dd>
        <dt>split</dt><dd>${c.split_of}</dd>
        <dt>west border</dt><dd>${c.border_west}</dd>
        <dt>east border</dt><dd>${c.border_east}</dd></dl>`;
      move(ev);
    };
    const move = (ev) => { const wrapR = svg.parentElement.getBoundingClientRect(); let lx = ev.clientX - wrapR.left + 16 + svg.parentElement.scrollLeft, ly = ev.clientY - wrapR.top + 16; if (lx + 430 > wrapR.width + svg.parentElement.scrollLeft) lx -= 460; card.style.left = lx + 'px'; card.style.top = ly + 'px'; };
    g.addEventListener('mouseenter', show); g.addEventListener('mousemove', move);
    g.addEventListener('mouseleave', () => card.style.display = 'none');
    g.addEventListener('click', show);
  });

  // fit pass: if any label line is wider than its landmass at that row (measured against the actual coastline fill),
  // shrink the WHOLE label group uniformly so name/subtitle keep consistent sizing
  const fit = () => {
    const pt = svg.createSVGPoint();
    gShapes.querySelectorAll('.continent').forEach(g => {
      const lands = g.querySelectorAll('path.land'); if (lands.length !== 1) return; const land = lands[0];
      const ts = [...gLabels.querySelectorAll(`text[data-for="${g.dataset.id}"]`)];
      for (let k = 0; k < 10; k++) {
        let scale = 1;
        ts.forEach(t => {
          const b = t.getBBox(); const x = parseFloat(t.getAttribute('x'));
          const reach = (dir, y) => { let i = 0; while (i < 500) { pt.x = x + dir * i; pt.y = y; if (!land.isPointInFill(pt)) break; i++; } return i; };
          const free = Math.min(...[b.y + 1, b.y + b.height / 2, b.y + b.height - 1].flatMap(y => [reach(-1, y), reach(1, y)])) * 2 - 8;
          if (b.width > free) scale = Math.min(scale, Math.max(0.85, free / b.width));
        });
        if (scale >= 1) break;
        ts.forEach(t => { const fs = parseFloat(t.getAttribute('font-size')); t.setAttribute('font-size', Math.max(8, fs * scale).toFixed(1)); });
        if (ts.every(t => parseFloat(t.getAttribute('font-size')) <= 8)) break;
      }
    });
  };
  fit();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { fit(); document.dispatchEvent(new Event('map:ready')); });
  else document.dispatchEvent(new Event('map:ready'));

  // legend
  const lg = document.getElementById('legend');
  Object.entries(BIOME).forEach(([k, v]) => { const s = document.createElement('span'); s.style.setProperty('--c', v.c); s.textContent = v.label; lg.appendChild(s); });

  // table (collapsed by default)
  const tbl = document.getElementById('tbl');
  tbl.innerHTML = '<tr><th>#</th><th>id</th><th>name</th><th>subtitle</th><th>span</th><th>band span</th><th>biome</th><th>research</th><th>offshore</th><th>split-of</th></tr>' +
    order.map(c => `<tr><td>${c.n}</td><td><code>${c.id}</code></td><td>${c.name}</td><td>${c.subtitle}</td><td>${c.start}–${c.end}</td><td>${c.band_span_text}</td><td><span class="sw" style="background:${BIOME[c.biome].c}"></span>${c.biome}</td><td>${c.research_file}</td><td>${c.offshore ? 'true' : ''}</td><td>${c.split_of}</td></tr>`).join('');
  document.getElementById('foot').textContent = `${C.length} continents · generated from ${data.generated_from} · X scale per AXES.md §1 · Y bands are neighbourhood hints (AXES.md §3), not coordinates · terrain = methodology, not position. Source of truth: data/continents/REGISTRY.md.`;
});
</script>
</body>
</html>

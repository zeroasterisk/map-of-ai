<title>Map of AI — Continent Registry (review prototype)</title>
<!-- map-of-ai site build: P2-T1-RENDER v5 (curved spine, wandering shared borders, feathered texture blends, label halos) -->
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root { --paper: #e6d9bd; --ink: #3a2e1e; --ink-dim: #6e5f47; --rule: #b9a683; }
  html, body { margin: 0; color: var(--ink); font: 15px/1.5 Lora, Georgia, "Iowan Old Style", serif; }
  body { background: var(--paper) url("assets/textures/parchment.jpg") repeat; background-size: 768px 768px; }
  .wrap { position: relative; margin: 26px auto 0; max-width: 1720px; padding: 0 24px; overflow-x: auto; }
  svg#map { display: block; width: 100%; height: auto; min-width: 900px; border: 1px solid #6b573a; outline: 5px solid #e9dcc0; box-shadow: 0 0 0 6px #6b573a, 0 0 0 7px #b9a683, 0 14px 34px rgba(60,40,10,.35); }
  .continent { cursor: pointer; }
  .continent .land { stroke: none; }
  .continent .tint { pointer-events: none; }
  .continent .border { fill: none; stroke: #3d2e1a; stroke-width: 1; stroke-linejoin: round; stroke-opacity: .85; pointer-events: none; }
  .continent:hover .border { stroke-width: 1.8; stroke-opacity: 1; }
  .coast { fill: none; stroke: #2e2212; stroke-width: 1.7; stroke-linejoin: round; pointer-events: none; }
  .waterline { fill: none; stroke: #4a3a24; stroke-linejoin: round; pointer-events: none; }
  .shadow { fill: #2e2212; fill-opacity: .30; filter: url(#landshadow); pointer-events: none; }
  .cname { font-family: Cinzel, Georgia, serif; font-weight: 600; fill: #2a1f11; letter-spacing: 1.2px; paint-order: stroke; stroke: rgba(240,228,200,.85); stroke-width: 3.2px; stroke-linejoin: round; pointer-events: none; text-anchor: middle; }
  .csub { font-family: Lora, Georgia, serif; font-style: italic; fill: #3f321f; paint-order: stroke; stroke: rgba(240,228,200,.8); stroke-width: 2.6px; stroke-linejoin: round; pointer-events: none; text-anchor: middle; }
  .leader { fill: none; stroke: #3d2e1a; stroke-width: 1.2; pointer-events: none; }
  .leader-dot { fill: #3d2e1a; pointer-events: none; }
  .ruler, .ruler-tick { stroke: #4b3d29; stroke-width: 1; }

  .band-label { font-family: Lora, Georgia, serif; font-style: italic; font-size: 10.5px; fill: #7a6a4f; text-anchor: end; }
  .ocean-label { font-family: Cinzel, Georgia, serif; font-size: 12px; fill: #7f6d4c; letter-spacing: 4px; text-anchor: middle; opacity: .9; }
  .title { font-family: Cinzel, Georgia, serif; font-weight: 600; fill: #2a1f11; letter-spacing: 2.5px; text-anchor: middle; }
  .title-sub { font-family: Lora, Georgia, serif; font-style: italic; fill: #4b3d29; text-anchor: middle; }
  .graticule { fill: none; stroke: #5b4a30; stroke-width: .7; stroke-opacity: .22; stroke-dasharray: 1 4; }
  .banner { max-width: 880px; margin: 18px auto 0; padding: 8px 14px; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); color: var(--ink-dim); font-size: 13.5px; font-style: italic; text-align: center; }

  .card { position: absolute; max-width: 420px; max-height: 360px; overflow: hidden; background: #f6ecd6; color: #2f2416; border: 1px solid #8f7b57; box-shadow: 0 8px 24px rgba(60,40,10,.35); padding: 10px 14px; font-size: 13px; pointer-events: none; display: none; z-index: 5; }
  .card h3 { margin: 0 0 2px; font-family: Cinzel, Georgia, serif; font-weight: 600; font-size: 15px; letter-spacing: .8px; }
  .card .sub { color: #6e5f47; font-style: italic; margin-bottom: 6px; }
  .card dl { margin: 0; display: grid; grid-template-columns: 96px 1fr; gap: 2px 8px; }
  .card dt { color: #8b7a59; }
  .card dd { margin: 0; }
  .legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 22px; margin: 16px auto 4px; max-width: 1300px; font-size: 13px; font-style: italic; color: var(--ink-dim); }
  .legend span::before { content: ""; display: inline-block; width: 26px; height: 18px; margin-right: 7px; vertical-align: -4px; border: 1px solid #3d2e1a; background: var(--c) var(--t) center / 64px 64px; box-shadow: inset 0 0 0 3px var(--c); }
  details.list { margin: 10px auto 30px; max-width: 1680px; padding: 0 24px; }
  details.list summary { cursor: pointer; font-style: italic; color: var(--ink-dim); font-size: 13.5px; }
  table { border-collapse: collapse; font-size: 13px; width: 100%; margin-top: 10px; }
  th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--rule); vertical-align: top; }
  th { color: var(--ink-dim); font-weight: normal; font-style: italic; }
  td code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; color: #5a4a30; }
  .sw { display: inline-block; width: 11px; height: 11px; margin-right: 6px; vertical-align: -1px; border: 1px solid #4a3a24; }
  footer { margin: 0 auto 30px; max-width: 1200px; padding: 0 20px; color: var(--ink-dim); font-size: 12px; font-style: italic; text-align: center; }

<body>
<div class="wrap">
  <svg id="map" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"></svg>
  <div class="card" id="card"></div>
</div>
<div class="banner">
  <b>Review prototype — continents only;</b> countries and cities not yet authored.
  Does the west-to-east ordering and sense of scale feel right? Do the terrains read clearly?
</div>
<div class="legend" id="legend"></div>
<details class="list"><summary>View the registry as a table</summary><table id="tbl"></table></details>
<footer id="foot"></footer>

<script>
// Biome → generated terrain texture (site/assets/textures/*.jpg, made once by gen_textures.py + prep_textures.py)
// and a hand-tint colour used for the border wash and the legend swatch.
const BIOME = {
  // k = per-biome tile-size multiplier (v5) so glyphs read at one zoom level: measured glyph size on the 512px
  // tiles is ~7-9% of the tile for highland/forest/jungle/mixed, ~5.5% grassland, ~4% wetland → scale those up.
  highland: {c: '#b48a5c', label: 'highland — hand-authored logic & knowledge (symbolic)'},
  grassland:{c: '#c8a85a', k: 1.3, label: 'grassland — probabilistic / statistical models'},
  forest:   {c: '#7d8f60', label: 'forest — learned neural representations'},
  jungle:   {c: '#5f8378', label: 'jungle — scaled self-supervised / foundation models'},
  wetland:  {c: '#7f8f96', k: 1.75, label: 'wetland — reinforcement learning & control'},
  harbour:  {c: '#a59a84', label: 'harbour — benchmarks, datasets, tooling, venues'},
  mixed:    {c: '#7c6f8c', label: 'mixed — genuinely hybrid'}
};
const TEX = k => `assets/textures/${k}.jpg`;
const TILE = 230;   // viewBox px per texture repeat (512 px image → glyphs read at roughly hand-drawn map scale)
const BANDS = ['N1','N2','C','S1','S2'];
const BAND_NAME = {N1:'philosophy & foundations', N2:'logic, knowledge, reasoning', C:'language & communication', S1:'planning, search, games', S2:'perception, control, embodiment'};

// ---- X scale: AXES.md §1 piecewise (1943–74 1×, 1974–2006 1.5×, 2006–17 3×, 2017–present 6×); pre-1943 log-compressed archipelago.
const NOW = new Date(); const PRESENT = NOW.getFullYear() + (NOW.getMonth()) / 12;
const SEG = [[1943,1974,1],[1974,2006,1.5],[2006,2017,3],[2017,PRESENT,6]];
const W = 1800, H = 700, PAD_L = 24, PAD_R = 200, ARCH_W = 150, MAP_TOP = 150, MAP_BOT = 560, RULER_Y = 618;
const mainW = W - PAD_L - PAD_R - ARCH_W;
const units = SEG.reduce((s,[a,b,k]) => s + (b-a)*k, 0);
const pxPerUnit = mainW / units;
function xMain(y) {
  let x = PAD_L + ARCH_W;
  for (const [a,b,k] of SEG) {
    if (y <= a) return x;
    x += (Math.min(y,b) - a) * k * pxPerUnit;
    if (y <= b) return x;
  }
  return x;
}
function xArch(y) { const d = Math.max(1, 1943 - y); const t = Math.log(d + 1) / Math.log(1943 - 1600 + 1); return PAD_L + ARCH_W - 14 - t * (ARCH_W - 34); }
function X(y) { return y >= 1943 ? xMain(y) : xArch(y); }
const bandH = (MAP_BOT - MAP_TOP) / BANDS.length;
function bandTop(b) { return MAP_TOP + BANDS.indexOf(b) * bandH; }
const BY = (b, f) => bandTop(b) + f * bandH;   // y at fraction f (0 top → 1 bottom) of band b

// ---- v5 spine. The whole plate is sheared vertically along a gentle S-curve so the landmass reads as a winding
// continent instead of a horizontal strip. x is STILL exactly time (the ruler is untouched); band rows follow the
// spine, so "perpendicular offset from the spine" is the band. spineY(x) is what the graticule latitudes draw, and
// what check_layout.py subtracts before comparing a fill's y-extent with its registry band span.
const SPINE_AMP = 46;
function spineY(x) { const t = (x - PAD_L) / (W - PAD_L - PAD_R); return SPINE_AMP * (Math.sin(t * Math.PI * 1.55 - 0.35) * 0.85 + Math.sin(t * Math.PI * 3.3 + 1.1) * 0.18); }
const SY = (x, y) => y + spineY(x);       // plate → spine-bent screen y
const BYS = (yr, b, f) => SY(X(yr), BY(b, f));   // screen y of band fraction f at year yr

// ---- Placement (render-only; not registry data). v4: ONE contiguous mainland.
// The mainland is a partition of a (year × half-band) cell grid: every cell has exactly one owner (a continent or
// the sea), so neighbouring continents share their border by construction — no gaps, no overlaps, no clipping.
// Each continent's outline is traced from its cells; each grid edge is turned into the SAME wobbly hand-drawn
// polyline for both of its neighbours (deterministic noise keyed by the edge), so shared borders coincide exactly.
// Rows: N1 | N2a N2b | Ca Cb | S1 | S2  (bands split in half where the registry's band spans need it).
// Columns: the registry start/end years. Cell codes: . sea  y shore  h heartland  w steppes  p plateau  c revival
// s isthmus  d basin  t transformer  g generative.  Every cell an owner occupies lies inside that continent's
// REGISTRY.md band span (checked by check_layout.py against registry.json). Realisation of the 1974–2011 cluster:
//   1974–82  the Winter Gulf: south of the steppes (N1–N2) the sea comes in — the heartland ends on the 1974
//            escarpment and nothing stands in C–S2 until the revival opens in 1982 (the neck is the winter)
//   1980–93  plateau (N2) under the steppes (now N1 only, still N1–N2 over its whole 1974–93 span)
//   1988–93  the isthmus begins as a neck (Ca) between plateau and revival (Pearl 1988), broadening after 1993
//   1998–06  a southern bay (S2) between the revival's end and the basin's 2006 foothills
//   2011–17  the isthmus ends; the northern sea reaches down to the top of C over the basin
const E = PRESENT - 0.06;
const COLS = [1943, 1956, 1974, 1980, 1982, 1988, 1993, 1998, 2006, 2011, 2017, 2022, E];
const ROWY = [BY('N1',0), BY('N2',0), BY('N2',.5), BY('C',0), BY('C',.5), BY('S1',0), BY('S2',0), BY('S2',1)];
const GRID = [
  'yyyyyyy', // 1943–56 shore, all bands
  '.hhhhh.', // 1956–74 heartland N2–S1
  'www....', // 1974–80 first winter: steppes N1–N2, the Winter Gulf south of them
  'wpp....', // 1980–82 plateau opens under the steppes
  'wppcccc', // 1982–88 revival opens C–S2
  'wppsccc', // 1988–93 isthmus neck (Ca) between plateau and revival
  '.sssscc', // 1993–98
  '.sssss.', // 1998–2006
  '.sssddd', // 2006–11 basin foothills
  '...dddd', // 2011–17
  '.tttttt', // 2017–22 transformer N2–S2
  'ggggggg', // 2022–present generative, all bands
];
const CODE = {y:'cybernetic-shore', h:'symbolic-heartland', w:'winter-steppes', p:'expert-systems-plateau', c:'connectionist-revival', s:'statistical-isthmus', d:'deep-learning-basin', t:'transformer-plateau', g:'generative-coast'};
const NC = COLS.length - 1, NR = ROWY.length - 1;
const ownerAt = (i, j) => (i < 0 || j < 0 || i >= NC || j >= NR) ? null : (GRID[i][j] === '.' ? null : CODE[GRID[i][j]]);

// Antecedent isles: a small chain of 4 islands offshore, upper-left of the 1943 coast (N1–N2).
const ISLES = [ {y: 1666, cy: BY('N1', .55), r: 12, s: 1}, {y: 1847, cy: BY('N2', .3), r: 15, s: 2}, {y: 1900, cy: BY('N1', .8), r: 14, s: 3}, {y: 1936, cy: BY('N2', .6), r: 20, s: 4} ];
const MIN_FONT = 12;
const LABEL = {
  'cybernetic-shore':       {inside: false, px: PAD_L + ARCH_W / 2 - 10, at: [null, BY('S2', .38)], anchorYr: 1944.0, anchorBand: ['S2', .38], side: 'left', maxW: 118},
  'symbolic-heartland':     {inside: true,  at: [1965.0, BY('C', .3)]},
  'winter-steppes':         {inside: true,  at: [1983.5, BY('N1', .5)]},
  // the plateau (N2, 1980–93) is too small for its name; the label sits in the Winter Gulf below it (open water
  // between the heartland and the revival) with a leader up into the plateau
  'expert-systems-plateau': {inside: false, at: [1979.1, BY('C', .80)], anchorYr: 1981.6, anchorBand: ['N2', .90], side: 'center', maxW: 66, nosub: true},
  'connectionist-revival':  {inside: true,  at: [1990.5, BY('S2', .4)]},
  'statistical-isthmus':    {inside: true,  at: [2002.3, BY('N2', .55)]},
  'deep-learning-basin':    {inside: true,  at: [2011.6, BY('S1', .6)]},
  'transformer-plateau':    {inside: true,  at: [2019.3, BY('C', .6)]},
  'generative-coast':       {inside: true,  at: [2024.4, BY('C', .5)]},
};

// ---- deterministic noise (hand-drawn wobble). Same inputs → same output, so shared edges match exactly.
function hash(n) { n = Math.imul(n ^ (n >>> 16), 0x45d9f3b); n = Math.imul(n ^ (n >>> 16), 0x45d9f3b); return ((n ^ (n >>> 16)) >>> 0) / 4294967296; }
const h2 = (a, b, s) => hash((a * 73856093) ^ (b * 19349663) ^ (s * 83492791));
const sm = f => f * f * (3 - 2 * f);
function noise1(t, s) { const i = Math.floor(t), u = sm(t - i); return h2(i, 0, s) * (1 - u) + h2(i + 1, 0, s) * u; }
function noise2(x, y, s) { const i = Math.floor(x), j = Math.floor(y), ux = sm(x - i), uy = sm(y - j); return (h2(i, j, s) * (1 - ux) + h2(i + 1, j, s) * ux) * (1 - uy) + (h2(i, j + 1, s) * (1 - ux) + h2(i + 1, j + 1, s) * ux) * uy; }
// domain warp (3 octaves) then the spine shear. Both are continuous, so shared edges stay shared.
function warp([x, y]) { const s0 = 1 / 210, s = 1 / 90, s2 = 1 / 18; const wx = x + (noise2(x * s0, y * s0, 5) - .5) * 12 + (noise2(x * s, y * s, 1) - .5) * 9 + (noise2(x * s2, y * s2, 2) - .5) * 2.4, wy = y + (noise2(x * s0, y * s0, 6) - .5) * 12 + (noise2(x * s, y * s, 3) - .5) * 9 + (noise2(x * s2, y * s2, 4) - .5) * 2.4; return [wx, SY(wx, wy)]; }
// grid vertex → jittered position (shared by every cell touching it). v5: vertices slide along both grid lines by
// up to 60% of the local wander budget, so no two vertices of a column share an x — every year border is already
// a diagonal before its wander is added.
const VX = {};
// local cell sizes bound every displacement so neighbouring borders can never cross: vertex jitter ≤ 15% and
// border wander ≤ 25% of the narrower adjacent column/row (worst case 2×(15+25)% = 80% < 100%).
const colW = i => (i < 0 || i >= NC) ? 1e9 : X(COLS[i + 1]) - X(COLS[i]);
const rowH = j => (j < 0 || j >= NR) ? 1e9 : ROWY[j + 1] - ROWY[j];
// (cap 160 → up to 40px of wander on the wide 2006–present columns; the old 120 cap left those tall borders at
// ±30px over ~300px of length, which still read as plumb lines. 240 was tried and pushed the 2022 border into the
// Transformer Plateau label.)
const latX = i => .25 * Math.min(colW(i - 1), colW(i), 160);   // max lateral wander of the year border at column line i
const latY = j => .25 * Math.min(rowH(j - 1), rowH(j), 120);
// the x-jitter alternates sign down each column (odd/even j) so consecutive vertices of a year line are always
// offset in opposite directions → every year border segment is tilted, never plumb
// v5b: on top of the zig-zag, every year border gets a systematic diagonal LEAN (top pushed one way, bottom the
// other, direction alternating per column so consecutive regions become opposing trapezoids rather than a sheared
// grid). The lean is whatever is left of the half-column budget after jitter+wander (so borders still can never
// cross), capped at 24px (≈0.5yr on the widest columns, and inside the gate's 44px year tolerance together with
// the wander): a tall border now tilts ~8–10° instead of ±3°.
// The two widest columns (2017, 2022: 230–250px wide, 300px tall) get a larger cap (34px ≈ 0.7yr) — at 20px they
// still read as plumb full-height seams.
const leanCap = i => Math.min(colW(i - 1), colW(i)) >= 200 ? 30 : 20;
const leanX = i => (i <= 0 || i >= NC) ? 0 : Math.max(0, Math.min(leanCap(i), .5 * Math.min(colW(i - 1), colW(i)) - 1.6 * latX(i)));
function V(i, j) {
  const k = i + ',' + j;
  if (!VX[k]) {
    const lean = leanX(i) * (i % 2 ? 1 : -1) * (2 * j / (NR) - 1);   // −lean at the top row → +lean at the bottom
    // the zig-zag jitter is scaled down where the lean is large, so lean + jitter + wander stays inside the
    // half-column budget (and the gate's ±44px year tolerance on the region's x-extent)
    const jit = (j % 2 ? 1 : -1) * (0.35 + 0.65 * h2(i, j, 11)) * 0.6 * latX(i) * (1 - 0.6 * leanX(i) / leanCap(i));
    VX[k] = [X(COLS[i]) + lean + jit, ROWY[j] + (h2(i, j, 12) - .5) * 1.2 * latY(j)];
  }
  return VX[k];
}
// grid edge → wobbly polyline (cached per undirected edge, oriented on demand)
// v5: every edge wanders laterally like a river between provinces: a 1-lobe diagonal sweep + a 2-lobe meander +
// low-frequency noise + fine hand wobble, all within the local budget `lat`. Edges on the outer coast get an
// extra seaward bulge (capes/bays) so the silhouette is not a flat line. The polyline is computed once per
// undirected edge, so the two cells sharing it interlock with zero gap and zero overlap.
const EC = {};
function edgePts(a, b) {
  const ka = a[1] * 1000 + a[0], kb = b[1] * 1000 + b[0]; const rev = ka > kb; const [p, q] = rev ? [b, a] : [a, b];
  const key = p[0] * 1000003 + p[1] * 1009 + q[0] * 37 + q[1];
  if (!EC[key]) {
    const P = V(p[0], p[1]), Q = V(q[0], q[1]); const L = Math.hypot(Q[0] - P[0], Q[1] - P[1]);
    const vertical = p[0] === q[0];                     // a year border
    const n = Math.max(4, Math.round(L / 4)); const nx = -(Q[1] - P[1]) / L, ny = (Q[0] - P[0]) / L;
    // the two cells sharing this edge: +normal side first (left of a year edge, below a band edge)
    const cPos = vertical ? ownerAt(p[0] - 1, p[1]) : ownerAt(p[0], p[1]), cNeg = vertical ? ownerAt(p[0], p[1]) : ownerAt(p[0], p[1] - 1);
    const seaSide = (cPos === null) === (cNeg === null) ? 0 : (cPos === null ? 1 : -1);   // 0 = interior border
    // year borders: the wander budget shrinks by the column's lean, so lean + jitter + wander never exceeds the
    // half-column budget (keeps every region's x-extent within the gate's ±44px year tolerance)
    const lat = Math.min(vertical ? latX(p[0]) * (1 - 0.7 * leanX(p[0]) / leanCap(p[0])) : latY(p[1]), L * .3);
    const A0 = lat * .6, A1 = lat * .22, A3 = lat * .12;                    // diagonal sweep, meander, low-freq noise
    const A2 = Math.min(2.8, L * .035);                                     // fine hand wobble
    // seaward cape/bay bulge on the coast: full on north/south coasts, 40% on the west/east (time) coasts so the
    // 1943 / present shorelines stay readable against the ruler
    const AC = seaSide ? Math.min(lat * .9, 26) * (vertical ? .4 : 1) : 0;
    const sgn = h2(p[0], p[1], 31) < .5 ? -1 : 1, ph = h2(q[0], q[1], 32) * 6.28; const pts = [];
    for (let k = 0; k <= n; k++) {
      const t = k / n; const env = Math.sin(Math.PI * t);
      const off = env * (sgn * A0 * Math.sin(Math.PI * t + .25 * Math.sin(ph)) * (0.7 + 0.3 * Math.sin(ph + t * 2))
                       + Math.sin(2 * Math.PI * t + ph) * A1 * (0.6 + 0.4 * noise1(t * 3 + key % 97, 23))
                       + (noise1(t * 2.5 + key % 97, 21) - .5) * 2 * A3
                       + (noise1(t * 11 + key % 89, 22) - .5) * 2 * A2)
                  + seaSide * AC * Math.pow(env, 1.5) * (0.35 + 0.65 * noise1(t * 1.7 + key % 83, 24));
      pts.push(warp([P[0] + (Q[0] - P[0]) * t + nx * off, P[1] + (Q[1] - P[1]) * t + ny * off]));
    }
    EC[key] = pts;
  }
  return rev ? EC[key].slice().reverse() : EC[key];
}
// trace the boundary loops of the set of cells where pred(i,j) is true (clockwise, screen coords)
function trace(pred) {
  const out = new Map(); const add = (a, b) => { const k = a.join(','); (out.get(k) || out.set(k, []).get(k)).push(b); };
  for (let i = 0; i < NC; i++) for (let j = 0; j < NR; j++) if (pred(i, j)) {
    if (!pred(i, j - 1)) add([i, j], [i + 1, j]);
    if (!pred(i + 1, j)) add([i + 1, j], [i + 1, j + 1]);
    if (!pred(i, j + 1)) add([i + 1, j + 1], [i, j + 1]);
    if (!pred(i - 1, j)) add([i, j + 1], [i, j]);
  }

  img('assets/textures/cartouche.png', ccx - CW / 2, ccy - CH / 2, CW, CH, null, {id: 'cartouche', 'pointer-events': 'none'});
  txt(ccx, ccy - 4, 'MAP OF AI', 'title', null, {'font-size': 17});
  txt(ccx, ccy + 11, 'continent registry', 'title-sub', null, {'font-size': 9.5});
  txt(ccx, ccy + 23, 'review prototype', 'title-sub', null, {'font-size': 9.5});
  // compass rose (generated image, no letters) in the bottom-right margin
  const cw = 78, ch = cw * 530 / 600, cx = W - PAD_R / 2, cy = RULER_Y + 22;
  img('assets/textures/compass.png', cx - cw / 2, cy - ch / 2, cw, ch, null, {id: 'compass', 'pointer-events': 'none'});
  txt(cx, cy - ch / 2 - 4, 'N', 'ruler-num', null, {'font-size': 10}); txt(cx + cw / 2 + 8, cy + 4, 'E', 'ruler-num', null, {'font-size': 10});

  // fonts load after first layout; re-run the inside-label fit once the web fonts are ready
  const relayout = () => {
    order.filter(c => !c.offshore && LABEL[c.id].inside).forEach(c => {
      const g = gShapes.querySelector(`.continent[data-id="${c.id}"]`); const land = g.querySelector('path.land');
      [...gLabels.querySelectorAll(`text[data-for="${c.id}"]`)].forEach(t => t.remove());
      placeInside(c, land);
    });
  };
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { relayout(); document.dispatchEvent(new Event('map:ready')); });
  else document.dispatchEvent(new Event('map:ready'));

  // legend: texture swatch + tint
  const lg = document.getElementById('legend');
  Object.entries(BIOME).forEach(([k, v]) => { const s = document.createElement('span'); s.style.setProperty('--c', v.c); s.style.setProperty('--t', `url(${TEX(k)})`); s.textContent = v.label; lg.appendChild(s); });

  const tbl = document.getElementById('tbl');
  tbl.innerHTML = '<tr><th>#</th><th>id</th><th>name</th><th>subtitle</th><th>span</th><th>band span</th><th>biome</th><th>research</th><th>offshore</th><th>split-of</th></tr>' +
    order.map(c => `<tr><td>${c.n}</td><td><code>${c.id}</code></td><td>${c.name}</td><td>${c.subtitle}</td><td>${c.start}–${c.end}</td><td>${c.band_span_text}</td><td><span class="sw" style="background:${BIOME[c.biome].c}"></span>${c.biome}</td><td>${c.research_file}</td><td>${c.offshore ? 'true' : ''}</td><td>${c.split_of}</td></tr>`).join('');
  document.getElementById('foot').textContent = `${C.length} continents · generated from ${data.generated_from} · X scale per AXES.md §1 · Y bands are neighbourhood hints (AXES.md §3), not coordinates · terrain = methodology, not position · terrain textures generated once with gemini-2.5-flash-image and committed as static assets. Source of truth: data/continents/REGISTRY.md.`;
});
</script>
</body>
</html>

name: AlexNet
subtitle: "Wins ILSVRC 2012 with 15.3% top-5 error, 2012"
summary: >
  Krizhevsky, Sutskever and Hinton's eight-layer convolutional network, trained on two GTX 580 GPUs with ReLU units and dropout, won the ILSVRC 2012 classification task with a top-5 error of 15.3 percent against 26.2 percent for the runner-up. The margin convinced the computer-vision community almost overnight and is the conventional start of the deep learning revolution.

# Cross-cutting thread (AXES.md §3): hardware/compute is a LINEAR feature, not a region. Rendered by atlas.html as a
# mountain range (a ridge with peaks at the milestones) along the connectionist/scaling bank (S1/S2 seam), per
# research/09 thread (d) "Y-position: connectionist/scaling bank after 1999; symbolic bank before".
# Every milestone below is copied from research/09-cross-cutting-threads.md thread (d)'s Milestones table; every url
# is one of that file's [d1]-[d13] citations. Nothing here is sourced outside research/09. (Jalapeño had zero
# references in the corpus when this file was first written; commit 6612451 added it to research/09 thread (d) as
# [d13] with a citation, and only then was it listed below.)
id: silicon-river-hardware
name: The Silicon Range
short_name: Silicon Range
kind: mountain-range
thread: d                     # research/09 §(d) "Hardware and compute — the Silicon River"
research_file: 09-cross-cutting-threads.md
status: sourced
subtitle: hardware & compute — Lisp machines → GPUs → TPUs → H100 → Blackwell
# where the ridge runs (plate band coordinates, AXES.md §3): the S1/S2 seam = the connectionist/scaling bank.
# `bank` is the band fraction of the spine: 0 = top of band S1 ... 1 = bottom of band S2 (0.5 = the S1/S2 seam).
placement:
  band: [S1, S2]
  bank: 0.5
  # drawn span: the west and east ends of the ridge on the time axis. The two pilot continents with country data run
  # 2006-present; the two earlier sourced milestones (1999 GeForce, 2007 CUDA foothills) sit just west of the Basin
  # as the range's foothills so the feature reads as entering from the west, not springing up at 2012.
  time_range: [1999, present]
# milestones: year is the X anchor (X(year)); `peak` is the relative height of the ridge peak at that milestone
# (1 = tallest); `label` is the short A1 label (name + year is composed by the renderer); `lod` 1 = always labelled,
# 2 = labelled when room allows (same "curate, don't overlap" rule as country/event labels).
milestones:
  - year: 1999
    name: GeForce 256
    label: GeForce 256
    one_line: Nvidia GeForce 256, marketed as "the world's first GPU"
    peak: 0.35
    lod: 2
    sources:
      - {ref: d3, title: "Wikipedia: GeForce 256", url: "https://en.wikipedia.org/wiki/GeForce_256"}
  - year: 2007
    name: CUDA
    label: CUDA
    one_line: Nvidia releases CUDA (created 2004), enabling general-purpose GPU computing
    peak: 0.45
    lod: 2
    sources:

name: The Mathematical Logic Isles
subtitle: "Mechanized reasoning from Leibniz and Boole to Frege, Hilbert and Gödel, 1666–1931"
summary: >
  The westernmost islands of the Antecedent Isles, tracing the three-century effort to
  reduce human reasoning to explicit symbolic calculation. In the seventeenth century,
  Gottfried Wilhelm Leibniz envisioned a characteristica universalis and calculus
  ratiocinator—a universal formal language paired with mechanical rules of inference—and
  constructed the Stepped Reckoner calculator. Across the nineteenth century, Charles
  Babbage and Ada Lovelace designed the programmable Analytical Engine (1837–1843),
  George Boole formulated the algebra of logic in An Investigation of the Laws of
  Thought (1854), and Gottlob Frege invented modern predicate calculus with quantifiers
  in his Begriffsschrift (1879). Culminating in Whitehead and Russell's Principia
  Mathematica (1910–1913), David Hilbert's formalist program, and Kurt Gödel's 1931
  incompleteness theorems, these islands forged the formal notation and proof-theoretic
  bedrock upon which symbolic artificial intelligence was built.

name: The Open-Weights Commons
subtitle: "Llama, Mistral, DeepSeek, Qwen and the local-inference commons, 2023–present"
summary: >
  The open north of the coast begins with Meta's LLaMA (24 February 2023, a
  research licence) and the 4chan torrent that leaked its weights on 3 March
  2023: llama.cpp (10 March), Alpaca (13 March) and Vicuna (30 March) followed
  within weeks. Llama 2 (18 July 2023, commercial licence, with Microsoft) made
  open weights a deliberate corporate strategy; Mistral 7B (27 September 2023,
  Apache 2.0) and Mixtral 8x7B (11 December 2023) gave Europe an open champion;
  Llama 3 (18 April 2024) and Llama 3.1 405B (23 July 2024) reached GPT-4 class.
  DeepSeek-V2 (7 May 2024) set off a Chinese API price war, DeepSeek-V3
  (26 December 2024) trained a frontier-class 671B MoE at a reported ~$5.6M GPU
  cost, and Qwen3 (28 April 2025, Apache 2.0), Kimi K2 (July 2025) and Qwen3.8
  (12 August 2026) made trillion-parameter open weights routine from China. The
  border moved twice in 2025–26: OpenAI released gpt-oss under Apache 2.0
  (5 August 2025), Google shipped Gemma 4 (2 April 2026), and Meta — the lab
  that led open weights — made Llama 4 (5 April 2025) the last Llama and
  launched the closed Muse Spark (8 April 2026).

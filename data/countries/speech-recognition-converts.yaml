id: speech-recognition-converts
level: country
name: The Speech Conversion
subtitle: "Deep neural network and LSTM speech recognition, 2009–2016"
summary: >
  The first industrial sector fully captured by deep learning. Hinton's
  students, working with Microsoft, Google and IBM from 2009, replaced the
  Gaussian-mixture acoustic models of HMM recognisers with deep neural networks;
  the four labs' joint 2012 IEEE Signal Processing Magazine paper reported the
  gains across every major system. Graves, Mohamed and Hinton's deep
  bidirectional LSTMs (2013) and Graves's earlier CTC loss (2006) removed the
  phonetic alignment step; Google Voice Search shipped LSTM recognition in 2015.
  Baidu's Deep Speech (Hannun et al., December 2014) trained an end-to-end
  recurrent recogniser on noisy speech at scale — the first landmark paper from
  a Chinese lab — and Microsoft's Xiong and colleagues declared human parity on
  Switchboard (5.9% word error rate, October 2016). By then the conversion begun
  in 2009 was complete.

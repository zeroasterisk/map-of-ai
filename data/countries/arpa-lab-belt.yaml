name: The ARPA Lab Belt
subtitle: "MIT, Stanford, CMU, SRI and Edinburgh labs and their funders, 1959–1974"
summary: >
  The institutional belt that carried the golden age. McCarthy and Minsky founded
  the MIT AI project in 1959; ARPA's Information Processing Techniques Office was
  created in October 1962 under J. C. R. Licklider, and Project MAC opened at MIT
  on 1 July 1963 on a $2M ARPA grant, housing the Minsky–McCarthy AI Group.
  McCarthy started the Stanford AI Laboratory in 1963, the year Feigenbaum and
  Feldman's anthology Computers and Thought appeared. In Britain, Donald Michie
  established Edinburgh's Department of Machine Intelligence and Perception in
  1965. The field gained its conference (the first IJCAI, Washington 1969) and its
  journal (Artificial Intelligence, 1970), but the Mansfield Amendment of 1969
  pushed DARPA toward mission-oriented research, and the 1973–74 cutbacks that
  followed the Speech Understanding Research disappointments form the belt's
  eastern edge at the First AI Winter.

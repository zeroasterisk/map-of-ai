name: The Cyc Territory
subtitle: "Cyc, hand-coded commonsense and ontologies in Austin, 1984–1993"
summary: >
  The symbolic pole's most ambitious bet, in Austin. In July 1984 Douglas Lenat, who
  had come from Stanford with the discovery programs AM and EURISKO behind him, began
  Cyc at the MCC consortium. MCC had been formed in 1982 as the American answer to
  Japan's Fifth Generation. Cyc was a decades-long attempt to hand-code commonsense
  knowledge as an encyclopaedic ontology. It drew on the knowledge-representation
  community's results and looked back to McCarthy's Advice Taker. Close by, Ronald
  Brachman and James Schmolze's 1985 overview of KL-ONE gave frame-based
  representation formal semantics. KL-ONE was the first description-logic system, and
  its lineage runs to OWL and the Semantic Web. The territory's eastern frontier leads
  across the 1993 fog bank to knowledge graphs and the commonsense debates of the LLM
  era.

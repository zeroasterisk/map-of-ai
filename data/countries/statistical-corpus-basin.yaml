name: The Statistical Corpus Basin
subtitle: "HMMs, statistical translation, and web-scale language corpora, 1988–2011"
summary: >
  The linguistic spine of the statistical turn, replacing hand-coded syntactic
  grammars with data-driven probability. Frederick Jelinek's IBM Continuous Speech
  group and Kai-Fu Lee's CMU Sphinx deployed HMMs and n-grams for continuous speech
  recognition. IBM's Candide project (Brown et al., 1990/1993) re-founded machine
  translation on statistical word alignments, the Penn Treebank (1993) enabled
  Collins and Charniak's lexicalized parsers, and BLEU (2002) provided automated
  evaluation. PageRank (1998) and Halevy, Norvig, and Pereira's 'Unreasonable
  Effectiveness of Data' (2009) proved that web-scale data conquered algorithm
  complexity, leading to IBM Watson's Jeopardy! victory in 2011.

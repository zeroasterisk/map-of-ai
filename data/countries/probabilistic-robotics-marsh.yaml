id: probabilistic-robotics-marsh
level: country
name: Probabilistic Robotics Marsh
subtitle: "Particle filters, museum robots, Q-learning and the DARPA challenges, 1992–2007"
summary: >
  The southern wetland where estimation theory met learning and machines left the lab.
  Chris Watkins's Q-learning received its convergence proof with Peter Dayan in 1992.
  Sebastian Thrun, Wolfram Burgard and Dieter Fox brought Kalman and particle filters,
  Monte Carlo localization and SLAM to mobile robots, fielding the museum guides Rhino
  (1997) and Minerva (1998) and codifying the approach in Probabilistic Robotics (2005).
  The marsh drains east through the DARPA Urban Challenge of 3 November 2007, won by
  CMU/GM's Tartan Racing "Boss" with Stanford's "Junior" second, whose teams seeded
  Google's self-driving project.

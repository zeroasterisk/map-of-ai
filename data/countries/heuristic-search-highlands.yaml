name: The Heuristic Search Highlands
subtitle: "Logic Theorist, General Problem Solver and game-tree search, 1956–1974"
summary: >
  The core of the symbolic paradigm, establishing intelligence as heuristic search
  across combinatorial problem spaces. Allen Newell, J. C. Shaw, and Herbert Simon
  at Carnegie Tech and RAND created Logic Theorist (1956) to prove mathematical theorems
  and the General Problem Solver (GPS, 1959), pioneering means–ends analysis and
  the physical symbol system hypothesis. Concurrently, Arthur Samuel's checkers player
  at IBM (1956–1959) demonstrated rote learning and generalization from self-play,
  while alpha-beta pruning and computer chess advanced game search through Mac Hack VI
  and the Soviet Kaissa system, establishing search as the central engine of classical AI.

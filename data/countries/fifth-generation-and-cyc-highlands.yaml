name: The Cyc Ontology & Deep Thought Highlands
subtitle: "Lenat's Cyc knowledge base, Deep Thought grandmaster chess and the ICOT wind-down, 1988–1993"
summary: >
  The eastern highlands of the Expert Systems Plateau, where encyclopaedic commonsense
  ontologies and specialized hardware search machines carried symbolic AI through the
  close of the Fifth Generation era. At the MCC consortium in Austin, Douglas Lenat led
  the Cyc project (begun 1984) to hand-encode millions of default commonsense axioms into
  a formal ontology. Concurrently at Carnegie Mellon, Hans Berliner's HiTech and
  Feng-hsiung Hsu and Murray Campbell's custom VLSI alpha-beta search machine Deep
  Thought defeated chess grandmasters in 1988–1989, laying the direct foundation for IBM
  Deep Blue, while NASA's CLIPS shell standardized production rules and Japan's ICOT
  Fifth Generation project concluded its ten-year mandate in 1992.

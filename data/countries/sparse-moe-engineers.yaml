id: sparse-moe-engineers
level: country
name: The Mixture-of-Experts Delta
subtitle: "Sparsely-gated mixture-of-experts layers from Shazeer to Switch Transformer, 2017–2021"
summary: >
  A braided delta where the dense river splits into many channels. Shazeer et
  al.'s "Outrageously Large Neural Networks" (23 January 2017) put a
  sparsely-gated mixture-of-experts layer inside an LSTM and reached 100B+
  parameters while activating only a fraction per token — five months before
  the Transformer itself. Lepikhin et al.'s GShard (June 2020) automated the
  sharding of conditional computation across TPU pods for a 600B-parameter
  multilingual translation model, and Fedus, Zoph and Shazeer's Switch
  Transformer (11 January 2021) simplified routing to a single expert per token
  and trained trillion-parameter models. BAAI's Wu Dao 2.0 (31 May 2021) claimed
  1.75 trillion parameters with the same sparse recipe, making MoE the fastest
  route to a headline parameter count. Sparsity was a route past dense scaling
  limits, but the era's flagships (GPT-3, PaLM, Chinchilla) stayed dense; the
  delta's channels return as Mixtral and DeepSeek in the generative coast.
time_range: {start: 2017, end: 2021}

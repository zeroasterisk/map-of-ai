name: The Ensemble Highlands
subtitle: "Boosting, bagging, random forests and the algorithmic culture, 1993–2006"
summary: >
  The practical engine of applied machine learning in the 1990s and 2000s. Quinlan's
  C4.5 (1993) popularized decision trees, while Yoav Freund and Robert Schapire's
  AdaBoost (1995) proved that weak learners could be combined into strong classifiers.
  Leo Breiman introduced bootstrap aggregation (Bagging, 1996) and Random Forests
  (2001), publishing his landmark 'Two Cultures' manifesto arguing for predictive
  performance over data-generation models. Jerome Friedman developed gradient boosting
  machines (2001), and Viola and Jones combined boosted cascades with integral images
  to achieve the first real-time face detection system in 2001.

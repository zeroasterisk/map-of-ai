name: The Knowledge Engineering & XCON Empire
subtitle: "R1/XCON at DEC, PROSPECTOR, Japan's Fifth Generation, KL-ONE, ID3 and Soar, 1980–1988"
summary: >
  The industrial heartland of the Expert Systems Plateau during the 1980s boom. Launched
  into production in 1980 when John McDermott's OPS5 rule-based configurer R1/XCON began
  validating VAX computer orders at Digital Equipment Corporation—saving DEC $25 million
  annually by 1986—and SRI's PROSPECTOR located a Mount Tolman molybdenum deposit (1982),
  knowledge engineering grew into a billion-dollar enterprise of Lisp machines and shell
  vendors. In 1982 Japan's MITI inaugurated the ten-year Fifth Generation Computer
  Systems project around parallel logic programming, while John McCarthy and Raymond
  Reiter formalized non-monotonic reasoning (1980), Ronald Brachman introduced KL-ONE
  description logic (1985), J. Ross Quinlan published ID3 decision-tree induction (1986),
  and John Laird, Allen Newell, and Paul Rosenbloom unveiled the Soar cognitive
  architecture (1987).

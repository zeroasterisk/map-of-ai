name: The Imitation Game & Game-Search Headland
subtitle: "Turing's Mind paper, Shannon's chess minimax, Samuel's checkers and the Dartmouth proposal, 1949–1956"
summary: >
  The northern highland headland of the Cybernetic Shore, where philosophy of machine
  intelligence and heuristic game search converged on the 1955 Dartmouth proposal. In
  1950, Alan Turing's Mind paper Computing Machinery and Intelligence replaced the
  question "Can machines think?" with the behavioral Imitation Game and systematically
  rebutted nine classical objections, while Claude Shannon formulated minimax search with
  evaluation functions for computer chess. Following Turing and Champernowne's Turochamp,
  Christopher Strachey's draughts and Dietrich Prinz's chess ran on Manchester's Ferranti
  Mark 1 (1951), Arthur Samuel built his self-learning checkers program on the IBM 701
  (1952–1955), and John McCarthy, Minsky, Rochester, and Shannon authored the August 1955
  Dartmouth proposal coining artificial intelligence.

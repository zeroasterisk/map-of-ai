id: support-vector-escarpment
level: country
name: The Support Vector Escarpment
subtitle: "Kernel methods, margin classification and probabilistic robotics, 1998–2006"
summary: >
  The southern boundary of the isthmus, uniting statistical learning theory with
  autonomous physical control. Vladimir Vapnik and Corinna Cortes's soft-margin
  support-vector network (1995) and the Mercer kernel trick dominated classification
  through the early 2000s, delivering state-of-the-art results on MNIST. Simultaneously,
  Richard Sutton and Andrew Barto published the definitive reinforcement learning
  textbook (1998). Sebastian Thrun, Wolfram Burgard, and Dieter Fox introduced
  particle filters and Monte Carlo localization (1999), leading to Stanford's robotic
  vehicle Stanley winning the 2005 DARPA Grand Challenge across 212 km of desert.
time_range: {start: 1998, end: 2006}

id: tooling-guild
level: country
name: The Framework Harbour
subtitle: "Deep-learning frameworks, libraries and accelerators, 2007–2017"
summary: >
  The basin's port and its toolmakers' guild, running along the Silicon River.
  Nvidia's CUDA (2007) made GPUs programmable; Theano at MILA (from 2007) and
  Torch7 at NYU compiled research ideas into GPU code; Caffe (Berkeley, 2013)
  shipped the first trained-model zoo. cuDNN (October 2014) gave every framework
  the same tuned primitives, so Keras (Chollet, March 2015), Chainer (Preferred
  Networks, Tokyo, June 2015 — the first define-by-run library), TensorFlow
  (Google, November 2015) and PyTorch (Facebook, January 2017) all rode one
  channel. Google's TPU was announced at I/O 2016 after a year in production;
  Nvidia's DGX-1 (2016) and Volta's Tensor Cores (2017) made compute strategy.
  ICLR (first held 2013) and the Kaggle circuit — Hinton and Dahl's 2012 Merck
  win was the first commercial conversion — were the guild's meeting hall and
  market.

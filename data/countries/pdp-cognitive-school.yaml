name: The PDP Basin
subtitle: "Parallel distributed processing, backpropagation and cognitive representations, 1982–1993"
summary: >
  The intellectual heartland of 1980s connectionism and cognitive modeling.
  John Hopfield's 1982 associative memory network and Geoffrey Hinton and Terry
  Sejnowski's Boltzmann machine (1985) introduced statistical energy minimization
  and distributed representation to artificial neural networks. In 1986, David
  Rumelhart, James McClelland, and the PDP Research Group published the landmark
  two-volume Parallel Distributed Processing, while Rumelhart, Hinton, and Ronald
  Williams established backpropagation in Nature. Terry Sejnowski and Charles
  Rosenberg's NETtalk (1987) demonstrated text-to-speech learning on national
  television, and Michael Jordan and Jeffrey Elman (1990) introduced recurrent
  neural networks for temporal sequences and linguistic structure.

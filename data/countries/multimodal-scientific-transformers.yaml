id: multimodal-scientific-transformers
level: country
name: The Attention Promontory
subtitle: "Vision, image–text, protein and generalist Transformers, 2020–2022"
summary: >
  The promontory where attention crossed out of language. Dosovitskiy et al.'s
  Vision Transformer (22 October 2020) cut images into 16×16 patches and
  displaced convolutional networks at the top of image classification; OpenAI's
  CLIP and DALL-E (5 January 2021) learned vision from natural-language
  supervision and generated images from text, and CLIP became the conditioning
  backbone of later diffusion models. DeepMind's AlphaFold 2 won CASP14 (30
  November 2020) with GDT scores above 90 on roughly two-thirds of targets and
  published in Nature (July 2021), solving the 50-year protein-structure
  problem with attention over residue pairs. Perceiver (March 2021), Flamingo
  (April 2022) and Gato (12 May 2022 — one Transformer for text, images, Atari
  and robot arms) pushed toward a generalist substrate, and Whisper (September
  2022) took speech. The diffusion headwaters rise on this bank: Ho, Jain and
  Abbeel's DDPM (June 2020) leads, via CLIP guidance, across the bridge to the
  generative-media district.

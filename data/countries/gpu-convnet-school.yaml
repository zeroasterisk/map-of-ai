id: gpu-convnet-school
level: country
name: The ImageNet Escarpment
subtitle: "GPU-trained convolutional networks for vision, 2009–2015"
summary: >
  The sharpest relief on the whole map. Raina, Madhavan and Ng (Stanford, 2009)
  showed GPUs training deep models seventy times faster than CPUs; Cireşan,
  Meier and Schmidhuber at IDSIA won traffic-sign and handwriting contests with
  GPU convnets in 2011–12; then Krizhevsky, Sutskever and Hinton's AlexNet won
  ILSVRC 2012 with 15.3% top-5 error against 26.2% for the runner-up. Oxford's
  VGG and Google's Inception (2014) went to 16–22 layers, He, Zhang, Ren and
  Sun's 152-layer ResNet (Microsoft Research Asia, 2015) took the error to
  3.57%, below the estimated human level, and the challenge's final edition in
  2017 closed at 2.25%. Its detection-and-segmentation province — Berkeley's
  R-CNN family and FCN, Microsoft COCO (2014), YOLO and Freiburg's U-Net (2015)
  — turned classification backbones into general vision. DeepFace, DeepDream,
  style transfer and adversarial examples were its first public and first
  cautionary by-products.

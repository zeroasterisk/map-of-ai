id: scaling-law-empiricists
level: country
name: The Scaling-Law Fault Line
subtitle: "The Bitter Lesson, Kaplan, Chinchilla and the benchmark street, 2019–2022"
summary: >
  The fault line that separates the "bigger is better" plateau from the RNN
  lowlands to the west. Rich Sutton's essay "The Bitter Lesson" (13 March 2019)
  supplied the creed: general methods that leverage computation beat built-in
  human knowledge. Kaplan et al. (23 January 2020) supplied the method, showing
  that loss falls as a smooth power law in parameters, data and compute — the
  finding that justified GPT-3's bet four months later. DeepMind's Gopher (280B,
  8 December 2021) extended the programme and became the baseline that Hoffmann
  et al.'s Chinchilla (29 March 2022) beat with 70B parameters trained on 1.4
  trillion tokens, revising the recipe toward more data per parameter.
  Capability became a leaderboard number: Hendrycks et al.'s MMLU (September
  2020), BIG-bench's 204 tasks (June 2022) and Wei et al.'s "Emergent Abilities
  of Large Language Models" (June 2022) framed the argument over whether scale
  produces discontinuous jumps — the debate the next era inherits.

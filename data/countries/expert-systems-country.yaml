name: The Expert Systems Country
subtitle: "XCON, knowledge engineering, Lisp machines and knowledge representation, 1980–1993"
summary: >
  The commercial heart of the boom, on the Stanford–CMU–DEC axis. In 1980 John
  McDermott's R1/XCON, written in OPS5, went into production at DEC's Salem, New
  Hampshire plant. By 1986 its roughly 2,500 rules had configured 80,000 orders and
  were saving an estimated $25M a year. PROSPECTOR's 1982 molybdenum find at Mount
  Tolman became the boom's most-cited non-medical success. Shells such as EMYCIN and
  NASA's CLIPS (1985) spread the method, and Symbolics' LM-2 (1981) launched a
  Lisp-machine industry, with Thinking Machines' Connection Machine as its massively
  parallel wing. A formal "neat" wing asked what a knowledge base means, producing
  circumscription and default logic (1980), qualitative process theory (1984) and the
  KL-ONE description-logic system (1985). Production-system cognitive architectures
  (ACT*, 1983; Soar, 1987) grew alongside. Across the uncertainty border, Pearl's
  Bayesian networks (1985) challenged ad-hoc certainty factors. Quinlan's ID3 and the
  new journal Machine Learning (1986) answered the knowledge-acquisition bottleneck
  that brittle rule bases exposed.

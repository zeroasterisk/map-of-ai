name: The Logic & Representation Plateau
subtitle: "Lisp, automated theorem proving, resolution and Prolog, 1956–1974"
summary: >
  The northern highland of the Symbolic Heartland, formalizing reasoning as logic
  deduction and symbolic computation. Initiated by John McCarthy at the 1956 Dartmouth
  workshop, this region introduced Lisp (1958)—the premier programming language of
  AI for decades—and the Advice Taker (1959), outlining knowledge representation in
  formal logic. In 1965, J. Alan Robinson formulated the resolution principle, providing
  a refutation-complete inference rule for first-order logic that enabled automated
  theorem proving. This culminated in Alain Colmerauer and Robert Kowalski's creation
  of Prolog (1972) and logic programming, establishing a declarative paradigm that
  governed automated deduction, question answering, and formal knowledge engineering
  across Europe and North America.

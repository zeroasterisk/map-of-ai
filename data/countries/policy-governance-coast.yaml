id: policy-governance-coast
level: country
name: The Policy Coast
subtitle: "Bletchley, the EU AI Act, executive orders, safety institutes and the ip-rights docket, 2023–present"
summary: >
  The northern ridge of the coast is governed ground. The Future of Life
  Institute's pause letter (22 March 2023) and the CAIS Statement on AI Risk
  (30 May 2023) carried existential-risk framing into mainstream politics; US
  Executive Order 14110 on Safe, Secure, and Trustworthy AI (30 October 2023)
  introduced compute-threshold reporting, and the Bletchley Declaration was
  signed at the UK AI Safety Summit by 28 countries and the EU (1–2 November
  2023), with the UK AI Safety Institute launched on 2 November and the US AISI
  at NIST alongside. The EU AI Act passed the European Parliament on 13 March
  2024 and entered into force on 1 August 2024 as the first comprehensive AI
  regulation. The docket opened in parallel: Getty Images v. Stability AI
  (January–February 2023), the New York Times v. Microsoft and OpenAI
  (27 December 2023), RIAA v. Suno and Udio (June 2024). In January 2025 US
  policy pivoted from safety to build-out — the BIS "AI Diffusion" export rule
  (13 January), EO 14179 rescinding 14110 (23 January) — and the Paris AI
  Action Summit (10–11 February 2025) renamed the agenda. The 2024 Nobel Prizes
  in Physics (Hopfield, Hinton) and Chemistry (Baker, Hassabis, Jumper)
  canonised the field the same season.

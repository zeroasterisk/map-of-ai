id: game-search-foothills
level: country
name: The Game Search Foothills
subtitle: "Information theory, chess and checkers programs, 1948–1956"
summary: >
  The foothills where information was first quantified and game playing became
  the testbed for machine reasoning. Claude Shannon's "A Mathematical Theory of
  Communication" (1948) founded information theory, which later underpinned
  probabilistic AI. In 1948 Turing and Champernowne devised Turochamp, a paper
  chess program that was never run on a computer. Zuse had earlier drafted
  chess routines in Plankalkül, also never run. Shannon's "Programming a
  Computer for Playing Chess" (1950) set out minimax search with an evaluation
  function, the template for game-playing AI. In 1951 Strachey's draughts and
  Prinz's chess ran on the Ferranti Mark 1 in Manchester, the first game
  programs on a stored-program computer, and Strachey's love-letter generator
  followed in 1952. From 1952 Arthur Samuel wrote a checkers program on IBM's
  701 that learned by rote and self-play; he coined the term "machine
  learning". The foothills end at the 1955 Dartmouth proposal of McCarthy,
  Minsky, Rochester and Shannon, which named the field.

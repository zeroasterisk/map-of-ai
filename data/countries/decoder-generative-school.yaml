id: decoder-generative-school
level: country
name: The Autoregressive Ridge
subtitle: "Decoder-only generative pre-training from GPT-1 to InstructGPT, 2018–2022"
summary: >
  The ridge that won the era. Radford et al.'s GPT-1 (June 2018, 117M
  parameters) paired a decoder-only Transformer with generative pre-training and
  task fine-tuning; GPT-2 (February 2019, 1.5B parameters trained on 8M web
  pages) showed zero-shot task transfer and, withheld in stages until 5 November
  2019, opened the first "too dangerous to release" argument. Brown et al.'s
  GPT-3 (28 May 2020, 175 billion parameters) turned scale into in-context
  learning — few-shot behaviour with no gradient updates — and became the first
  LLM sold as an API (11 June 2020). Chen et al.'s Codex (July 2021) took the
  same recipe to source code and powered GitHub Copilot's preview (29 June
  2021). Ouyang et al.'s InstructGPT (4 March 2022) added supervised fine-tuning,
  a reward model and PPO — the RLHF canal that leads east to ChatGPT (30
  November 2022). Every next-token generative model of the following era
  descends from this ridge.
time_range: {start: 2018, end: 2022}

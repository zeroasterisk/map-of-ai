id: chinese-state-response
level: country
name: The Eastern Coast Forts
subtitle: "Chinese labs and the first national AI strategies, 2015–2017"
summary: >
  The basin's eastern coast, where the deep-learning boom first became national
  policy. Baidu Research under Ng (2014) produced Deep Speech; SenseTime (Hong
  Kong/CUHK, October 2014; ILSVRC 2016 detection winner) and Megvii's Face++
  (Beijing, launched 2012) built computer-vision companies on ImageNet-era
  convnets. Then, as the era closed, governments answered: the Obama White House
  published Preparing for the Future of Artificial Intelligence (October 2016),
  the first US national AI policy report; Canada launched the Pan-Canadian AI
  Strategy through CIFAR and founded the Vector Institute in Toronto with Hinton
  as chief scientific advisor (2017); and China's State Council issued the New
  Generation Artificial Intelligence Development Plan (July 2017), targeting
  world leadership by 2030. Their consequences — funding and chip-export
  politics — play out on the next continents.

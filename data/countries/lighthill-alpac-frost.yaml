name: The Lighthill & DARPA Retrenchment Frost
subtitle: "The 1973 Lighthill Report, DARPA Speech cuts and the 1987 Lisp-machine crash, 1974–1988"
summary: >
  The high northern tundra of the Winter Steppes, where government funding evaluations
  and hardware market economics twice froze general-purpose artificial intelligence
  research. Triggered by Sir James Lighthill's 1973 UK Science Research Council report—
  which argued that AI techniques suffered from combinatorial explosion outside toy
  micro-worlds—and the Mansfield Amendment's redirection of DARPA toward mission-specific
  deliverables, basic AI funding collapsed across Britain and the United States in 1974.
  A decade later, after Roger Schank and Marvin Minsky warned at the 1984 AAAI meeting of
  an impending "AI winter," the specialized Lisp-machine market (Symbolics, LMI) crashed
  in 1987 under competition from commodity workstations, and DARPA's Strategic Computing
  Initiative slashed new AI spending in 1988.

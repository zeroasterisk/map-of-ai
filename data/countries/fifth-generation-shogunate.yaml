notes: >
  The span covers the launch period of the Fifth Generation project and the national
  responses to it (1982–84). It starts at the plateau's 1980 west edge because logic
  programming predates the project (Prolog 1972, era 02). The N2b row passes to
  cyc-territory from 1984. The programmes' later wind-down is shown in funding-passes
  (winter-steppes).

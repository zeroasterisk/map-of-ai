id: fifth-generation-shogunate
level: country
name: The Fifth Generation Shogunate
subtitle: "Logic programming, ICOT and the national AI programmes it provoked, 1980–1984"
summary: >
  Tokyo and ICOT, with Alvey, ESPRIT, MCC and the Strategic Computing Initiative as
  satellite provinces. In 1982 Japan's MITI launched the Fifth Generation Computer
  Systems project, a ten-year national programme to build massively parallel
  logic-programming machines. Ehud Shapiro, visiting ICOT that year, set out the
  programme's rationale and developed Concurrent Prolog. David H. D. Warren's abstract
  machine (1983) became the compiler model for Prolog. The project set off a global
  competitive response. The MCC consortium formed in Austin in 1982, Feigenbaum
  co-wrote The Fifth Generation (1983), and DARPA's Strategic Computing Initiative
  (1983, about $1B) followed. Europe's ESPRIT programme began in 1983, and the UK's
  Alvey Programme followed in 1984 with £350M. Governments were funding AI at scale
  again. Research/03 treats these national programmes as funding geography rather
  than ideas, drawn here as forts. Their later decline (SCI's 1988 cuts, and the
  project's close in 1992 without meeting its original goals) belongs to the eastern
  frozen band of the Winter Steppes.

id: diffusion-media-district
level: country
name: The Diffusion Shoreline
subtitle: "Text-to-image, video, audio and world models from DALL-E 2 to Genie 3, 2022–present"
summary: >
  The southern shoreline of the coast is where generative media became ordinary.
  OpenAI announced DALL-E 2 on 6 April 2022, Midjourney opened its public beta on
  12 July 2022, and Stability AI publicly released Stable Diffusion — weights and
  code, built on CompVis latent diffusion — on 22 August 2022, forking the
  generative-media map into open and closed halves. SDXL 1.0 (26 July 2023) and
  Stable Diffusion 3 (announced 22 February 2024) reached production quality
  while Stability's CEO Emad Mostaque resigned (23 March 2024). Video followed:
  OpenAI previewed Sora on 15 February 2024 (public release December 2024),
  Google's Veo 3 added native audio (20 May 2025) and Genie 3 (5 August 2025)
  ran a real-time interactive world model; OpenAI's Sora 2 app (30 September
  2025) was shut down in April 2026. AlphaFold 3 (8 May 2024) carried
  diffusion-based generative modelling into structural biology. Along the
  shore run the copyright suits — Getty v. Stability (2023), the New York Times
  v. Microsoft and OpenAI (27 December 2023), RIAA v. Suno and Udio (June 2024).

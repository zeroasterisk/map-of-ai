id: graphical-valley
level: country
name: The Graphical Valley
subtitle: "Bayesian networks, junction trees and the generative/discriminative debate, 1988–2009"
summary: >
  The low western entry to the isthmus, where probability replaced certainty factors.
  Judea Pearl's Probabilistic Reasoning in Intelligent Systems (1988) made Bayesian
  networks and belief propagation the calculus of uncertain reasoning, and Steffen
  Lauritzen and David Spiegelhalter's junction-tree paper of the same year made exact
  inference in general networks practical (the basis of HUGIN and medical expert
  systems). Michael I. Jordan, at MIT from 1988, popularised Bayesian networks within
  machine learning; Pearl's Causality (2000) extended the calculus to cause and effect,
  and Ng and Jordan's 2001 comparison of logistic regression and naive Bayes framed the
  discriminative-versus-generative choice that ran through the era.

name: The Chinese Room & Symbol-System Steppe
subtitle: "The Physical Symbol System Hypothesis, Weizenbaum, Searle's Chinese Room and Dreyfus, 1974–1993"
summary: >
  The upper-reasoning steppe of the Winter Steppes, where the foundational creed of
  symbolic AI was formulated and contested across two decades. In their 1975 Turing
  Award lecture, Allen Newell and Herbert Simon articulated the Physical Symbol System
  Hypothesis, declaring that a physical symbol system has the necessary and sufficient
  means for general intelligent action. That manifesto drew sustained philosophical and
  ethical counter-fire: Joseph Weizenbaum's Computer Power and Human Reason (1976)
  challenged the moral authority ceded to automated systems; John Searle's Chinese Room
  thought experiment (1980) argued that syntactic symbol manipulation never yields
  semantic intentionality; and Hubert and Stuart Dreyfus's Mind over Machine (1986) And
  Terry Winograd's 1986 critique argued that human expertise is situated intuition rather
  than brittle rule bases.

name: The Hebbian Synapse & SNARC Shore
subtitle: "Unorganised machines, Hebbian plasticity, SNARC and early learning programs, 1943–1956"
summary: >
  The lower-central neural-modelling province of the Cybernetic Shore, dedicated to how
  networks of neurons and early digital programs adapt through experience. In 1947
  Walter Pitts and Warren McCulloch analyzed invariant visual and auditory form
  recognition, and in 1948 Alan Turing's NPL report Intelligent Machinery proposed
  training unorganised B-type neural networks. Donald Hebb's The Organization of
  Behavior (1949) introduced the correlational synaptic plasticity rule that cells
  firing together wire together. Soon after, Marvin Minsky and Dean Edmonds built the
  40-synapse stochastic reinforcement network SNARC (1951), Anthony Oettinger programmed
  the EDSAC Shopper learning experiments (1951–1952), and Belmont Farley and Wesley
  Clark simulated self-organizing neural networks on MIT's Whirlwind computer (1954).
time_range: {start: 1943, end: 1956}

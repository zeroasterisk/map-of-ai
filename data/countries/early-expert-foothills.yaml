name: The MYCIN, Hearsay-II & Knowledge Foothills
subtitle: "MYCIN certainty factors, Hearsay-II blackboards, Schank scripts and Feigenbaum's thesis, 1974–1980"
summary: >
  The western foothills of the Winter Steppes between the 1974 funding cliff and the
  1980 commercial expert-systems boom, where researchers pivoted from general-purpose
  search to domain-specific knowledge. At Stanford, Edward Shortliffe and Bruce Buchanan
  developed MYCIN (1972–1976), a backward-chaining clinical consultation system of 600
  production rules and certainty factors whose EMYCIN shell separated inference engine
  from knowledge base. At CMU, Raj Reddy, Lee Erman, Victor Lesser, and Rick Hayes-Roth
  demonstrated Hearsay-II (1976), introducing the cooperative blackboard architecture,
  while Roger Schank and Robert Abelson formalized stereotyped Scripts (1977) at Yale and
  Edward Feigenbaum's 1977 IJCAI address proclaimed that "knowledge is power."

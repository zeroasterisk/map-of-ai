id: alignment-critique-tributaries
level: country
name: The Human-Feedback Tributaries
subtitle: "RLHF, the Anthropic split, Stochastic Parrots and the foundation-model critique, 2017–2022"
summary: >
  Two tributaries running along the plateau's northern rim, one from each
  bank. On the alignment bank, Christiano et al.'s "Deep Reinforcement Learning
  from Human Preferences" (June 2017) trained a reward model from pairwise human
  judgements; Ouyang et al.'s InstructGPT (4 March 2022) turned that into the
  SFT → reward model → PPO recipe that ChatGPT would ship eight months later,
  and Dario and Daniela Amodei's departure from OpenAI to found Anthropic
  (January 2021) made safety the charter of a separate frontier lab. On the
  critique bank, Mitchell et al.'s "Model Cards for Model Reporting" (October
  2018) asked for documentation; Bender, Gebru, McMillan-Major and Mitchell's
  "On the Dangers of Stochastic Parrots" (FAccT, March 2021) questioned scale,
  data and cost — and Google forced Gebru out (December 2020) over it; Stanford
  CRFM's foundation-models report (August 2021) coined the umbrella term and
  catalogued its risks; and Meta's Galactica (15 November 2022) was withdrawn
  after three days of confident fabrications, two weeks before ChatGPT.

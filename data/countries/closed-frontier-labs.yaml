id: closed-frontier-labs
level: country
name: The Closed Frontier
subtitle: "OpenAI, Anthropic and Google DeepMind's proprietary frontier models, 2022–present"
summary: >
  The port city of the coast is ChatGPT, released by OpenAI on 30 November 2022
  (GPT-3.5 plus RLHF) and at 100 million monthly users within two months.
  Microsoft's multiyear, multibillion-dollar investment (23 January 2023) and
  the new Bing (7 February 2023) locked big-tech capital behind the race; Google,
  on "code red", announced Bard (6 February 2023). GPT-4 arrived on 14 March
  2023, Anthropic released Claude the same day, and Google Brain and DeepMind
  merged into Google DeepMind (20 April 2023) to build Gemini 1.0 (6 December
  2023). The labs kept their weights proprietary and shipped through APIs and
  staged deployments: Claude 3 (4 March 2024), GPT-4o (13 May 2024), GPT-5
  (7 August 2025), Claude Sonnet 4.5 and Opus 4.5 (2025), Gemini 3 (18 November
  2025) and Gemini 3.1 Pro (19 February 2026). The OpenAI board's firing and
  reinstatement of Sam Altman (17–22 November 2023) exposed the safety-versus-
  commerce tension inside the leading lab; xAI's Grok (November 2023) added a
  fourth US frontier lab.

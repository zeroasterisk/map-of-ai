name: The Temporal Difference Valley
subtitle: "Neuronlike reinforcement learning, TD(lambda) and self-play gammon, 1982–1998"
summary: >
  The reinforcement learning wing of 1980s connectionism. Andrew Barto, Richard
  Sutton, and Charles Anderson introduced actor-critic architectures with associative
  search elements (1983). Sutton formalized temporal-difference learning methods
  (TD(lambda), 1988), and Chris Watkins formulated Q-learning for Markov decision
  processes (1989). Gerald Tesauro's TD-Gammon (1992) achieved master-level backgammon
  play by training a multi-layer neural network through self-play, demonstrating the
  practical power of neural value function approximation that later inspired AlphaGo.
  Ronald Williams formulated the foundational REINFORCE policy-gradient algorithm in
  1992, completing the classical RL toolkit.
time_range: {start: 1982, end: 1998}

id: neural-modelling-marshes
level: country
name: The Neural Modelling Marshes
subtitle: "Logical neurons, Hebbian learning and the first learning machines, 1943–1954"
summary: >
  The birthplace of the connectionist pole: brain-inspired computation, synaptic
  learning and the first learning devices and programs. Warren McCulloch and
  Walter Pitts's "A Logical Calculus of the Ideas Immanent in Nervous Activity"
  (1943) gave the first mathematical neuron and showed that neural nets can
  compute any logical function. Their "How We Know Universals" (1947) offered
  the first neural-net account of invariant pattern recognition. Donald Hebb's
  The Organization of Behavior (1949) proposed the synaptic learning rule that
  bears his name. Claude Shannon's relay mouse Theseus (1950) learned a maze by
  trial and error. Marvin Minsky and Dean Edmonds's SNARC (1951) at Princeton
  was the first neural-network learning machine. Anthony Oettinger's EDSAC
  programs (1951–52) were the first programs written to learn. Stephen Kleene's
  1951 RAND analysis of nerve nets gave rise to regular expressions. Albert
  Uttley built conditional-probability nets, and Farley and Clark simulated
  self-organising systems in 1954. From 1952 McCulloch's group at MIT's Research
  Laboratory of Electronics was the neural-modelling hub.

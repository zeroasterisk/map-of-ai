id: systems-infrastructure-axis
level: country
name: The Megatron Yards
subtitle: "Megatron-LM, ZeRO/DeepSpeed, the A100 and Pathways/TPU v4, 2019–2022"
summary: >
  The yards where 100-billion-parameter training runs are assembled. Nvidia's
  Megatron-LM (Shoeybi, Catanzaro et al., 17 September 2019) split a single
  Transformer layer's matrices across GPUs — tensor parallelism — to train an
  8.3B model; Microsoft's ZeRO (October 2019) sharded optimizer state,
  gradients and parameters across data-parallel workers and shipped as
  DeepSpeed, producing Turing-NLG (17B, 13 February 2020). Nvidia's Ampere A100
  (announced 14 May 2020; 80 GB version November 2020) with TF32 and bfloat16
  tensor cores became the workhorse accelerator of the GPT-3 era — OPT, BLOOM
  and YaLM were all trained on A100 clusters. The two software stacks jointly
  trained Megatron-Turing NLG 530B (January 2022), while Google's Pathways
  system drove PaLM's 540B parameters across two TPU v4 pods (April 2022). This
  is the axis that turned Microsoft's 2019 $1B OpenAI investment into
  supercomputers, and the plateau's southern road to the compute hinterland of
  the generative coast.

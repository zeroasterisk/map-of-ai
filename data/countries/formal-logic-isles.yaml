id: formal-logic-isles
level: country
name: The Formal Logic Isles
subtitle: "Formal logic and the foundations of mathematics, 1666–1931"
summary: >
  The northern chain of the archipelago, where reasoning was first treated as
  symbol manipulation under explicit rules. Leibniz's characteristica
  universalis and calculus ratiocinator (1666–1679) are the symbolic pole's
  founding fantasy of mechanised reasoning. George Boole's An Investigation of
  the Laws of Thought (1854) gave an algebra of logic. Gottlob Frege's
  Begriffsschrift (1879) introduced modern predicate logic with quantifiers,
  the notation symbolic AI later used. Whitehead and Russell's Principia
  Mathematica (1910–1913) derived mathematics formally from logic, and Logic
  Theorist proved its theorems in 1956. David Hilbert's programme of the 1920s
  sought a finitary proof of the consistency, completeness and decidability of
  mathematics, and so posed the Entscheidungsproblem. Kurt Gödel's
  incompleteness theorems (1931) showed the limits of formal systems. Those
  theorems were later cited both for and against machine intelligence.

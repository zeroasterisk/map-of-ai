name: The Early ConvNet Ridge
subtitle: "Neocognitron, Bell Labs digit recognition and LSTM foundations, 1982–1998"
summary: >
  The perception and deep architecture ridge of the second connectionist wave.
  Building on Kunihiko Fukushima's shift-invariant Neocognitron (1980), Yann LeCun
  and colleagues at AT&T Bell Labs trained multi-layer convolutional neural networks
  with backpropagation for handwritten zip code recognition on postal envelopes (1989),
  culminating in LeNet-5, commercial cheque-reading systems, and the canonical MNIST
  benchmark dataset (1998). In parallel, Sepp Hochreiter diagnosed the fundamental
  vanishing-gradient problem in 1991, and with Jürgen Schmidhuber invented Long Short-Term
  Memory (LSTM, 1997) with constant error carrousels to preserve gradient flow across
  extended temporal sequences.
time_range: {start: 1982, end: 1998}

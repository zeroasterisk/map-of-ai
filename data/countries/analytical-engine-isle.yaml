id: analytical-engine-isle
level: country
name: The Analytical Engine Isle
subtitle: "Babbage's Analytical Engine and Lovelace's notes, 1837–1843"
summary: >
  A small isle for the first design of a general-purpose programmable machine.
  Charles Babbage designed the Analytical Engine in London from 1837. In 1843
  Ada Lovelace translated Luigi Menabrea's Sketch of the Analytical Engine and
  added her own notes. The notes describe how to program the engine and are
  counted as the first published program. They also contain the first argument
  about machine creativity: the engine "has no pretensions to originate
  anything". Alan Turing answered this "Lady Lovelace's objection" in 1950, as
  one of the nine objections in Computing Machinery and Intelligence. For that
  reason the isle is the offshore antecedent of the shore's Turing-test and
  philosophy-of-mind country, which sits on the mainland across the 1943
  coastline.
time_range: {start: 1837, end: 1843}

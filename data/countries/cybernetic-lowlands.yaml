name: The Cybernetic Lowlands
subtitle: "Feedback, control, homeostasis and adaptive machines, 1943–1955"
summary: >
  The southern lowlands of the shore, where feedback, control and homeostasis
  were studied as one science of animals and machines. Rosenblueth, Wiener and
  Bigelow's "Behavior, Purpose and Teleology" (1943) was the manifesto. The Macy
  Conferences in New York (1946–1953) brought Wiener, McCulloch, Pitts, von
  Neumann, Shannon, Bateson and Mead together. Wiener's Cybernetics (1948) named
  the field, and The Human Use of Human Beings (1950) took it to the public and
  to the automation debate. The lowlands also hold the computing coast: von
  Neumann's EDVAC report (1945), first realised in the Manchester Baby (1948),
  and his Hixon lecture on automata (1948). In Britain, Grey Walter's tortoises
  (1948–49), Ross Ashby's Homeostat and Design for a Brain (1952), and the Ratio
  Club, founded in 1949 with Kenneth Craik as its acknowledged precursor,
  embodied adaptive behaviour in hardware. Couffignal's 1951 Paris colloque
  brought cybernetics to continental Europe. The Soviet press denounced it as a
  "reactionary pseudoscience" from 1950 to 1954, and rehabilitation began in
  1955.

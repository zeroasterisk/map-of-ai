name: The Micro-Worlds Basin
subtitle: "Semantic information processing, ELIZA, SHRDLU and frames, 1956–1974"
summary: >
  The natural language and knowledge representation valley at MIT, exploring domain-bounded
  reasoning and semantic understanding. Formulated in Marvin Minsky's "Steps Toward
  Artificial Intelligence" (1961), MIT researchers created programs like Slagle's
  SAINT (1961), Bobrow's STUDENT (1964), and Raphael's SIR (1964). In 1966, Joseph
  Weizenbaum built ELIZA, revealing how readily human interlocutors project deep
  understanding onto simple pattern-matching rules. Terry Winograd's SHRDLU (1970)
  integrated syntax, semantics, and blocks-world planning, before Marvin Minsky
  introduced the frame theory of representation (1974), defining how structured
  expectations and default values organize human knowledge.

id: compute-hardware-hinterland
level: country
name: The Compute Hinterland
subtitle: "Nvidia Hopper to Blackwell, TPUs, Groq, export controls and the Stargate build-out, 2022–present"
summary: >
  Behind the coast lies the hinterland that feeds it. Nvidia's Hopper H100 was
  announced in March 2022 and Blackwell (B200/GB200) at GTC on 18 March 2024;
  compute supply became the strategic bottleneck and Nvidia passed a $1 trillion
  market capitalisation in 2023 and $4 trillion in 2025. Groq's LPU (GroqCloud,
  19 February 2024) is the era's inference challenger. The hinterland is also
  statecraft: the BIS export controls on advanced computing and semiconductors
  to China took effect on 7 October 2022, and the "Framework for Artificial
  Intelligence Diffusion" rule followed on 13 January 2025 — DeepSeek-V3's
  reported ~$5.6M training cost (26 December 2024) and the large one-day Nvidia
  stock drop after DeepSeek-R1 (27 January 2025) are the Chinese Shore's
  efficiency response. The Stargate Project (21 January 2025) announced a $500
  billion US data-centre plan with OpenAI, Oracle and SoftBank, two days before
  EO 14179 pivoted US policy from safety to build-out. Test-time-compute
  reasoning models and agent loops turned inference, not only training, into
  the hinterland's demand.

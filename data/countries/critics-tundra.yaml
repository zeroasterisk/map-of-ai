name: The Critics' Tundra
subtitle: "Physical symbol systems and the philosophical critics of AI, 1974–1993"
summary: >
  The philosophy-and-foundations ridge at the far north of the Winter Steppes. At one
  end stands symbolic AI's creed, Newell and Simon's physical symbol system hypothesis,
  stated in their 1975 Turing Award lecture and published in 1976. Around it, critics
  pressed on AI's claims. Joseph Weizenbaum's insider critique Computer Power and
  Human Reason appeared in 1976. John Searle's Chinese Room (1980) argued that
  manipulating symbols is not understanding and gave "strong AI" its name. In 1986
  Hubert and Stuart Dreyfus's Mind over Machine argued that expertise is intuitive
  know-how, not rules, taking direct aim at expert systems. Winograd and Flores's
  Understanding Computers and Cognition and Minsky's The Society of Mind appeared the
  same year. Moravec's Mind Children (1988) named the lesson that perception and
  mobility are harder than reasoning. Rodney Brooks's "Elephants Don't Play Chess"
  (1990) and "Intelligence Without Representation" (1991) are the definitive
  anti-representationalist manifestos.

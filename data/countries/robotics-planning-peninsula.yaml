name: The Robotics & Planning Peninsula
subtitle: "Blocks-world vision, Shakey the Robot, A* search, STRIPS and plan execution, 1963–1974"
summary: >
  The embodied intelligence region developed at Stanford Research Institute (SRI),
  uniting perception, representation, and physical action. Between 1966 and 1972,
  Charles Rosen, Nils Nilsson, and Peter Hart created Shakey the Robot, the world's
  first mobile robot to reason about its actions. To navigate and manipulate its
  environment, Hart, Nilsson, and Bertram Raphael developed the A* shortest-path
  algorithm (1968), and Richard Fikes and Nilsson created the STRIPS automated
  planner (1971), establishing the classical hierarchy of deliberative robotics
  that linked perception, spatial mapping, and symbolic action execution into an integrated agent.

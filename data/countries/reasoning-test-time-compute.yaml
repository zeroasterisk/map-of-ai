id: reasoning-test-time-compute
level: country
name: Reasoning Ridge
subtitle: "o1, o3, DeepSeek-R1 and thinking models trained with RL on verifiable rewards, 2024–present"
summary: >
  The ridge where the RL river re-joins the LLM mainstream. DeepSeekMath
  introduced GRPO (February 2024) and OpenAI's o1-preview (12 September 2024)
  was the first "reasoning model", trained with reinforcement learning to think
  before answering, making test-time compute a new scaling axis; the full o1
  followed on 5 December 2024 and o3 was announced on 20 December 2024. On
  20 January 2025 DeepSeek-R1 — open weights, MIT-licensed — matched o1 on
  reasoning, topped the US App Store on 27 January and triggered a large
  one-day Nvidia stock drop: the "DeepSeek moment". Google's Gemini 2.5
  "thinking" model (25 March 2025) and OpenAI's o3 and o4-mini (16 April 2025,
  with native tool use inside the chain of thought) followed, and GPT-5
  (7 August 2025) merged reasoning and non-reasoning routing into one model.
  AlphaProof and AlphaGeometry 2 reached IMO silver-medal standard (25 July
  2024) and Gemini Deep Think and an OpenAI experimental model reached gold at
  IMO 2025 (July 2025). The 2024 ACM Turing Award to Andrew Barto and Richard
  Sutton for reinforcement learning was announced on 5 March 2025.

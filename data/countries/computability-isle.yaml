id: computability-isle
level: country
name: The Computability Isle
subtitle: "Church, Turing, Post and the theory of computation, 1936–1942"
summary: >
  The largest and nearest isle, close enough that the shore is in sight. It
  holds the work that asked what can be computed mechanically at all. In 1936
  Alonzo Church at Princeton published "An Unsolvable Problem of Elementary
  Number Theory", which introduced the lambda calculus and gave an independent
  negative answer to Hilbert's Entscheidungsproblem. Lisp later drew on the
  lambda calculus. In 1936–37 Alan Turing's "On Computable Numbers" defined
  the Turing machine and the universal machine, the theoretical computer.
  Emil Post independently published an equivalent model in 1936, and Stephen
  Kleene developed recursion theory alongside Church and Turing. The
  equivalence of these formulations became the Church–Turing thesis. Church
  was Turing's doctoral supervisor. The Turing 1936 isle is drawn with a
  causeway to the shore, where Turing's 1950 paper sits.

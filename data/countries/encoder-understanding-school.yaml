id: encoder-understanding-school
level: country
name: The BERT Escarpment
subtitle: "Encoder-only masked-language pre-training for language understanding, 2018–2020"
summary: >
  The plateau's escarpment of language understanding. Howard and Ruder's ULMFiT
  (18 January 2018) and Peters et al.'s ELMo (February 2018) showed that a
  pre-trained language model transfers to text tasks; Devlin et al.'s BERT (11
  October 2018) made the recipe bidirectional, pre-training an encoder-only
  Transformer with masked-language modelling and setting new marks on GLUE,
  SQuAD and SWAG. Wang, Bowman et al.'s GLUE (April 2018) and SuperGLUE (May
  2019, after models passed GLUE's human baseline) were the scoreboard; the 2019
  improvement wave — XLNet (June), Facebook AI's RoBERTa (July) and Hugging
  Face's DistilBERT (October) — topped it in turn, and Raffel et al.'s T5
  (October 2019; JMLR 2020) recast every NLP task as text-to-text on the C4
  corpus. Encoders became the workhorse of Google Search and industrial NLP.
  The school's eastern border is retrieval: Lewis et al.'s RAG (2020) and
  DeepMind's RETRO (December 2021) bolt lookup onto generation, where the
  decoder camp takes over.

name: The Computability & Universal Machine Archipelago
subtitle: "Church's lambda calculus, the Universal Turing Machine and the Entscheidungsproblem, 1931–1942"
summary: >
  The easternmost island chain of the Antecedent Isles, lying immediately off the 1943
  Cybernetic Shore and linked to the mainland by a causeway. Answering David Hilbert's
  Entscheidungsproblem in the negative, Alonzo Church introduced the lambda calculus
  (1936), Emil Post formulated production rewriting systems (1936), Stephen Kleene
  developed recursive function theory, and Alan Turing published On Computable Numbers
  (1936–1937), defining the mathematical model of the universal stored-program computer.
  Together, the Church–Turing thesis established that every effectively calculable
  process can be executed by a single universal symbol-manipulating machine, while
  Church's lambda notation directly seeded John McCarthy's creation of Lisp two decades
  later.
time_range: {start: 1931, end: 1942}

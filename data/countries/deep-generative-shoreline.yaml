id: deep-generative-shoreline
level: country
name: The Generative Shoreline
subtitle: "Deep generative models: VAEs, GANs and autoregressive nets, 2013–2017"
summary: >
  A narrow coast where the basin first learned to make things rather than
  recognise them. Kingma and Welling's variational autoencoder (December 2013)
  and Goodfellow and colleagues' generative adversarial networks (Montréal, June
  2014) arrived within six months of each other; Radford, Metz and Chintala's
  DCGAN (2015) made GANs practical for images. DeepMind's PixelRNN and PixelCNN
  (2016) and WaveNet (September 2016) established the autoregressive likelihood
  family as the third route, generating raw audio sample by sample. Gatys, Ecker
  and Bethge's neural style transfer (Tübingen, 2015) and Google's DeepDream
  were the school's public face: the first viral neural-art moment, and the
  opening of the generative-media district that diffusion models would build out
  on the next continent.

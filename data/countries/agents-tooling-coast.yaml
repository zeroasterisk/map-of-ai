id: agents-tooling-coast
level: country
name: The Agents Causeway
subtitle: "Tool use, protocols and coding agents from LangChain and ReAct to MCP and Claude Code, 2022–present"
summary: >
  The causeway runs from chat models out to systems that plan, call tools and
  act. Agent scaffolding appeared in open source months before the labs shipped
  it: LangChain (October 2022), ReAct, Toolformer (9 February 2023, language
  models teaching themselves API calls) and AutoGPT (30 March 2023). OpenAI
  added function calling to its API (13 June 2023) and, at DevDay (6 November
  2023), the Assistants API and custom GPTs; SWE-bench (October 2023), GAIA
  (November 2023) and Chatbot Arena (3 May 2023) became the scoreboards.
  Cognition's Devin (12 March 2024) and the Cursor editor made coding the agent
  beachhead; Anthropic's computer use (22 October 2024) drove a desktop from
  screenshots, and the Model Context Protocol (25 November 2024; adopted by
  OpenAI March 2025, donated to the Linux Foundation 9 December 2025) became
  the standard plumbing, with Google's Agent2Agent protocol (9 April 2025)
  layered on top. OpenAI Operator (23 January 2025), Claude Code (February
  2025; GA May 2025), Manus (6 March 2025), ChatGPT Atlas (21 October 2025) and
  Claude Cowork (12 January 2026) made agentic coding and browsing everyday
  products. RT-2 (28 July 2023) and Gemini Robotics (12 March 2025) carry the
  causeway out to the robotics islands.

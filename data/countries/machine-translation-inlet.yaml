id: machine-translation-inlet
level: country
name: The Machine Translation Inlet
subtitle: "Weaver's memorandum and the Georgetown–IBM experiment, 1949–1954"
summary: >
  A narrow inlet at mid-latitude and the first funded "language AI". In July
  1949 Warren Weaver of the Rockefeller Foundation circulated his "Translation"
  memorandum. It proposed computer translation through cryptanalysis,
  McCulloch–Pitts-style logic and language universals, and it launched funded
  machine-translation research in the United States. Yehoshua Bar-Hillel became
  the first full-time MT researcher at MIT and organised the first MT
  conference there in June 1952. On 7 January 1954 the Georgetown–IBM
  experiment publicly demonstrated Russian-to-English machine translation. The
  demonstration triggered a decade of MT funding, which the ALPAC report of
  1966 later reversed. The inlet borders the winter episode of the Symbolic
  Heartland to the east and, much further on, statistical NLP.

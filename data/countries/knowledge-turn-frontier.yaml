name: The Knowledge Turn Frontier
subtitle: "MYCIN, PROSPECTOR and 'knowledge is power' on the first frozen band, 1974–1980"
summary: >
  The western frozen band of the Winter Steppes. After the 1974 funding cliff, AI
  regrouped here around a new thesis: intelligence in a domain comes less from clever
  general search than from large bodies of hand-coded expert knowledge. MYCIN,
  developed at Stanford from 1972 to 1976 as Edward Shortliffe's PhD with Bruce
  Buchanan and Stanley Cohen, was a backward-chaining consultant with about 600 rules
  and certainty factors. It became the template for expert systems. SRI's PROSPECTOR,
  first described by Peter Hart at IJCAI-75, applied Bayesian-style inference nets to
  mineral exploration. In 1977 Edward Feigenbaum's IJCAI lecture made knowledge
  engineering a programme, and EMYCIN separated the inference engine from the knowledge
  base. Charles Forgy's OPS5 and Rete algorithm (1979–82) supplied the production-system
  engine that would drive XCON. The field then institutionalised: AAAI was founded in
  1979, and it held its first National Conference at Stanford and launched AI
  Magazine in 1980.

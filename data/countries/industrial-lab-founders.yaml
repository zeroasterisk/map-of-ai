id: industrial-lab-founders
level: country
name: The Corporate Lab Colonies
subtitle: "Founding of the industrial deep-learning labs, 2011–2015"
summary: >
  The migration of the field's centre of gravity from universities to corporate
  laboratories, drawn as a chain of colonies along the basin's ridge. Google
  Brain began in 2011 with Ng, Dean and Corrado and produced DistBelief and the
  2012 "cat" experiment; Google bought Hinton's DNNresearch (March 2013, with
  Krizhevsky and Sutskever) and then DeepMind (January 2014, reported at
  $400–650 million); Facebook hired LeCun to found FAIR (December 2013); Baidu
  appointed Ng chief scientist to lead Baidu Research in Sunnyvale and Beijing
  (May 2014). OpenAI was founded as a non-profit in December 2015 by Musk,
  Altman, Sutskever, Brockman and others, explicitly around AI's societal
  stakes. These five moves set the funding, compute and talent map of the
  frontier-lab archipelago on the next two continents.

name: The AlphaGo Delta
subtitle: "Deep reinforcement learning from DQN to AlphaGo Zero, 2013–2017"
summary: >
  The RL River re-emerges from underground here and fans out into a delta. Mnih
  and colleagues at DeepMind showed a single convolutional network learning
  Atari games from pixels (DQN, December 2013; Nature, February 2015); A3C
  (2016) ran policy gradients on ordinary CPUs; OpenAI Gym (2016) gave the field
  a shared arena. Silver's AlphaGo combined learned policy and value networks
  with Monte-Carlo tree search, beat Fan Hui 5–0 in October 2015 and Lee Sedol
  4–1 in Seoul in March 2016 — the era's Deep-Blue moment, on a problem thought
  to be a decade away. AlphaGo Master beat Ke Jie 3–0 (May 2017) and AlphaGo
  Zero (October 2017) learned from self-play alone, beating the Lee Sedol
  version 100–0 after three days. Its tree search is the one feature of the
  basin that reaches toward the symbolic bank.

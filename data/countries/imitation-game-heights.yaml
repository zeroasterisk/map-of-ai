id: imitation-game-heights
level: country
name: The Imitation Game Heights
subtitle: "The Turing test and the philosophy of machine intelligence, 1948–1950"
summary: >
  The northern ridge of the shore, where the question "can machines think?"
  was first given a behavioural test. In 1948 Alan Turing wrote the NPL report
  "Intelligent Machinery". It described "unorganised machines" (random neural
  nets), learning and search, and was not published until 1968. In 1950 his
  "Computing Machinery and Intelligence" in Mind proposed the imitation game,
  later called the Turing test, and rebutted nine objections to machine
  intelligence. One of them was Lady Lovelace's 1843 objection that the
  Analytical Engine "has no pretensions to originate anything", which forms
  this school's offshore antecedent. The heights connect eastward to ELIZA,
  to the Dreyfus and Searle critiques, and eventually to the debates of the
  LLM era.

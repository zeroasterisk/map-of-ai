name: The Cybernetic Feedback & Homeostat Lowlands
subtitle: "Wiener's Cybernetics, the Macy Conferences, Walter's tortoises, Ashby's Homeostat and Theseus, 1949–1956"
summary: >
  The southern embodied lowlands of the Cybernetic Shore, grounded in negative feedback,
  teleological control, homeostasis, and autonomous electro-mechanical agents. Growing
  out of Rosenblueth, Wiener, and Bigelow's 1943 manifesto on purposive behavior, Norbert
  Wiener's Cybernetics (1948), and the interdisciplinary Macy Conferences (1946–1953),
  this region modeled adaptive intelligence as dynamical interaction with an environment
  rather than internal symbol manipulation. In Britain's Ratio Club circle, W. Grey
  Walter built the phototropic autonomous tortoises Elmer and Elsie (1948–1949) and W.
  Ross Ashby constructed the ultrastable Homeostat (1949) and published Design for a
  Brain (1952), while at Bell Labs Claude Shannon built Theseus (1950), a relay-driven
  mouse that learned mazes by trial and error.

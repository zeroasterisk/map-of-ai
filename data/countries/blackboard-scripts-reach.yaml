name: The Blackboard & Scripts Reach
subtitle: "Hearsay-II, Schank's scripts and the Stanford Cart, 1974–1980"
summary: >
  The second strip of the western frozen band, where knowledge-based architectures for
  language, speech and action were tried out before the commercial boom. At CMU, Lee
  Erman, Rick Hayes-Roth, Victor Lesser and Raj Reddy demonstrated the Hearsay-II
  speech-understanding system in 1976, as DARPA's Speech Understanding Research
  programme closed. Its "blackboard" architecture, written up in 1980, had many knowledge
  sources cooperating on a shared blackboard, and later 1980s AI reused it as a control
  architecture. At Yale, Roger Schank and Robert Abelson's Scripts, Plans, Goals and
  Understanding (1977) made scripts the stereotyped knowledge structures of language
  understanding. At Stanford, Hans Moravec's Cart crossed a chair-filled room
  autonomously using stereo vision in 1979, the first computer-controlled autonomous
  vehicle. Moravec then moved to CMU's new Robotics Institute in 1980. The Cart's
  deliberative approach is the foil that Brooks's behaviour-based robotics would later
  reject.

name: The Eleutherian Commons
subtitle: "EleutherAI, the Hugging Face hub, OPT-175B, BLOOM and YaLM, 2020–2022"
summary: >
  The grassroots commons on the plateau's eastern slope. Hugging Face's
  `transformers` library (2019) was already the de facto hub for sharing
  pretrained models when EleutherAI — a collective formed on Discord in 2020 —
  released The Pile (825 GB of open training text, 31 December 2020), then
  GPT-Neo and GPT-J (6B) in 2021 and GPT-NeoX-20B (April 2022), the first
  open GPT-3-class replications. The big labs followed: Meta AI's OPT-175B (3
  May 2022) released weights to researchers on request, smaller sizes openly,
  and the full training logbook; Yandex open-sourced YaLM-100B (June 2022,
  800 A100s); and BigScience's BLOOM (176B, 46 languages, RAIL licence, July
  2022), trained March–July 2022 on France's Jean Zay public supercomputer,
  became the largest open-access LLM of the period. Together they form the
  open-vs-closed road's first waystations, a counterweight to the GPT-3 API
  that hands directly to Llama and Mistral in the generative coast.

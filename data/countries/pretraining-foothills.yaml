id: pretraining-foothills
level: country
name: The Pre-training Foothills
subtitle: "Unsupervised layer-wise pre-training and energy-based deep nets, 2006\u2013\
  2009"
summary: "The western foothills of the basin, where the term \"deep learning\" was\
  \ coined in earnest. Hinton, Osindero and Teh (2006) showed that a deep belief net\
  \ could be trained one restricted Boltzmann machine at a time; Hinton and Salakhutdinov\
  \ (Science, 2006) used the same trick for deep autoencoders, and Bengio, Lamblin,\
  \ Popovici and Larochelle (NIPS 2006) generalised greedy layer- wise training. The\
  \ CIFAR NCAP programme (from 2004) kept Toronto, Montr\xE9al and NYU funded through\
  \ the lean years. Glorot and Bengio's initialisation (2010) and Nair and Hinton's\
  \ rectified linear units (2010) then made plain supervised backprop work without\
  \ pre-training, so by 2012 the school was eclipsed by the GPU ConvNet school it\
  \ had enabled \u2014 and reborn a year later as the generative shoreline of VAEs\
  \ and GANs.\n"

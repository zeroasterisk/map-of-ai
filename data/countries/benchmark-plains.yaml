name: The Benchmark Plains
subtitle: "Conferences, textbooks, shared benchmarks, prizes and toolkits, 1993–2011"
summary: >
  The institutional flatlands where machine learning became a self-standing discipline.
  ICML became a full conference in 1993; Russell and Norvig's Artificial Intelligence:
  A Modern Approach (1995) and Tom Mitchell's Machine Learning (1997) became the
  standard texts; Deep Blue's May 1997 win over Kasparov gave the era its most-watched
  public milestone. JMLR (2000) made open-access publishing the norm, PASCAL VOC
  (2005–2012) gave vision a shared benchmark, and the Netflix Prize (2006–2009), Kaggle
  (2010) and scikit-learn (2010) turned statistical learning into a mass practice,
  while Valiant's 2010 Turing Award canonised learning theory.

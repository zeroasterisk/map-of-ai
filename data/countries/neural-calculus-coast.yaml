name: The Neural Calculus & Stored-Program Coast
subtitle: "McCulloch–Pitts logical neurons, EDVAC architecture and Shannon information theory, 1943–1956"
summary: >
  The upper-central littoral of the Cybernetic Shore, where mathematical logic merged
  with neurophysiology, communication engineering, and electronic computation. Opening
  in 1943 with Warren McCulloch and Walter Pitts's proof that networks of threshold
  neurons can compute any propositional logic expression, this province established
  both the connectionist paradigm and the finite-automata tradition later formalized by
  Stephen Kleene (1951). John von Neumann's 1945 EDVAC report synthesized McCulloch–Pitts
  neuron notation into the stored-program computer architecture first realized on the
  Manchester Baby (1948), while Claude Shannon's 1948 Mathematical Theory of
  Communication quantified entropy and channel capacity, and the 1949 Weaver memorandum
  and 1954 Georgetown–IBM experiment launched machine translation.

id: alignment-interpretability-plateau
level: country
name: The Alignment Plateau
subtitle: "Constitutional AI, DPO, scaling policies, interpretability and evals, 2022–present"
summary: >
  The RLHF canal from InstructGPT widens here into a plateau of lab-side safety
  method. Anthropic's "Constitutional AI: Harmlessness from AI Feedback"
  (15 December 2022) replaced human preference labels with model-written
  critiques against a written constitution; Rafailov and colleagues' Direct
  Preference Optimization (29 May 2023) removed RLHF's reward-model-plus-PPO
  loop and was widely adopted by open models. Anthropic's Responsible Scaling
  Policy (19 September 2023) tied AI Safety Levels to capability thresholds and
  became the template for the "if-then" frameworks later echoed by OpenAI and
  DeepMind. The plateau's public face was the risk debate of 2023: the Future of
  Life Institute's "Pause Giant AI Experiments" letter (22 March), Geoffrey
  Hinton leaving Google (May) and the Center for AI Safety's Statement on AI
  Risk (30 May); its private crisis was the OpenAI board's firing and
  reinstatement of Sam Altman (17–22 November 2023). Ilya Sutskever's Safe
  Superintelligence Inc. (19 June 2024) is the era's safety-motivated spin-out,
  and prompt injection — named when Bing Chat's "Sydney" prompt was extracted
  in February 2023 — its first security class.

id: bayesian-plateau
level: country
name: The Bayesian Plateau
subtitle: "Probabilistic graphical models, belief propagation and variational methods, 1993–2011"
summary: >
  The northern highland of the isthmus, where reasoning under uncertainty was
  formalized with directed and undirected graphs. Following Judea Pearl's belief
  propagation foundations, Steffen Lauritzen and David Spiegelhalter's junction-tree
  algorithm enabled exact probabilistic inference in medical diagnostic systems and
  complex expert systems. In the late 1990s, Michael I. Jordan, Zoubin Ghahramani,
  Tommi Jaakkola, and Lawrence Saul introduced variational methods for approximate
  inference in complex networks, paving the way for David Blei, Andrew Ng, and
  Jordan's Latent Dirichlet Allocation (LDA, 2003) and Daphne Koller and Nir Friedman's
  comprehensive graphical models synthesis (2009).
time_range: {start: 1993, end: 2011}

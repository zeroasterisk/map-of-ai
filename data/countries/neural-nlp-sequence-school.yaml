id: neural-nlp-sequence-school
level: country
name: The Attention Headwaters
subtitle: "Neural NLP and LSTM sequence-to-sequence models, 2011–2016"
summary: >
  Where the Attention River rises. Collobert and Weston's "NLP (almost) from
  scratch" (2011) argued that one neural architecture could replace hand-built
  pipelines; Mikolov's word2vec (Google, 2013) and Pennington, Socher and
  Manning's GloVe (Stanford, 2014) made word embeddings the field's common
  currency. Cho's GRU encoder–decoder and Sutskever, Vinyals and Le's seq2seq
  (2014) showed LSTMs translating whole sentences; Bahdanau, Cho and Bengio
  added attention over the source (September 2014); Show and Tell (2014)
  captioned images with the same recipe. Weston's Memory Networks and Graves's
  Neural Turing Machines (2014) and Differentiable Neural Computer (2016)
  reached toward explicit memory and reasoning. Google's GNMT (2016) put the
  LSTM-plus-attention stack into production translation — the high-water mark of
  recurrence, one year before "Attention Is All You Need" replaced it.
time_range: {start: 2011, end: 2016}

name: The Approximation Shelf
subtitle: "Universal approximation, RBF networks and Bayesian neural nets, 1988–1998"
summary: >
  The theoretical and statistical shelf on the southern edge of the connectionist
  continent. George Cybenko (1989) and Kurt Hornik, Maxwell Stinchcombe and Halbert
  White proved that feedforward networks with one hidden layer are universal
  approximators, while David Broomhead and David Lowe at RSRE Malvern recast learning
  as interpolation with radial-basis-function networks (1988), a bridge from neural
  nets toward kernel methods. In the 1990s the field acquired a Bayesian footing:
  David MacKay's evidence framework for backpropagation networks (1992), Christopher
  Bishop's textbook Neural Networks for Pattern Recognition (1995), and Radford Neal's
  Bayesian Learning for Neural Networks (1996) with its priors for infinite-width
  networks. Hinton, Dayan, Frey and Neal's wake-sleep algorithm and the Helmholtz
  machine (1995) trained recognition and generative networks together, pointing
  toward variational autoencoders and the statistical-learning era.

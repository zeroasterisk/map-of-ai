id: national-champion-scalers
level: country
name: The Sovereign Scaling Enclaves
subtitle: "Wu Dao, PanGu-α, ERNIE 3.0, YaLM and BigScience on Jean Zay, 2021–2022"
summary: >
  Enclaves on the plateau's eastern rim where states and national platforms
  answered GPT-3. In three months of 2021 China fielded its GPT-3-class models:
  Huawei's PanGu-α (up to 200B parameters, 26 April), the Beijing Academy of
  Artificial Intelligence's Wu Dao 2.0 (a 1.75-trillion-parameter mixture of
  experts, 31 May) and Baidu's ERNIE 3.0 (5 July), a knowledge-enhanced model
  for understanding and generation. Yandex open-sourced YaLM-100B (June 2022,
  trained on 800 A100s), and the BigScience workshop trained BLOOM (176B, 46
  languages) from March to July 2022 on France's Jean Zay public supercomputer
  under a RAIL licence. None displaced the Bay Area frontier, but together they
  established that the scaling recipe could be reproduced with state or platform
  compute outside it — the origin of the Chinese shore (DeepSeek, Qwen) and the
  European shore (Mistral) of the generative coast, and the continuation of
  China's 2017 national AI plan.

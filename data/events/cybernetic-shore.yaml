# Cybernetic Shore — named events rendered INTO the map at zoom levels 3 and 4.
# Every row traces to research/01-origins-pre-1956.md ([n] = its source number); shore half of its P1-T11 split
# table (timeline rows 10–36). `lod: 1–2` = landmark; `lod: 3` = headline event (labelled dot at z3 and z4,
# one_line at z4); `lod: 4` = detail event (z4 only). `hint` = z1 landmark hint; `tag` = z2 one-line tag.
countries:
  cybernetic-lowlands:
    hint: "Wiener's Cybernetics 1948"
    tag: "Teleology → Macy → Cybernetics → Homeostat"
    events:
      - {id: behavior-purpose-teleology-1943, name: Purpose and Teleology, year: 1943.0, lod: 2, one_line: "Rosenblueth, Wiener & Bigelow: feedback as the basis of purposive behaviour", sources: [{url: "https://doi.org/10.1086/286788", title: "Rosenblueth, Wiener & Bigelow, Behavior, Purpose and Teleology, 1943 [13]"}]}
      - {id: craik-nature-of-explanation-1943, name: Nature of Explanation, year: 1943.5, lod: 4, one_line: "Kenneth Craik's mental-model theory, the Ratio Club's acknowledged precursor", sources: [{url: "https://en.wikipedia.org/wiki/Kenneth_Craik", title: "Wikipedia: Kenneth Craik [48]"}]}
      - {id: edvac-first-draft-1945, name: EDVAC First Draft, year: 1945.5, lod: 3, one_line: "von Neumann's stored-program architecture makes programmable computers real", sources: [{url: "https://en.wikipedia.org/wiki/First_Draft_of_a_Report_on_the_EDVAC", title: "Wikipedia: First Draft of a Report on the EDVAC [14]"}]}
      - {id: macy-conferences-1946, name: Macy Conferences, year: 1946.2, lod: 3, one_line: "New York forum where Wiener, McCulloch, von Neumann, Shannon, Mead shape cybernetics", sources: [{url: "https://en.wikipedia.org/wiki/Macy_conferences", title: "Wikipedia: Macy conferences [15]"}]}
      - {id: manchester-baby-1948, name: Manchester Baby, year: 1948.47, lod: 3, one_line: "First stored-program computer runs (21 June 1948); prototype of the Ferranti Mark 1", sources: [{url: "https://en.wikipedia.org/wiki/Manchester_Baby", title: "Wikipedia: Manchester Baby [50]"}]}
      - {id: grey-walter-tortoises-1948, name: Grey Walter's Tortoises, year: 1948.5, lod: 3, one_line: "Elmer and Elsie: first autonomous electronic robots with goal-seeking behaviour", sources: [{url: "https://en.wikipedia.org/wiki/William_Grey_Walter", title: "Wikipedia: William Grey Walter [19]"}, {url: "https://en.wikipedia.org/wiki/Turtle_%28robot%29", title: "Wikipedia: Turtle (robot) [19]"}]}
      - {id: hixon-automata-1948, name: Theory of Automata, year: 1948.7, lod: 4, one_line: "von Neumann's Hixon lecture compares self-reproducing automata with McCulloch–Pitts nets", sources: [{url: "https://www.vordenker.de/ggphilosophy/jvn_the-general-and-logical-theory-of-automata.pdf", title: "von Neumann, The General and Logical Theory of Automata, 1948 [34]"}]}
      - {id: wiener-cybernetics-1948, name: Wiener's Cybernetics, year: 1948.8, lod: 2, one_line: "Names the field: feedback, control and information in animal and machine", sources: [{url: "https://archive.org/details/cyberneticsorcon00wien", title: "Wiener, Cybernetics, 1948 [16]"}]}
      - {id: ashby-homeostat-1949, name: Ashby's Homeostat, year: 1949.2, lod: 3, one_line: "Ross Ashby builds ultrastability and adaptation into hardware", sources: [{url: "https://en.wikipedia.org/wiki/Homeostat", title: "Wikipedia: Homeostat [21]"}]}
      - {id: ratio-club-1949, name: Ratio Club, year: 1949.5, lod: 3, one_line: "UK cybernetics circle: Turing, Ashby, Walter and Uttley", sources: [{url: "https://en.wikipedia.org/wiki/Ratio_Club", title: "Wikipedia: Ratio Club [22]"}]}
      - {id: human-use-of-human-beings-1950, name: Human Use of Humans, year: 1950.3, lod: 4, one_line: "Wiener takes cybernetics to the public and to the automation debate", sources: [{url: "https://en.wikipedia.org/wiki/The_Human_Use_of_Human_Beings", title: "Wikipedia: The Human Use of Human Beings [47]"}]}
      - {id: soviet-denunciation-1950, name: Soviet Denunciation, year: 1950.5, lod: 3, one_line: "Soviet press brands cybernetics a \"reactionary pseudoscience\" (1950–54)", sources: [{url: "https://en.wikipedia.org/wiki/Cybernetics_in_the_Soviet_Union", title: "Wikipedia: Cybernetics in the Soviet Union [42]"}]}
      - {id: paris-colloque-1951, name: Paris Colloque, year: 1951.02, lod: 3, one_line: "Couffignal's CNRS colloque on machines and thought; Wiener, Ashby, McCulloch attend", sources: [{url: "https://fr.wikipedia.org/wiki/Louis_Couffignal", title: "Wikipédia: Louis Couffignal [37]"}]}
      - {id: design-for-a-brain-1952, name: Design for a Brain, year: 1952.5, lod: 4, one_line: "Ashby frames adaptive behaviour as a dynamical-systems property", sources: [{url: "https://archive.org/details/designforbrain00ashb", title: "Ashby, Design for a Brain, 1952 [26]"}]}
      - {id: macy-conferences-end-1953, name: Last Macy Conference, year: 1953.5, lod: 4, one_line: "The 1946–1953 Macy series on cybernetics closes", sources: [{url: "https://en.wikipedia.org/wiki/Macy_conferences", title: "Wikipedia: Macy conferences [15]"}]}
      - {id: soviet-rehabilitation-1955, name: Soviet Rehabilitation, year: 1955.3, lod: 4, one_line: "Voprosy Filosofii articles begin cybernetics' rehabilitation in the Khrushchev thaw", sources: [{url: "https://en.wikipedia.org/wiki/Cybernetics_in_the_Soviet_Union", title: "Wikipedia: Cybernetics in the Soviet Union [42]"}]}
      - {id: colossus-1943, name: "Colossus", year: 1943.95, lod: 3, one_line: "Programmable electronic codebreaking computer working at Bletchley Park", sources: [{url: "https://en.wikipedia.org/wiki/Colossus_computer", title: "Wikipedia: Colossus computer [73]"}]}
      - {id: harvard-mark-i-1944, name: "Harvard Mark I", year: 1944.24, lod: 4, one_line: "Electromechanical calculator runs one of its first programs for von Neumann", sources: [{url: "https://en.wikipedia.org/wiki/Harvard_Mark_I", title: "Wikipedia: Harvard Mark I [74]"}]}
      - {id: theory-of-games-1944, name: "Theory of Games", year: 1944.5, lod: 3, one_line: "Von Neumann and Morgenstern found game theory, later behind minimax search", sources: [{url: "https://en.wikipedia.org/wiki/Theory_of_Games_and_Economic_Behavior", title: "Wikipedia: Theory of Games and Economic Behavior [75]"}]}
      - {id: as-we-may-think-1945, name: "As We May Think", year: 1945.5, lod: 4, one_line: "Vannevar Bush imagines the memex, an associative information machine", sources: [{url: "https://en.wikipedia.org/wiki/As_We_May_Think", title: "Wikipedia: As We May Think [76]"}]}
      - {id: eniac-1946, name: "ENIAC", year: 1946.12, lod: 3, one_line: "Programmable electronic computer dedicated at Penn; the press calls it a Giant Brain", sources: [{url: "https://en.wikipedia.org/wiki/ENIAC", title: "Wikipedia: ENIAC [77]"}]}
      - {id: turing-ace-design-1945, name: "ACE Design", year: 1945.9, lod: 4, one_line: "Turing completes a detailed stored-program computer design at NPL", sources: [{url: "https://en.wikipedia.org/wiki/Automatic_Computing_Engine", title: "Wikipedia: Automatic Computing Engine [78]"}]}
      - {id: edsac-1949, name: "EDSAC", year: 1949.35, lod: 3, one_line: "Cambridge stored-program machine runs its first programs", sources: [{url: "https://en.wikipedia.org/wiki/EDSAC", title: "Wikipedia: EDSAC [79]"}]}
      - {id: mesm-1950, name: "MESM", year: 1950.5, lod: 4, one_line: "Lebedev's MESM in Kiev: the first Soviet programmable electronic computer", sources: [{url: "https://en.wikipedia.org/wiki/MESM", title: "Wikipedia: MESM [80]"}]}
      - {id: ferranti-mark-1-1951, name: "Ferranti Mark 1", year: 1951.1, lod: 4, one_line: "First commercially available general-purpose stored-program computer reaches Manchester", sources: [{url: "https://en.wikipedia.org/wiki/Ferranti_Mark_1", title: "Wikipedia: Ferranti Mark 1 [25]"}]}
      - {id: univac-i-1951, name: "UNIVAC I", year: 1951.25, lod: 4, one_line: "US Census Bureau accepts the first UNIVAC", sources: [{url: "https://en.wikipedia.org/wiki/UNIVAC_I", title: "Wikipedia: UNIVAC I [82]"}]}
      - {id: leo-i-1951, name: "LEO I", year: 1951.8, lod: 4, one_line: "LEO I runs the first routine business application on a computer", sources: [{url: "https://en.wikipedia.org/wiki/LEO_%28computer%29", title: "Wikipedia: LEO (computer) [83]"}]}
      - {id: whirlwind-i-1951, name: "Whirlwind I", year: 1951.5, lod: 4, one_line: "MIT's real-time digital computer becomes operational; leads to SAGE", sources: [{url: "https://en.wikipedia.org/wiki/Whirlwind_I", title: "Wikipedia: Whirlwind I [85]"}]}
      - {id: hopper-a0-1952, name: "Hopper's A-0", year: 1952.0, lod: 4, one_line: "Grace Hopper writes an early compiler-related tool for the UNIVAC I", sources: [{url: "https://en.wikipedia.org/wiki/A-0_System", title: "Wikipedia: A-0 System [87]"}]}
      - {id: ias-machine-1952, name: "IAS Machine", year: 1952.44, lod: 4, one_line: "Von Neumann's Princeton machine becomes fully operational", sources: [{url: "https://en.wikipedia.org/wiki/IAS_machine", title: "Wikipedia: IAS machine [92]"}]}
      - {id: besm-1-1952, name: "BESM-1", year: 1952.5, lod: 4, one_line: "Moscow's BESM-1 completed: the fastest computer in Europe", sources: [{url: "https://en.wikipedia.org/wiki/BESM", title: "Wikipedia: BESM [93]"}]}
      - {id: turing-morphogenesis-1952, name: "Turing Morphogenesis", year: 1952.6, lod: 4, one_line: "Turing's reaction–diffusion theory of biological pattern formation", sources: [{url: "https://en.wikipedia.org/wiki/The_Chemical_Basis_of_Morphogenesis", title: "Wikipedia: The Chemical Basis of Morphogenesis [90]"}, {url: "https://api.crossref.org/works/10.1098/rstb.1952.0012", title: "Crossref record [91]"}]}
      - {id: unimate-patent-1954, name: "Unimate Patent", year: 1954.94, lod: 4, one_line: "George Devol files the patent for a programmable industrial arm", sources: [{url: "https://en.wikipedia.org/wiki/Unimate", title: "Wikipedia: Unimate [94]"}]}

  neural-modelling-marshes:
    hint: "McCulloch–Pitts 1943 · SNARC"
    tag: "McCulloch–Pitts → Hebb → Theseus → SNARC"
    events:
      - {id: mcculloch-pitts-1943, name: McCulloch–Pitts Neuron, year: 1943.9, lod: 1, one_line: "First mathematical neuron: nets compute any logical function; connectionist pole is born", sources: [{url: "https://doi.org/10.1007/BF02478259", title: "McCulloch & Pitts, A Logical Calculus…, 1943 [12]"}]}
      - {id: how-we-know-universals-1947, name: How We Know Universals, year: 1947.5, lod: 3, one_line: "Pitts & McCulloch: first neural-net account of invariant pattern recognition", sources: [{url: "https://doi.org/10.1007/BF02478291", title: "Pitts & McCulloch, How We Know Universals, 1947 [33]"}]}
      - {id: hebb-organization-of-behavior-1949, name: Hebbian Learning, year: 1949.5, lod: 3, one_line: "Hebb's synaptic rule: \"cells that fire together wire together\"", sources: [{url: "https://en.wikipedia.org/wiki/Organization_of_Behavior", title: "Wikipedia: The Organization of Behavior [20]"}, {url: "https://en.wikipedia.org/wiki/Hebbian_theory", title: "Wikipedia: Hebbian theory [20]"}]}
      - {id: shannon-theseus-1950, name: Theseus Mouse, year: 1950.5, lod: 3, one_line: "Shannon's relay mouse learns a maze by trial and error", sources: [{url: "https://en.wikipedia.org/wiki/Claude_Shannon", title: "Wikipedia: Claude Shannon [36]"}]}
      - {id: snarc-1951, name: SNARC, year: 1951.5, lod: 3, one_line: "Minsky & Edmonds: first neural-network learning machine, 40 Hebb-style synapses", sources: [{url: "https://en.wikipedia.org/wiki/Stochastic_neural_analog_reinforcement_calculator", title: "Wikipedia: SNARC [24]"}]}
      - {id: kleene-regular-events-1951, name: Regular Events, year: 1951.6, lod: 4, one_line: "Kleene's RAND memo on nerve nets gives birth to regular expressions and finite automata", sources: [{url: "https://en.wikipedia.org/wiki/Stephen_Cole_Kleene", title: "Wikipedia: Stephen Cole Kleene [38]"}, {url: "https://en.wikipedia.org/wiki/Regular_expression", title: "Wikipedia: Regular expression [38]"}]}
      - {id: oettinger-edsac-1951, name: Oettinger's Shopper, year: 1951.8, lod: 4, one_line: "EDSAC response-learning and Shopper programs: the first written to learn (1951–52)", sources: [{url: "https://en.wikipedia.org/wiki/Anthony_Oettinger", title: "Wikipedia: Anthony Oettinger [39]"}, {url: "https://api.crossref.org/works/10.1080/14786441208520256", title: "Oettinger, Programming a Digital Computer to Learn, 1952 [39]"}]}
      - {id: mit-rle-neural-hub-1952, name: MIT RLE Group, year: 1952.0, lod: 4, one_line: "McCulloch, Pitts and Lettvin at MIT's RLE become the neural-modelling hub", sources: [{url: "https://en.wikipedia.org/wiki/Walter_Pitts", title: "Wikipedia: Walter Pitts [51]"}]}
      - {id: farley-clark-1954, name: Farley & Clark, year: 1954.5, lod: 4, one_line: "Simulation of self-organizing systems by digital computer", sources: [{url: "https://doi.org/10.1109/TIT.1954.1057468", title: "Farley & Clark, 1954 [30]"}]}
      - {id: hodgkin-huxley-1952, name: "Hodgkin–Huxley Model", year: 1952.65, lod: 3, one_line: "Quantitative model of the squid-axon action potential", sources: [{url: "https://en.wikipedia.org/wiki/Hodgkin%E2%80%93Huxley_model", title: "Wikipedia: Hodgkin–Huxley model [88]"}, {url: "https://api.crossref.org/works/10.1113/jphysiol.1952.sp004764", title: "Crossref record [89]"}]}
      - {id: fix-hodges-knn-1951, name: "Nearest Neighbour Rule", year: 1951.5, lod: 4, one_line: "Fix and Hodges introduce nearest-neighbour pattern classification", sources: [{url: "https://en.wikipedia.org/wiki/K-nearest_neighbors_algorithm", title: "Wikipedia: k-nearest neighbors algorithm [86]"}]}

  imitation-game-heights:
    hint: "Turing test 1950"
    tag: "Intelligent Machinery → Imitation Game"
    events:
      - {id: turing-intelligent-machinery-1948, name: Intelligent Machinery, year: 1948.5, lod: 3, one_line: "Turing's NPL report on unorganised machines, learning and search; unpublished until 1968", sources: [{url: "https://weightagnostic.github.io/papers/turing1948.pdf", title: "Turing, Intelligent Machinery, 1948 [18]"}]}
      - {id: turing-imitation-game-1950, name: The Imitation Game, year: 1950.75, lod: 1, one_line: "Turing's Computing Machinery and Intelligence in Mind proposes the Turing test", sources: [{url: "https://redirect.cs.umbc.edu/courses/471/papers/turing.pdf", title: "Turing, Computing Machinery and Intelligence, 1950 [7]"}]}
      - {id: turing-nine-objections-1950, name: Nine Objections, year: 1950.8, lod: 4, one_line: "Turing rebuts nine objections to thinking machines, including Lovelace's", sources: [{url: "https://en.wikipedia.org/wiki/Computing_Machinery_and_Intelligence", title: "Wikipedia: Computing Machinery and Intelligence [7]"}]}

  game-search-foothills:
    hint: "Shannon 1948 · Dartmouth 1955"
    tag: "Information theory → Minimax → Checkers → Dartmouth"
    events:
      - {id: turochamp-1948, name: Turochamp, year: 1948.3, lod: 4, one_line: "Turing & Champernowne's paper chess program; Zuse's Plankalkül routines also never ran", sources: [{url: "https://en.wikipedia.org/wiki/Turochamp", title: "Wikipedia: Turochamp [41]"}, {url: "https://en.wikipedia.org/wiki/Plankalk%C3%BCl", title: "Wikipedia: Plankalkül [45]"}]}
      - {id: shannon-information-theory-1948, name: Information Theory, year: 1948.55, lod: 2, one_line: "Shannon quantifies information; later underlies probabilistic AI", sources: [{url: "https://people.math.harvard.edu/~ctm/home/text/others/shannon/entropy/entropy.pdf", title: "Shannon, A Mathematical Theory of Communication, 1948 [17]"}]}
      - {id: shannon-chess-1950, name: Shannon's Chess Paper, year: 1950.2, lod: 3, one_line: "Minimax search with an evaluation function: the template for game-playing AI", sources: [{url: "https://vision.unipv.it/IA1/ProgrammingaComputerforPlayingChess.pdf", title: "Shannon, Programming a Computer for Playing Chess, 1950 [23]"}]}
      - {id: strachey-draughts-1951, name: Strachey's Draughts, year: 1951.5, lod: 3, one_line: "First game-playing programs on a stored-program computer, the Ferranti Mark 1", sources: [{url: "https://en.wikipedia.org/wiki/Ferranti_Mark_1", title: "Wikipedia: Ferranti Mark 1 [25]"}, {url: "https://en.wikipedia.org/wiki/Christopher_Strachey", title: "Wikipedia: Christopher Strachey [25]"}]}
      - {id: prinz-chess-1951, name: Prinz's Chess, year: 1951.6, lod: 4, one_line: "Dietrich Prinz's chess program runs on the Ferranti Mark 1, inspired by Turochamp", sources: [{url: "https://en.wikipedia.org/wiki/Dietrich_Prinz", title: "Wikipedia: Dietrich Prinz [25]"}, {url: "https://en.wikipedia.org/wiki/Turochamp", title: "Wikipedia: Turochamp [41]"}]}
      - {id: turochamp-glennie-1952, name: Turochamp vs Glennie, year: 1952.2, lod: 4, one_line: "Turing hand-simulates Turochamp in a game against Alick Glennie", sources: [{url: "https://en.wikipedia.org/wiki/Turochamp", title: "Wikipedia: Turochamp [41]"}]}
      - {id: ibm-701-1952, name: IBM 701, year: 1952.37, lod: 4, one_line: "IBM's first commercial scientific computer announced (May 1952); Samuel's checkers host", sources: [{url: "https://en.wikipedia.org/wiki/IBM_701", title: "Wikipedia: IBM 701 [43]"}]}
      - {id: strachey-love-letters-1952, name: Love-Letter Generator, year: 1952.5, lod: 4, one_line: "Strachey's Ferranti Mark 1 love letters: the first computer-generated text", sources: [{url: "https://en.wikipedia.org/wiki/Strachey_love_letter_algorithm", title: "Wikipedia: Strachey love letter algorithm [46]"}]}
      - {id: samuel-checkers-701-1952, name: Samuel's Checkers, year: 1952.6, lod: 3, one_line: "Samuel's IBM checkers program learns by rote and self-play; he coins \"machine learning\"", sources: [{url: "https://doi.org/10.1147/rd.33.0210", title: "Samuel, Checkers, IBM J. 1959 [27]"}, {url: "https://en.wikipedia.org/wiki/Arthur_Samuel_%28computer_scientist%29", title: "Wikipedia: Arthur Samuel [27]"}]}
      - {id: dartmouth-proposal-1955, name: Dartmouth Proposal, year: 1955.66, lod: 2, one_line: "McCarthy, Minsky, Rochester & Shannon coin \"artificial intelligence\" (31 Aug 1955)", sources: [{url: "http://jmc.stanford.edu/articles/dartmouth/dartmouth.pdf", title: "McCarthy et al., Dartmouth Proposal, 1955 [29]"}]}
      - {id: samuel-checkers-demo-1956, name: Checkers Demo, year: 1956.1, lod: 4, one_line: "Samuel's learning checkers program is publicly demonstrated on the IBM 701", sources: [{url: "https://en.wikipedia.org/wiki/IBM_701", title: "Wikipedia: IBM 701 [43]"}, {url: "https://en.wikipedia.org/wiki/Arthur_Samuel_%28computer_scientist%29", title: "Wikipedia: Arthur Samuel [27]"}]}
      - {id: bertie-the-brain-1950, name: "Bertie the Brain", year: 1950.7, lod: 4, one_line: "Josef Kates's tic-tac-toe computer plays visitors at the Canadian National Exhibition", sources: [{url: "https://en.wikipedia.org/wiki/Bertie_the_Brain", title: "Wikipedia: Bertie the Brain [81]"}]}
      - {id: nimrod-1951, name: "Nimrod", year: 1951.4, lod: 4, one_line: "Ferranti's Nim-playing computer challenges visitors at the Festival of Britain", sources: [{url: "https://en.wikipedia.org/wiki/Nimrod_%28computer%29", title: "Wikipedia: Nimrod (computer) [84]"}]}
      - {id: ipl-1956, name: "IPL", year: 1956.0, lod: 4, one_line: "Newell, Shaw and Simon's IPL introduces list processing", sources: [{url: "https://en.wikipedia.org/wiki/Information_Processing_Language", title: "Wikipedia: Information Processing Language [95]"}]}

  machine-translation-inlet:
    hint: "Georgetown–IBM 1954"
    tag: "Weaver memo → MIT conference → Georgetown–IBM"
    events:
      - {id: weaver-translation-memo-1949, name: Weaver's Memorandum, year: 1949.54, lod: 3, one_line: "Weaver proposes computer translation via cryptanalysis and logic; launches US MT funding", sources: [{url: "https://en.wikipedia.org/wiki/Warren_Weaver", title: "Wikipedia: Warren Weaver [35]"}, {url: "https://en.wikipedia.org/wiki/History_of_machine_translation", title: "Wikipedia: History of machine translation [35]"}]}
      - {id: bar-hillel-mit-1951, name: Bar-Hillel at MIT, year: 1951.5, lod: 4, one_line: "Yehoshua Bar-Hillel becomes the first full-time machine-translation researcher", sources: [{url: "https://en.wikipedia.org/wiki/Yehoshua_Bar-Hillel", title: "Wikipedia: Yehoshua Bar-Hillel [40]"}]}
      - {id: mit-mt-conference-1952, name: First MT Conference, year: 1952.45, lod: 4, one_line: "Bar-Hillel organises the first machine-translation conference at MIT (June 1952)", sources: [{url: "https://en.wikipedia.org/wiki/Yehoshua_Bar-Hillel", title: "Wikipedia: Yehoshua Bar-Hillel [40]"}]}
      - {id: georgetown-ibm-1954, name: Georgetown–IBM, year: 1954.02, lod: 3, one_line: "Public Russian→English MT demo (7 Jan 1954); a decade of funding until ALPAC", sources: [{url: "https://en.wikipedia.org/wiki/Georgetown%E2%80%93IBM_experiment", title: "Wikipedia: Georgetown–IBM experiment [28]"}]}

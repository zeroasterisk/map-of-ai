# The Generative Coast — named events rendered INTO the map at zoom levels 3 and 4 (same schema as
# deep-learning-basin.yaml). Every row traces to research/08-generative-ai-and-agents-2022-present.md
# ("## Timeline of key events" + "## Sources" [n]) — nothing here is new research; every url is copied verbatim
# from that file's source list. `lod: 3` = headline event (labelled dot at z3 and z4, one_line at z4);
# `lod: 4` = detail event (z4 only). `hint` = the z1 landmark hint; `tag` = the z2 one-line tag.
# Positions are NOT stored: x = X(year), y = inside the country's own polygon (atlas.html).
# Events the task brief suggested but which research/08 does not carry (Let's Verify Step by Step, Quiet-STaR,
# ControlNet, Flux, Sleeper Agents, Golden Gate Claude, TPU v5p, SB 1047) are deliberately NOT listed.

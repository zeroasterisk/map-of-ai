# Antecedent Isles — named events rendered INTO the map at zoom levels 3 and 4.
# Every row traces to research/01-origins-pre-1956.md ([n] = its source number); archipelago half of its
# P1-T11 split table (timeline rows 1–9). `lod: 1–2` = landmark; `lod: 3` = headline event (labelled dot at z3 and
# z4, one_line at z4); `lod: 4` = detail event (z4 only). `hint` = z1 landmark hint; `tag` = z2 one-line tag.
# research/01 pre-1943 rows (incl. the 2026-09-23 machine/logic additions [52]–[72]); no padding beyond the research.
countries:
  formal-logic-isles:
    hint: "Leibniz 1666 · Gödel 1931"
    tag: "Leibniz → Boole → Frege → Principia → Gödel"
    events:
      - {id: leibniz-characteristica-1666, name: Calculus Ratiocinator, year: 1666.0, lod: 2, one_line: "Leibniz proposes a universal formal language and mechanical rules of reasoning (1666–1679)", sources: [{url: "https://plato.stanford.edu/entries/leibniz-logic-influence/", title: "SEP, Leibniz's Influence on 19th Century Logic [1]"}]}
      - {id: boole-laws-of-thought-1854, name: Laws of Thought, year: 1854.0, lod: 3, one_line: "George Boole's algebra of logic: reasoning as symbol manipulation", sources: [{url: "https://www.gutenberg.org/ebooks/15114", title: "Boole, An Investigation of the Laws of Thought, 1854 [4]"}]}
      - {id: frege-begriffsschrift-1879, name: Begriffsschrift, year: 1879.0, lod: 3, one_line: "Frege's predicate logic with quantifiers: the notation of symbolic AI", sources: [{url: "https://en.wikipedia.org/wiki/Begriffsschrift", title: "Wikipedia: Begriffsschrift [5]"}]}
      - {id: principia-mathematica-1910, name: Principia Mathematica, year: 1910.0, lod: 3, one_line: "Whitehead & Russell begin deriving mathematics formally from logic", sources: [{url: "https://en.wikipedia.org/wiki/Principia_Mathematica", title: "Wikipedia: Principia Mathematica [6]"}]}
      - {id: principia-completed-1913, name: Principia Completed, year: 1913.0, lod: 4, one_line: "Final volume appears; Logic Theorist will prove its theorems in 1956", sources: [{url: "https://en.wikipedia.org/wiki/Principia_Mathematica", title: "Wikipedia: Principia Mathematica [6]"}]}
      - {id: hilbert-programme-1920, name: Hilbert's Programme, year: 1920.0, lod: 3, one_line: "1920s: finitary proof of consistency, completeness and decidability of mathematics", sources: [{url: "https://plato.stanford.edu/entries/hilbert-program/", title: "SEP, Hilbert's Program [8]"}]}
      - {id: entscheidungsproblem-1920, name: Entscheidungsproblem, year: 1920.5, lod: 4, one_line: "Hilbert's decision problem, which Church and Turing answer in 1936", sources: [{url: "https://plato.stanford.edu/entries/hilbert-program/", title: "SEP, Hilbert's Program [8]"}]}
      - {id: godel-incompleteness-1931, name: Gödel Incompleteness, year: 1931.0, lod: 2, one_line: "Limits of formal systems; later cited both for and against machine intelligence", sources: [{url: "https://doi.org/10.1007/BF01700692", title: "Gödel, Über formal unentscheidbare Sätze…, 1931 [9]"}]}
      - {id: stepped-reckoner-1673, name: "Stepped Reckoner", year: 1673.0, lod: 4, one_line: "Leibniz shows a wooden model of his four-function calculator to the Royal Society", sources: [{url: "https://en.wikipedia.org/wiki/Stepped_reckoner", title: "Wikipedia: Stepped reckoner [52]"}]}
      - {id: jacquard-loom-1804, name: "Jacquard Loom", year: 1804.0, lod: 4, one_line: "Jacquard patents a loom run by punched cards, later borrowed by Babbage", sources: [{url: "https://en.wikipedia.org/wiki/Jacquard_machine", title: "Wikipedia: Jacquard machine [53]"}]}
      - {id: difference-engine-1822, name: "Difference Engine", year: 1822.45, lod: 3, one_line: "Babbage announces a machine to compute mathematical tables automatically", sources: [{url: "https://en.wikipedia.org/wiki/Difference_engine", title: "Wikipedia: Difference engine [54]"}]}
      - {id: jevons-logic-piano-1870, name: "Jevons Logic Piano", year: 1870.0, lod: 4, one_line: "Jevons exhibits a mechanical computer for Boolean logic to the Royal Society", sources: [{url: "https://en.wikipedia.org/wiki/William_Stanley_Jevons", title: "Wikipedia: William Stanley Jevons [55]"}]}
      - {id: hollerith-tabulator-1890, name: "Hollerith Tabulator", year: 1890.0, lod: 4, one_line: "Punched-card tabulating machines process the 1890 US census", sources: [{url: "https://en.wikipedia.org/wiki/Tabulating_machine", title: "Wikipedia: Tabulating machine [56]"}]}
      - {id: hilbert-problems-1900, name: "Hilbert's 23 Problems", year: 1900.6, lod: 3, one_line: "Hilbert's problem list sets the agenda that leads to the Entscheidungsproblem", sources: [{url: "https://en.wikipedia.org/wiki/Hilbert%27s_problems", title: "Wikipedia: Hilbert's problems [57]"}]}
      - {id: russell-paradox-1901, name: "Russell's Paradox", year: 1901.0, lod: 4, one_line: "Russell's set-theoretic paradox undermines naive set theory and Frege's system", sources: [{url: "https://en.wikipedia.org/wiki/Russell%27s_paradox", title: "Wikipedia: Russell's paradox [58]"}]}
      - {id: markov-chains-1906, name: "Markov Chains", year: 1906.0, lod: 3, one_line: "Markov's first chain paper; later fed n-grams, HMMs and MDPs", sources: [{url: "https://en.wikipedia.org/wiki/Markov_chain", title: "Wikipedia: Markov chain [59]"}]}
      - {id: el-ajedrecista-1913, name: "El Ajedrecista", year: 1913.0, lod: 3, one_line: "Torres Quevedo's automaton plays a king-and-rook chess endgame unaided", sources: [{url: "https://en.wikipedia.org/wiki/El_Ajedrecista", title: "Wikipedia: El Ajedrecista [60]"}]}
      - {id: rur-robot-1920, name: "R.U.R.", year: 1920.0, lod: 4, one_line: "Čapek's play introduces the word robot", sources: [{url: "https://en.wikipedia.org/wiki/R.U.R.", title: "Wikipedia: R.U.R. [61]"}]}
      - {id: godel-completeness-1929, name: "Gödel Completeness", year: 1929.0, lod: 3, one_line: "Gödel proves every valid first-order formula is provable", sources: [{url: "https://en.wikipedia.org/wiki/G%C3%B6del%27s_completeness_theorem", title: "Wikipedia: Gödel's completeness theorem [62]"}]}
      - {id: differential-analyser-1931, name: "Differential Analyser", year: 1931.0, lod: 4, one_line: "Hazen and Bush complete a practical general-purpose analogue computer at MIT", sources: [{url: "https://en.wikipedia.org/wiki/Differential_analyser", title: "Wikipedia: Differential analyser [63]"}]}

  analytical-engine-isle:
    hint: "Babbage · Lovelace 1843"
    tag: "Analytical Engine → Lovelace's notes"
    events:
      - {id: analytical-engine-1837, name: Analytical Engine, year: 1837.0, lod: 3, one_line: "Babbage designs the first general-purpose programmable machine", sources: [{url: "https://en.wikipedia.org/wiki/Analytical_Engine", title: "Wikipedia: Analytical Engine [2]"}]}
      - {id: lovelace-notes-1843, name: Lovelace's Notes, year: 1843.5, lod: 3, one_line: "Notes on Menabrea's Sketch describe programming the Engine: the first published program", sources: [{url: "https://www.fourmilab.ch/babbage/sketch.html", title: "Menabrea/Lovelace, Sketch of the Analytical Engine, 1843 [3]"}]}
      - {id: lovelace-objection-1843, name: Lovelace's Objection, year: 1843.6, lod: 4, one_line: "The Engine \"has no pretensions to originate anything\"; Turing answers in 1950", sources: [{url: "https://www.fourmilab.ch/babbage/sketch.html", title: "Menabrea/Lovelace, Sketch of the Analytical Engine, 1843 [3]"}, {url: "https://redirect.cs.umbc.edu/courses/471/papers/turing.pdf", title: "Turing 1950 [7]"}]}

  computability-isle:
    hint: "Church · Turing 1936"
    tag: "Lambda calculus → Turing machine → Church–Turing thesis"
    events:
      - {id: church-lambda-calculus-1936, name: Lambda Calculus, year: 1936.3, lod: 3, one_line: "Church's independent negative answer to the Entscheidungsproblem; later underpins Lisp", sources: [{url: "https://doi.org/10.2307/2371045", title: "Church, An Unsolvable Problem of Elementary Number Theory, 1936 [10]"}]}
      - {id: turing-computable-numbers-1936, name: On Computable Numbers, year: 1936.9, lod: 1, one_line: "Turing defines the Turing machine and the universal machine: the theoretical computer", sources: [{url: "https://www.cs.virginia.edu/~robins/Turing_Paper_1936.pdf", title: "Turing, On Computable Numbers, 1936 [11]"}]}
      - {id: post-machine-1936, name: Post Machine, year: 1936.8, lod: 4, one_line: "Emil Post independently publishes an equivalent worker-and-boxes model", sources: [{url: "https://en.wikipedia.org/wiki/Emil_Leon_Post", title: "Wikipedia: Emil Leon Post [44]"}]}
      - {id: church-turing-thesis-1937, name: Church–Turing Thesis, year: 1937.0, lod: 4, one_line: "Church, Turing, Post and Kleene formulations prove equivalent: the Church–Turing thesis", sources: [{url: "https://en.wikipedia.org/wiki/Church%E2%80%93Turing_thesis", title: "Wikipedia: Church–Turing thesis [44]"}]}
      - {id: shannon-switching-1937, name: "Shannon Switching Thesis", year: 1937.5, lod: 3, one_line: "Shannon maps Boolean algebra onto relay circuits: logic becomes hardware", sources: [{url: "https://en.wikipedia.org/wiki/A_Symbolic_Analysis_of_Relay_and_Switching_Circuits", title: "Wikipedia: A Symbolic Analysis of Relay and Switching Circuits [64]"}, {url: "https://doi.org/10.1109/T-AIEE.1938.5057767", title: "Shannon, 'A Symbolic Analysis of Relay and Switching Circuits', Trans. AIEE 57 (1938), doi:10.1109/T-AIEE.1938.5057767 [65]"}]}
      - {id: zuse-z1-1938, name: "Zuse Z1", year: 1938.0, lod: 4, one_line: "Zuse finishes a motor-driven mechanical binary computer in Berlin", sources: [{url: "https://en.wikipedia.org/wiki/Z1_%28computer%29", title: "Wikipedia: Z1 (computer) [66]"}]}
      - {id: turing-ordinal-logics-1938, name: "Ordinal Logics", year: 1938.5, lod: 4, one_line: "Turing's Princeton thesis introduces oracle machines", sources: [{url: "https://en.wikipedia.org/wiki/Systems_of_Logic_Based_on_Ordinals", title: "Wikipedia: Systems of Logic Based on Ordinals [67]"}, {url: "https://api.crossref.org/works/10.1112/plms/s2-45.1.161", title: "Crossref record [68]"}]}
      - {id: bombe-1939, name: "The Bombe", year: 1939.5, lod: 3, one_line: "Turing's electromechanical search machine attacks Enigma at Bletchley Park", sources: [{url: "https://en.wikipedia.org/wiki/Bombe", title: "Wikipedia: Bombe [69]"}]}
      - {id: zuse-z3-1941, name: "Zuse Z3", year: 1941.0, lod: 4, one_line: "Zuse completes a working programmable electromechanical computer", sources: [{url: "https://en.wikipedia.org/wiki/Z3_%28computer%29", title: "Wikipedia: Z3 (computer) [70]"}]}
      - {id: atanasoff-berry-1942, name: "Atanasoff–Berry Computer", year: 1942.0, lod: 4, one_line: "Electronic digital solver for linear equations successfully tested", sources: [{url: "https://en.wikipedia.org/wiki/Atanasoff%E2%80%93Berry_computer", title: "Wikipedia: Atanasoff–Berry computer [71]"}]}
      - {id: asimov-three-laws-1942, name: "Asimov's Three Laws", year: 1942.2, lod: 4, one_line: "Asimov's story Runaround introduces the Three Laws of Robotics", sources: [{url: "https://en.wikipedia.org/wiki/Three_Laws_of_Robotics", title: "Wikipedia: Three Laws of Robotics [72]"}]}

# Symbolic Heartland — named events rendered INTO the map at zoom levels 3 and 4.
# Every row traces to research/02-dartmouth-and-early-symbolic-ai-1956-1974.md.
countries:
  logic-representation-plateau:
    hint: "Lisp 1958 · Resolution 1965"
    tag: "Dartmouth → Lisp → Resolution → Prolog"
    events:
      - id: dartmouth-workshop-1956
        name: Dartmouth Workshop
        year: 1956.6
        lod: 3
        one_line: "McCarthy, Minsky, Shannon and Rochester convene founding project and coin AI"
        sources:
          - url: "http://jmc.stanford.edu/articles/dartmouth/dartmouth.pdf"
            title: "McCarthy et al. 1955 [1]"
      - id: lisp-creation-1958
        name: Lisp Designed

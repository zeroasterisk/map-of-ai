        lod: 3
        one_line: "John McCarthy creates Lisp: recursion, list processing and dynamic memory"
        sources:
          - url: "http://jmc.stanford.edu/articles/recursive/recursive.pdf"
            title: "McCarthy 1960 [7]"
      - id: programs-common-sense-1959
        name: Advice Taker

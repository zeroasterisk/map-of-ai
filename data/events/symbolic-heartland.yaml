        sources:
          - url: "https://aitopics.org/misc/brief-history"
            title: "Green 1969 [35]"
      - id: prolog-creation-1972
        name: Prolog Created
        year: 1972.4
        lod: 3
        one_line: "Colmerauer & Roussel create Prolog with Kowalski Horn-clause logic"
        sources:
          - url: "https://en.wikipedia.org/wiki/Prolog"
            title: "Colmerauer & Kowalski 1972 [31]"
      - id: wang-prover-1959
        name: Wang's Prover
        year: 1959.5
        lod: 4
        one_line: "Hao Wang's IBM 704 program proves hundreds of Principia theorems in ~9 minutes"
        sources:
          - url: "https://en.wikipedia.org/wiki/Hao_Wang_%28academic%29"
            title: "Wikipedia: Hao Wang (academic) [39]"
      - id: lisp-cacm-paper-1960
        name: Lisp Paper
        year: 1960.3
        lod: 4
        one_line: "McCarthy's Recursive Functions of Symbolic Expressions appears in CACM"
        sources:
          - url: "https://en.wikipedia.org/wiki/Lisp_%28programming_language%29"
            title: "Wikipedia: Lisp (programming language) [7]"
      - id: solomonoff-induction-1964
        name: Solomonoff Induction
        year: 1964.3
        lod: 4
        one_line: "A Formal Theory of Inductive Inference: algorithmic probability, Parts I–II"
        sources:
          - url: "https://en.wikipedia.org/wiki/Ray_Solomonoff"
            title: "Wikipedia: Ray Solomonoff [49]"
      - id: planner-hewitt-1969
        name: PLANNER
        year: 1969.3
        lod: 4
        one_line: "Hewitt's procedural PLANNER: the scruffy counter-proposal to resolution"
        sources:
          - url: "https://en.wikipedia.org/wiki/Planner_%28programming_language%29"
            title: "Wikipedia: Planner (programming language) [45]"
      - id: frame-problem-1969
        name: The Frame Problem
        year: 1969.6
        lod: 3
        one_line: "McCarthy & Hayes introduce situation calculus and name the frame problem"
        sources:
          - url: "http://jmc.stanford.edu/articles/mcchay69/mcchay69.pdf"
            title: "McCarthy & Hayes, Some Philosophical Problems, 1969 [44]"
          - url: "https://en.wikipedia.org/wiki/Frame_problem"
            title: "Wikipedia: Frame problem [44]"
      - id: mccarthy-turing-award-1971
        name: McCarthy Turing Award
        year: 1971.5
        lod: 4
        one_line: "John McCarthy, coiner of 'AI' and designer of Lisp, receives the 1971 Turing Award"
        sources:
          - url: "https://en.wikipedia.org/wiki/John_McCarthy_%28computer_scientist%29"
            title: "Wikipedia: John McCarthy [14]"
      - {id: zadeh-fuzzy-sets-1965, name: "Fuzzy Sets", year: 1965.5, lod: 3, one_line: "Zadeh introduces graded set membership, root of fuzzy logic", sources: [{url: "https://en.wikipedia.org/wiki/Fuzzy_set", title: "Wikipedia: Fuzzy set [70]"}, {url: "https://doi.org/10.1016/S0019-9958%2865%2990241-X", title: "Zadeh, 'Fuzzy sets', Information and Control 8 (1965), doi:10.1016/S0019-9958(65)90241-X [71]"}]}
      - {id: vc-theory-1971, name: "VC Theory", year: 1971.0, lod: 3, one_line: "Vapnik and Chervonenkis prove uniform convergence: capacity-based learning theory", sources: [{url: "https://en.wikipedia.org/wiki/Vapnik%E2%80%93Chervonenkis_dimension", title: "Wikipedia: Vapnik–Chervonenkis dimension [82]"}, {url: "https://api.crossref.org/works/10.1137/1116025", title: "Crossref record [83]"}]}
      - {id: actor-model-1973, name: "Actor Model", year: 1973.0, lod: 4, one_line: "Hewitt, Bishop and Steiger model concurrent computation with actors", sources: [{url: "https://en.wikipedia.org/wiki/Actor_model", title: "Wikipedia: Actor model [86]"}]}


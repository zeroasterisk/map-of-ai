# The Transformer Plateau — named events rendered INTO the map at zoom levels 3 and 4 (same schema as
# deep-learning-basin.yaml / generative-coast.yaml). Every row traces to research/07-transformers-and-llms-2017-2022.md
# ("## Timeline of key events" + "## Sources" [n]) — nothing here is new research; every url is copied verbatim from
# that file's source list. `lod: 3` = headline event (labelled dot at z3 and z4, one_line at z4); `lod: 4` = detail
# event (z4 only). `hint` = the z1 landmark hint; `tag` = the z2 one-line tag.
# Positions are NOT stored: x = X(year), y = inside the country's own polygon (atlas.html).
# Events the brief suggested but which research/07 does not carry (DeBERTa, Base Layers) are deliberately NOT listed;
# national-champion-scalers is `spatial: false`, so its models (PanGu-α, ERNIE 3.0, YaLM-100B, Wu Dao 2.0) are drawn
# as detail events inside open-replication-commons / sparse-moe-engineers, the countries whose bullets also cite them.
countries:
  encoder-understanding-school:
    hint: "BERT · RoBERTa · T5"
    tag: "ELMo → BERT → RoBERTa → T5"
    events:
      - {id: ulmfit-2018, name: ULMFiT, year: 2018.05, lod: 4, one_line: "Howard & Ruder: LM pre-training + fine-tuning transfers to text classification (18 Jan)", sources: [{url: https://arxiv.org/abs/1801.06146, title: "Howard & Ruder, ULMFiT, arXiv 1801.06146 [46]"}]}
      - {id: elmo-2018, name: ELMo, year: 2018.12, lod: 4, one_line: "Peters et al.: contextual embeddings from a bidirectional LSTM — the last pre-Transformer win", sources: [{url: https://arxiv.org/abs/1802.05365, title: "Peters et al., ELMo, arXiv 1802.05365 [4]"}]}
      - {id: glue-2018, name: GLUE, year: 2018.3, lod: 4, one_line: "Wang, Bowman et al. (NYU/UW/DeepMind): the leaderboard BERT, XLNet, RoBERTa, T5 race up", sources: [{url: https://arxiv.org/abs/1804.07461, title: "Wang et al., GLUE, arXiv 1804.07461 [47]"}]}
      - {id: bert-2018, name: BERT, year: 2018.78, lod: 3, one_line: "Devlin et al. (11 Oct 2018): encoder-only bidirectional pre-training tops GLUE, SQuAD, SWAG", sources: [{url: https://arxiv.org/abs/1810.04805, title: "Devlin et al., BERT, arXiv 1810.04805 [7]"}, {url: https://en.wikipedia.org/wiki/BERT_%28language_model%29, title: "Wikipedia: BERT [8]"}]}
      - {id: transformer-xl-2019, name: Transformer-XL, year: 2019.02, lod: 4, one_line: "CMU/Google (9 Jan 2019): recurrence over segments for longer context", sources: [{url: https://arxiv.org/abs/1901.02860, title: "Dai et al., Transformer-XL, arXiv 1901.02860 [56]"}]}
      - {id: superglue-2019, name: SuperGLUE, year: 2019.34, lod: 4, one_line: "a stickier benchmark (2 May 2019) after models pass GLUE's human baseline", sources: [{url: https://arxiv.org/abs/1905.00537, title: "Wang et al., SuperGLUE, arXiv 1905.00537 [48]"}]}
      - {id: xlnet-2019, name: XLNet, year: 2019.47, lod: 4, one_line: "generalised autoregressive pre-training (19 Jun 2019) beats BERT on 20 tasks", sources: [{url: https://arxiv.org/abs/1906.08237, title: "Yang et al., XLNet, arXiv 1906.08237 [53]"}]}
      - {id: roberta-2019, name: RoBERTa, year: 2019.57, lod: 3, one_line: "Facebook AI (26 Jul 2019): BERT trained longer on more data retakes GLUE", sources: [{url: https://arxiv.org/abs/1907.11692, title: "Liu et al., RoBERTa, arXiv 1907.11692 [54]"}]}
      - {id: distilbert-2019, name: DistilBERT, year: 2019.75, lod: 4, one_line: "Hugging Face (2 Oct 2019): distillation for deployment — 40 % smaller, 60 % faster", sources: [{url: https://arxiv.org/abs/1910.01108, title: "Sanh et al., DistilBERT, arXiv 1910.01108 [55]"}]}
      - {id: t5-2019, name: T5 · C4, year: 2019.81, lod: 3, one_line: "Raffel et al. (23 Oct 2019): every NLP task as text-to-text; introduces the C4 corpus", sources: [{url: https://arxiv.org/abs/1910.10683, title: "Raffel et al., T5, arXiv 1910.10683 [30]"}, {url: https://en.wikipedia.org/wiki/T5_%28language_model%29, title: "Wikipedia: T5 [31]"}]}
      - {id: rag-2020, name: RAG, year: 2020.4, lod: 4, one_line: "Lewis et al.: retrieval-augmented generation — the eastern border of the encoder camp", sources: [{url: https://arxiv.org/abs/2005.11401, title: "Lewis et al., RAG, arXiv 2005.11401 [89]"}]}

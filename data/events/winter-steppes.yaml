# Winter Steppes — named events rendered INTO the map at zoom levels 3 and 4.
# Every row traces to research/03-ai-winters-and-expert-systems-1974-1993.md (timeline, Key people,
# Schools of thought, Map notes); every url is one already cited in its ## Sources.
countries:
  funding-passes:
    hint: "Winter 1974 · Lisp crash 1987"
    tag: "Escarpment 1974 → 'AI winter' 1984 → crash 1987 → fog 1993"
    events:
      - id: first-ai-winter-1974
        name: First AI Winter
        year: 1974.0
        lod: 1
        one_line: "DARPA cuts basic AI funding after the 1973 Lighthill Report: the First Winter escarpment"
        sources:
          - url: "https://en.wikipedia.org/wiki/AI_winter"
            title: "AI winter — Wikipedia [1]"
      - id: lighthill-pass-1974
        name: Lighthill Pass
        year: 1974.2
        lod: 4
        one_line: "Post-Lighthill, UK AI survives only at Edinburgh, Essex and Sussex"
        sources:
          - url: "https://en.wikipedia.org/wiki/History_of_artificial_intelligence"
            title: "History of artificial intelligence — Wikipedia [2]"
      - id: speech-understanding-end-1976
        name: SUR Programme Closes
        year: 1976.5
        lod: 4
        one_line: "DARPA's Speech Understanding Research programme closes with Hearsay-II's demo"
        sources:
          - url: "https://ai.stanford.edu/~nilsson/QAI/qai.pdf"
            title: "Nilsson, The Quest for AI (2010) [37]"
      - id: ai-winter-coined-1984
        name: "'AI Winter' Coined"
        year: 1984.6
        lod: 2
        one_line: "Schank and Minsky warn at AAAI 1984 that the AI business bubble will burst"
        sources:
          - url: "https://en.wikipedia.org/wiki/AI_winter"
            title: "AI winter — Wikipedia [1]"
      - id: lisp-machine-crash-1987
        name: Lisp Machine Crash
        year: 1987.3
        lod: 1
        one_line: "Cheaper Sun/Apple workstations and PCs running Lisp kill the Lisp-machine market"
        sources:
          - url: "https://en.wikipedia.org/wiki/Lisp_machine"
            title: "Lisp machine — Wikipedia [14]"
          - url: "https://en.wikipedia.org/wiki/AI_winter"
            title: "AI winter — Wikipedia [1]"
      - id: sci-cuts-ai-1988
        name: SCI Cuts AI Spending
        year: 1988.3
        lod: 3
        one_line: "The Strategic Computing Initiative cancels new AI spending: government retreats"
        sources:
          - url: "https://en.wikipedia.org/wiki/AI_winter"
            title: "AI winter — Wikipedia [1]"
          - url: "https://en.wikipedia.org/wiki/Strategic_Computing_Initiative"
            title: "Strategic Computing Initiative — Wikipedia [19]"
      - id: fifth-generation-ends-1992
        name: Fifth Generation Ends
        year: 1992.4
        lod: 3
        one_line: "ICOT's ten-year plan concludes short of its original goals; wind-down to 1994"
        sources:
          - url: "https://en.wikipedia.org/wiki/Fifth_Generation_Computer_Systems"
            title: "Fifth Generation Computer Systems — Wikipedia [15]"
      - id: lisp-companies-fail-1993
        name: Symbolics Fails
        year: 1993.0
        lod: 3
        one_line: "Symbolics and most Lisp-machine companies fail or exit the market"
        sources:
          - url: "https://en.wikipedia.org/wiki/Symbolics"
            title: "Symbolics — Wikipedia [13]"
          - url: "https://en.wikipedia.org/wiki/Lisp_machine"
            title: "Lisp machine — Wikipedia [14]"
      - id: sci-concludes-1993
        name: SCI Concludes
        year: 1993.0
        lod: 4
        one_line: "DARPA's decade-long, ~$1B Strategic Computing Initiative comes to an end"
        sources:
          - url: "https://en.wikipedia.org/wiki/Strategic_Computing_Initiative"
            title: "Strategic Computing Initiative — Wikipedia [19]"
      - id: ai-fog-bank-1993
        name: The 1993 Fog Bank
        year: 1993.0
        lod: 3
        one_line: "'AI' becomes a label to avoid; work continues as ML, informatics, knowledge systems"
        sources:
          - url: "https://en.wikipedia.org/wiki/AI_winter"
            title: "AI winter — Wikipedia [1]"
          - url: "https://en.wikipedia.org/wiki/History_of_artificial_intelligence"
            title: "History of artificial intelligence — Wikipedia [2]"


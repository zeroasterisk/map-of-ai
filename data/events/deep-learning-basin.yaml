# Deep Learning Basin — named events rendered INTO the map at zoom levels 3 and 4 (PILOT, this continent only).
# Every row traces to research/06-deep-learning-revolution-2006-2017.md ([n] = its source number) — nothing here is
# new research. `lod: 3` = headline event (labelled dot at z3 and z4, with its one_line at z4); `lod: 4` = detail
# event (z4 only). `hint` = the z1 landmark hint (basin only; 4 largest countries); `tag` = the z2 one-line tag.
# Positions are NOT stored: x = X(year) on the time axis, y = inside the country's own polygon (atlas.html), with
# the same collision-avoidance / leader fallback the country labels use.
countries:
  gpu-convnet-school:
    hint: "ImageNet · AlexNet 2012"
    tag: "ImageNet → AlexNet → ResNet"
    events:
      - {id: imagenet-2009, name: ImageNet, year: 2009.5, lod: 3, one_line: "Deng et al., CVPR 2009: ~14 M images labelled via Mechanical Turk", sources: [{url: https://image-net.org/static_files/papers/imagenet_cvpr09.pdf, title: "Deng et al., ImageNet, CVPR 2009 [7]"}, {url: https://en.wikipedia.org/wiki/ImageNet, title: "Wikipedia: ImageNet [8]"}]}

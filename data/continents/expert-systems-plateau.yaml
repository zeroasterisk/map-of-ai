id: expert-systems-plateau
level: continent
name: The Expert Systems Plateau
subtitle: "Knowledge engineering, expert systems and the Fifth Generation boom, 1980–1993"
summary: >
  Sheltered as a warm commercial plateau between the two AI winters, the Expert Systems
  Plateau realized Edward Feigenbaum's thesis that domain knowledge—not general heuristic
  search—is the primary source of intelligent power. The boom ignited in 1980 when John
  McDermott's R1/XCON rule-based configurer, built in Charles Forgy's OPS5 production
  system, entered production at Digital Equipment Corporation, eventually saving DEC
  twenty-five million dollars annually and inspiring two-thirds of Fortune 500 corporations
  to establish knowledge-engineering groups. Formal knowledge representation matured in
  parallel through McCarthy's circumscription, Reiter's default logic (1980), Brachman's
  KL-ONE description logic (1985), Laird, Newell, and Rosenbloom's SOAR architecture
  (1987), and Douglas Lenat's Cyc ontology project (1984). In 1982, Japan's Ministry of
  International Trade and Industry launched the ten-year Fifth Generation Computer Systems
  project (ICOT) around massively parallel Prolog machines, triggering matching state
  interventions across the United States (DARPA's Strategic Computing Initiative and the
  MCC consortium), Britain (the Alvey Programme), and Europe (ESPRIT), alongside a
  hundred-million-dollar Lisp-machine hardware industry led by Symbolics and LMI until
  commodity RISC workstations and maintenance brittleness closed the era by 1993.

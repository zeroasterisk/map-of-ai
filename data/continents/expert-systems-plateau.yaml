id: expert-systems-plateau
level: continent
name: The Expert Systems Plateau
subtitle: "Knowledge engineering, expert systems and the Fifth Generation boom, 1980–1993"
summary: >
  The warm valley between the two AI winters, sitting at the symbolic/logic pole.
  Its western edge is 1980, when John McDermott's R1/XCON, written in OPS5, went into
  production at Digital Equipment's Salem, New Hampshire plant; by 1986 it had
  processed 80,000 orders and was saving DEC an estimated $25M a year, and
  corporations worldwide were building in-house AI groups. Knowledge engineering
  spread through shells such as EMYCIN and NASA's CLIPS, while PROSPECTOR's 1982
  molybdenum find became the boom's most-cited non-medical success. Formal knowledge
  representation matured alongside: circumscription and default logic (1980),
  qualitative process theory, KL-ONE (1985) and the Soar architecture (1987), and
  Douglas Lenat began hand-coding commonsense in Cyc at MCC in 1984. Japan's Fifth
  Generation Computer Systems project (1982) provoked DARPA's Strategic Computing
  Initiative, the UK's Alvey Programme and Europe's ESPRIT, and a Lisp-machine
  industry led by Symbolics grew to hundreds of millions of dollars. The plateau
  fades east after the 1987 Lisp-machine crash; the Fifth Generation's ten-year plan
  concluded in 1992 without meeting its original goals, and the ground dissolves into
  the 1993 fog bank.

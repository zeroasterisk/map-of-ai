id: generative-coast
level: continent
name: The Generative Coast
subtitle: "Chat assistants, open-weight models, reasoning models and agents, 2022–present"
summary: >
  ChatGPT's release on 30 November 2022 turned GPT-3.5 plus RLHF into a mass
  consumer product that reached 100 million monthly users within two months,
  and the years since have been a compressed arms race across three fronts. On
  the model front the frontier labs shipped multimodal generalists — GPT-4
  (14 March 2023), Claude (March 2023), Gemini (6 December 2023), GPT-4o (May
  2024) — while diffusion models (DALL-E 2, Midjourney and Stable Diffusion in
  2022; Sora video in 2024) made image, audio and video generation ordinary. On
  the openness front Meta's LLaMA weights leaked in March 2023 and Llama 2/3
  were then released deliberately; Mistral, Qwen and DeepSeek followed, and
  DeepSeek-R1 (20 January 2025) showed an open-weights Chinese lab matching
  OpenAI's o1 reasoning model. On the agency front, test-time-compute reasoning
  models (o1, September 2024), computer use (October 2024), the Model Context
  Protocol (November 2024) and terminal coding agents (Claude Code, 2025) turned
  chat assistants into systems that plan, call tools and act. Around all of
  this grew a governance and hardware superstructure: the Bletchley Declaration
  (November 2023), the EU AI Act (in force 1 August 2024), Nvidia's Hopper to
  Blackwell cycle, and the 2024 Nobel Prizes in Physics (Hopfield, Hinton) and
  Chemistry (Baker, Hassabis, Jumper) that formally canonised deep learning.

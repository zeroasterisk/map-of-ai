name: The Antecedent Isles
subtitle: "Logic, computability and the mathematical prehistory of AI, 1666–1942"
summary: >
  Rising from the Western Sea before the 1943 mainland coast, the Antecedent Isles
  chart the three-century mathematical and philosophical prehistory that made
  artificial intelligence possible. On the outermost seventeenth-century island,
  Gottfried Wilhelm Leibniz envisioned a characteristica universalis and a calculus
  ratiocinator capable of resolving human disputes by mechanical calculation. In the
  nineteenth century, Charles Babbage designed the programmable Analytical Engine while
  Ada Lovelace penned the first published algorithm and posed her famous objection that
  machines cannot originate anything new. George Boole reduced propositional reasoning
  to algebra in 1854, and Gottlob Frege's 1879 Begriffsschrift forged modern predicate
  logic with quantifiers—the direct formal language of symbolic AI. In the early
  twentieth century, Whitehead and Russell's Principia Mathematica attempted to derive
  all mathematics from logic, inspiring David Hilbert's programme to prove mathematics
  complete, consistent, and decidable. That programme shattered against Kurt Gödel's
  1931 incompleteness theorems, and in 1936 Alonzo Church's lambda calculus and Alan
  Turing's universal computing machine independently answered Hilbert's
  Entscheidungsproblem in the negative, defining mechanical computation itself on the
  eve of the electronic computer.

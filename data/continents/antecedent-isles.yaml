id: antecedent-isles
level: continent
name: The Antecedent Isles
subtitle: "Logic, computability and the mathematical prehistory of AI, 1666–1942"
summary: >
  An offshore archipelago west of the 1943 coastline, holding the logic and
  computability ideas that came before anyone spoke of artificial intelligence.
  Leibniz's characteristica universalis and calculus ratiocinator (1666–1679)
  imagined reasoning reduced to calculation, and they form the outermost isle.
  Babbage designed the Analytical Engine from 1837, and Ada Lovelace's 1843 notes
  described how to program it. The same notes argued that the machine "has no
  pretensions to originate anything", an objection Turing answered in 1950.
  Boole's Laws of Thought (1854) treated reasoning as algebra. Frege's
  Begriffsschrift (1879) introduced predicate logic with quantifiers, and
  Whitehead and Russell's Principia Mathematica (1910–1913) derived mathematics
  from logic. Hilbert's programme of the 1920s posed the Entscheidungsproblem,
  and Gödel's incompleteness theorems (1931) set limits on formal systems. In
  1936 Church's lambda calculus and Turing's universal machine, with Post's
  equivalent model, answered Hilbert in the negative and defined what a computer
  is. The Turing isle, largest and nearest, is drawn with a causeway to the
  shore. These isles are indispensable context but are not AI research, which
  is why they sit offshore on a log-compressed scale.

name: The Symbolic Heartland
subtitle: "Dartmouth and the golden age of symbolic AI, 1956–1974"
summary: >
  Between 1956 and 1974, artificial intelligence was founded and developed as the
  study of physical symbol systems and heuristic search. Coined at the 1956 Dartmouth
  Summer Research Project, the discipline coalesced around Allen Newell, J. C. Shaw,
  and Herbert Simon's Logic Theorist and General Problem Solver, formalizing means–ends
  analysis. John McCarthy created Lisp (1958) and proposed logic-based commonsense
  reasoning, while J. Alan Robinson's resolution principle (1965) unified first-order
  theorem proving, later giving rise to Prolog (1972). At MIT, Marvin Minsky's group
  explored semantic micro-worlds, producing Bobrow's STUDENT, Weizenbaum's ELIZA (1966),
  and Winograd's SHRDLU (1970). At SRI, Shakey the Robot (1966–1972) integrated computer
  vision, A* pathfinding (1968), and STRIPS automated planning (1971). Meanwhile,
  Frank Rosenblatt's perceptron (1957–1958) and Widrow's ADALINE pioneered neural
  learning until Minsky and Papert's Perceptrons (1969), the ALPAC report (1966),
  the Mansfield Amendment, and the 1973 Lighthill Report brought the era to a close.

notes: >
  P3 continent for REGISTRY.md row 2 (The Cybernetic Shore). Content is the
  shore half of the research/01 split table (P1-T11): timeline rows 10–36 and
  school bullets Turing test & philosophy, Cybernetics, Neural modelling &
  learning machines, Information theory & game search, and Machine translation.
  Biome `mixed` (SPEC.md §2.6 justification, REGISTRY.md D7): the shore is
  half logic (McCulloch–Pitts is a paper about propositional logic) and half
  control/neural (Wiener, Ashby, Hebb, SNARC). The span ends 1956 so that
  Kleene's Automata Studies paper (1956) and the IBM 701 checkers demo can sit
  on the delta. The 1956 workshop itself belongs to symbolic-heartland.

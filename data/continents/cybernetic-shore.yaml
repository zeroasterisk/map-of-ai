id: cybernetic-shore
level: continent
name: The Cybernetic Shore
subtitle: "Cybernetics, neural modelling and the first thinking-machine programmes, 1943–1956"
summary: >
  The first mainland of the map, running from the 1943 west coast to the
  Dartmouth delta. Two rivers cross it. The cybernetic and neural river starts
  with McCulloch and Pitts (1943), who showed that networks of idealised neurons
  can compute any logical function, and with Rosenblueth, Wiener and Bigelow's
  account of feedback and purpose. It flows through the Macy Conferences
  (1946–1953), Wiener's Cybernetics (1948), Grey Walter's tortoises, Ashby's
  Homeostat, Britain's Ratio Club, Hebb's learning rule (1949), Shannon's
  maze-solving mouse Theseus (1950) and Minsky and Edmonds's SNARC (1951). The
  logic and computing river brings von Neumann's EDVAC report (1945), Shannon's
  information theory (1948) and his chess paper (1950), and the first game
  programs on the Ferranti Mark 1 and the IBM 701. Turing's Computing Machinery
  and Intelligence (1950) proposed the imitation game. Weaver's 1949 memorandum
  and the 1954 Georgetown–IBM demonstration started machine translation. The
  Soviet press denounced cybernetics from 1950 to 1954, and the Paris colloque
  of 1951 carried it to continental Europe. The two rivers meet where McCarthy,
  Minsky, Rochester and Shannon's 1955 Dartmouth proposal named the field.

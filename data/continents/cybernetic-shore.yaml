name: The Cybernetic Shore
subtitle: "Cybernetics, neural modelling and the first thinking-machine programmes, 1943–1956"
summary: >
  The Cybernetic Shore forms the westernmost coastline of the AI mainland, opening in
  1943 when Warren McCulloch and Walter Pitts proved that networks of idealized binary
  neurons could compute any logical proposition, while Arturo Rosenblueth, Norbert
  Wiener, and Julian Bigelow identified negative feedback as the physical mechanism of
  purposive behavior. Following John von Neumann's 1945 EDVAC report and the first
  stored-program electronic computers, the Macy Conferences (1946–1953) in New York and
  the Ratio Club in Britain united neurophysiologists, mathematicians, and engineers around
  Wiener's Cybernetics (1948) and Claude Shannon's information theory (1948). Along the
  embodied southern coast, W. Grey Walter built autonomous light-seeking tortoises, Ross
  Ashby constructed the ultrastable Homeostat, Donald Hebb formulated synaptic plasticity
  (1949), Shannon built the maze-learning mouse Theseus (1950), and Marvin Minsky and Dean
  Edmonds wired the 40-synapse SNARC learning machine (1951). In the northern and central
  highlands, Alan Turing's 1950 Mind paper posed the Imitation Game, Shannon and Arthur
  Samuel pioneered chess and self-learning checkers programs, the 1954 Georgetown-IBM
  demonstration launched machine translation, and the 1955 Dartmouth proposal coined
  artificial intelligence.

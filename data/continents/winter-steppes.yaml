id: winter-steppes
level: continent
name: The Winter Steppes
subtitle: "The two AI winters — funding collapse and retrenchment, 1974–1993"
summary: >
  The northern steppe of the knowledge era, drawn as sparse frozen ground on either
  side of the expert-systems boom. Its western border is the First Winter escarpment
  of 1974, when DARPA cut back basic AI funding in the United States following the
  1973 Lighthill Report in the UK, and British AI survived only at Edinburgh, Essex
  and Sussex. On that cold western band the field regrouped: Newell and Simon stated
  the physical symbol system hypothesis (1975), MYCIN and PROSPECTOR showed rule-based
  consultants could rival specialists, Hearsay-II introduced the blackboard, and
  Feigenbaum declared that "knowledge is power" (1977). AAAI was founded in 1979.
  Critics kept the ground contested throughout: Weizenbaum (1976), Searle's Chinese
  Room (1980), the Dreyfus brothers' Mind over Machine (1986) and Brooks's
  anti-representationalist manifestos (1990–91). The eastern frozen band begins in
  1987, when the Lisp-machine market collapsed; the Strategic Computing Initiative
  cut new AI spending in 1988, and by 1993 "AI" had become a label researchers avoided.
  The eastern border is a fog bank rather than a cliff: the field does not end, it
  renames itself as machine learning, knowledge-based systems and informatics.

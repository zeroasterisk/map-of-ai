id: deep-learning-basin
level: continent
name: The Deep Learning Basin
subtitle: "GPU-trained deep neural networks from DBNs to AlphaGo, 2006–2017"
summary: >
  Between 2006 and 2017 multi-layer neural networks went from an unfashionable
  niche to the default method for perception, language and control, and the
  phrase "deep learning" replaced "neural networks" as the banner of the
  connectionist pole. The era opens quietly with Hinton, Osindero and Teh's
  greedy layer-wise pre-training of deep belief nets (2006); it acquires its
  engine when Raina, Madhavan and Ng (2009) and Cireşan, Meier and Schmidhuber
  at IDSIA (2011–12) show that Nvidia GPUs make training large convolutional
  nets practical, and its fuel when Fei-Fei Li's group releases ImageNet (2009)
  and launches the ILSVRC challenge (2010). The decisive event is AlexNet at
  ILSVRC 2012 — a top-5 error of 15.3% against 26.2% for the runner-up — which
  convinced industry to buy the field: Google acquired DNNresearch (2013) and
  DeepMind (2014), Facebook hired LeCun to found FAIR (2013), and OpenAI was
  founded (2015). In the five years that followed nearly the whole vocabulary of
  modern deep learning was written: word2vec (2013), DQN (2013/2015), VAEs and
  GANs (2013–14), seq2seq and attention (2014), VGG, GoogLeNet and ResNet
  (2014–15), Adam and batch normalisation, open frameworks from Theano to
  TensorFlow and PyTorch, and Google's TPU. AlphaGo's 4–1 defeat of Lee Sedol in
  March 2016 was the era's Deep-Blue moment; "Attention Is All You Need"
  (June 2017) hands the map to the Transformer Plateau. The founders were
  canonised retroactively with the 2018 Turing Award to Bengio, Hinton and
  LeCun and the 2024 Nobel Prize in Physics to Hopfield and Hinton.

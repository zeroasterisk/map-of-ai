notes: >
  P2-T8 (REGISTRY.md row 8). Band per A-C5: research/06 "Map placement" says
  "Y = connectionist pole (the whole continent sits on the connectionist /
  statistical bank; a narrow generative-modelling shoreline and a deep-RL delta
  reach toward the middle of the map)" -> connectionist pole = S2 home, the
  language work (word2vec, seq2seq, GNMT) = C, the RL delta (DQN, AlphaGo) = S1;
  hence the registry span C-S2 = [C, S1, S2], home S2 -> C -> S1 in that order
  of arrival. The registry deliberately caps the basin at C (the N2 reach in
  the older SPEC.md §2.10 example is superseded by REGISTRY.md D6); AlphaGo's
  MCTS and Neural Turing Machines are drawn as a causeway toward N2, not as
  territory (research/06 map notes). Neighbours left for P2-T12:
  pending-neighbour: statistical-isthmus (west, wall: "the ILSVRC 2012 fault
  line - SVM-plus-hand-crafted-features on one side, learned features on the
  other - with the 2006 DBN papers as the foothills that precede it");
  pending-neighbour: transformer-plateau (east, bridge: "the Attention River
  ... leaves the map eastward at Vaswani 2017", 12 June 2017);
  pending-neighbour: connectionist-revival (south-west, bridge: LeNet /
  Boltzmann-machine lineage from file 04). Schmidhuber/IDSIA priority claims
  vs AlexNet are a live dispute (research/06 open question 2).
  authored-after-coverage-review: research/06 is Status reviewed (P1-T6).

name: The Statistical Isthmus
subtitle: "Probabilistic, Bayesian and statistical machine learning, 1988–2011"
summary: >
  Between 1988 and 2011, artificial intelligence shifted from hand-crafted
  knowledge bases toward rigorous statistical foundations, probabilistic reasoning,
  and benchmark-driven learning. Judea Pearl's 1988 treatise established Bayesian
  networks and belief propagation as the principled calculus for reasoning under
  uncertainty. Vladimir Vapnik and Corinna Cortes introduced support-vector machines
  at AT&T Bell Labs (1995), providing strong generalization bounds through VC theory
  and kernel methods. In parallel, Leo Breiman and Jerome Friedman pioneered tree
  ensembles—bagging (1996), random forests (2001), and gradient boosting (2001)—defining
  the algorithmic culture of practical machine learning. Natural language processing
  and speech recognition abandoned rule systems for hidden Markov models, the Penn
  Treebank (1993), IBM statistical translation (1993), and BLEU (2002), culminating
  in the "unreasonable effectiveness of data" (2009). The era established landmark
  public achievements—Deep Blue defeating Kasparov (1997), Stanley winning the DARPA
  Grand Challenge (2005), and Watson winning Jeopardy! (2011)—and institutionalized
  the modern ML conference, benchmark, and open-source software ecosystem.

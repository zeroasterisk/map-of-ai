id: transformer-plateau
level: continent
name: The Transformer Plateau
subtitle: "Attention, pre-trained language models and scaling laws, 2017–2022"
summary: >
  Between 2017 and 2022 the Transformer architecture unified deep learning across
  language, vision, code and structural biology, while empirical scaling laws turned
  compute into a predictable capability dial. The era opens with Vaswani et al.'s
  "Attention Is All You Need" (June 2017), which discarded recurrence and convolution
  in favour of self-attention, enabling massive parallelisation across GPU clusters.
  Within two years the pre-training-plus-fine-tuning paradigm bifurcated into
  bidirectional masked-language models (Devlin et al.'s BERT, 2018) for language
  understanding and autoregressive generative models (Radford et al.'s GPT-1 and
  GPT-2, 2018–2019) for open-ended generation. Kaplan et al.'s formulation of neural
  scaling laws (January 2020) demonstrated that cross-entropy loss drops as a smooth
  power law of compute, dataset size and parameter count, directly motivating OpenAI's
  175-billion-parameter GPT-3 (May 2020) and revealing emergent few-shot in-context
  learning. Attention rapidly crossed modality boundaries with the Vision Transformer
  (ViT, 2020), CLIP (2021), Codex (2021) and DeepMind's AlphaFold 2 (2020–2021),
  which solved the 50-year protein-folding challenge. Systems innovations including
  Nvidia's Megatron-LM and A100 GPU alongside Microsoft's DeepSpeed made training
  100B+ models viable, while Hoffmann et al.'s Chinchilla (2022) recalibrated
  compute-optimal training toward token volume. The period concluded with the
  foundational mechanisms of modern AI established: instruction tuning and
  reinforcement learning from human feedback (InstructGPT, March 2022) assembled the
  alignment recipe, while open-weights efforts like EleutherAI, OPT-175B and BLOOM
  mounted early counterweights to proprietary APIs just prior to the public arrival of
  ChatGPT in November 2022.

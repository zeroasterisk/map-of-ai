id: connectionist-revival
level: continent
name: The Connectionist Revival
subtitle: "Hopfield nets, backpropagation and the PDP era of neural networks, 1982–1998"
summary: >
  Following the first neural network winter, the second connectionist wave emerged
  vigorously in the 1980s. John Hopfield's 1982 associative memory network imported
  statistical physics into neural modeling, while Geoffrey Hinton and Terry Sejnowski
  formulated the stochastic Boltzmann machine (1985). In 1986, Rumelhart, Hinton, and
  Williams published backpropagation in Nature, and the Parallel Distributed Processing
  (PDP) books established distributed representation as a cognitive foundation. The era
  produced foundational modern architectures: Yann LeCun's convolutional networks for
  zip codes (1989) and LeNet-5 (1998), Hochreiter and Schmidhuber's Long Short-Term
  Memory (LSTM, 1997), Jordan and Elman recurrent networks (1986–1990), and Tesauro's
  TD-Gammon (1992) uniting temporal-difference learning with neural nets. NIPS (1987)
  and Neural Computation (1989) formed the community's lasting institutions, maintaining
  connectionist momentum until the 2006 deep learning revolution.
